# Dependabot is scoped to GitHub Actions only. Renovate (renovate.json) owns npm.
#
# Both tools previously ran across npm as well, deliberately: every Renovate run
# in this org had been suppressed by Mend's platform-level `mode=silent`, so
# Dependabot was enabled to keep dependency updates visible while the two were
# compared. Renovate is now producing PRs, and the comparison is settled.
#
# Renovate owns npm because it is the only one of the two that can honor the
# Node 24 pin (ADR-081). Renovate auto-detects the constraint from `engines.node`
# and `.nvmrc` and filters candidate releases through `constraintsFiltering:
# "strict"`, so a runtime dependency requiring a newer Node is never proposed.
# That filter is scoped to `dependencies` in renovate.json — deliberately, since
# strict filtering across devDependencies excludes far more than expected — so
# devDependencies fall back to the same CI backstop everything else has:
# `pnpm check:node-pin` plus pnpm's `engineStrict`.
#
# Dependabot has no equivalent filter at any scope — its ignore / allow /
# versioning-strategy / groups levers all operate on the semver update *type*,
# never on runtime compatibility, so it cannot be told "only propose updates
# whose engines.node overlaps ours".
#
# Running both across npm also produced two competing PRs for every update, each
# needing the same manual fix (e.g. #578 and #564 on 2026-08-01, both red because
# the group carried a prettier bump neither bot reformats for).
#
# Actions are a different story: there is no runtime-compatibility question in a
# `uses:` pin, so Dependabot's semver-only view is sufficient and its Actions
# support is good. It keeps that job.
#
# Security alerts are unaffected by this file — Dependabot security updates are
# configured in repository settings, not here, and continue to cover npm.
version: 2

updates:
  # --- workflow action pins ---
  # SHA-pinned per security.md; Dependabot updates the pin and the trailing
  # version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
