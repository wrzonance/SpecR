name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint + tsc + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

  # ─── Test ────────────────────────────────────────────────────────────
  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: specr
          POSTGRES_PASSWORD: specr
          POSTGRES_DB: specr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://specr:specr@localhost:5432/specr_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm migrate

      - name: Run unit tests
        run: pnpm test --reporter=verbose

      - name: Run integration tests
        run: pnpm test:integration --reporter=verbose

      - name: Check coverage threshold (80%)
        run: pnpm test:coverage

  # ─── Build ──────────────────────────────────────────────────────────
  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate OpenAPI schema
        run: |
          if [ -f openapi.yaml ]; then
            pnpm exec redocly lint openapi.yaml
          else
            echo "openapi.yaml not yet present — skipping"
          fi

  # ─── LOC Check ──────────────────────────────────────────────────────
  # PR-only: warns (does not fail) if LOC delta exceeds 500 lines.
  # Excludes: test fixtures, reference docs, migrations, lockfile, openapi.
  loc-check:
    name: LOC delta check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute LOC delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DELTA=$(git diff --stat "$BASE_SHA"..."$HEAD_SHA" -- \
            ':!pnpm-lock.yaml' \
            ':!tests/fixtures/**' \
            ':!docs/references/**' \
            ':!src/db/migrations/**' \
            ':!openapi.yaml' \
            ':!*.SEC' \
            ':!*.docx' \
            | tail -1 \
            | grep -oP '\d+ insertion' | grep -oP '^\d+' || echo 0)

          DELETIONS=$(git diff --stat "$BASE_SHA"..."$HEAD_SHA" -- \
            ':!pnpm-lock.yaml' \
            ':!tests/fixtures/**' \
            ':!docs/references/**' \
            ':!src/db/migrations/**' \
            ':!openapi.yaml' \
            ':!*.SEC' \
            ':!*.docx' \
            | tail -1 \
            | grep -oP '\d+ deletion' | grep -oP '^\d+' || echo 0)

          TOTAL=$((DELTA + DELETIONS))
          echo "LOC delta: +${DELTA} -${DELETIONS} (total churn: ${TOTAL})"

          if [ "$TOTAL" -gt 500 ]; then
            echo "::warning::LOC delta (${TOTAL}) exceeds 500-line sub-MVP limit. Consider splitting this PR."
          fi
