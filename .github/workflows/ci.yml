name: CI

on:
  push:
    branches: ["main"]
  # No base-branch filter: stacked sub-MVP PRs target feature branches and
  # must pass CI independently (CLAUDE.md PR discipline).
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  PNPM_VERSION: "11.17.0"

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint + tsc + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Asserts .nvmrc, both engines.node ranges, both @types/node majors and the
      # running interpreter all name the same Node major (ADR-081). Runs before
      # the other gates so drift reports as itself rather than as a type error.
      - name: Check Node pin (no drift)
        run: pnpm check:node-pin

      # Asserts every `uses:` ref across .github/workflows/*.yml is pinned to a
      # 40-char commit SHA with a trailing version comment (security.md) — a
      # floating tag executes in this repo with whatever the job grants it.
      - name: Check Action pins (no floating refs)
        run: pnpm check:action-pins

      - name: Check formatting (prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

  # ─── Test ────────────────────────────────────────────────────────────
  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: specr
          POSTGRES_PASSWORD: specr
          POSTGRES_DB: specr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://specr:specr@localhost:5432/specr_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm migrate

      - name: Seed CSI section reference data
        run: pnpm seed

      - name: Run unit tests
        run: pnpm test --reporter=verbose

      - name: Demo unit tests
        run: node --test "examples/web_ui_demo/*.test.mjs" "examples/web_ui_demo/providers/*.test.mjs"

      - name: Run integration tests
        run: pnpm test:integration --reporter=verbose

      - name: Check coverage threshold (80%)
        run: pnpm test:coverage

  # ─── Verify Harness (tools/verify) ─────────────────────────────────────
  # tools/verify is its own ISOLATED pnpm workspace (own pnpm-workspace.yaml
  # + pnpm-lock.yaml, zero import from repo-root src/ per
  # import-boundary.test.ts) — the root `test` job above only drives the
  # root vitest config's unit/integration projects and never sees this
  # package, so without this job tools/verify's whole test suite (including
  # openapi-noop.test.ts's own "this branch never touches repo-root src/ or
  # openapi.yaml" invariant) has zero CI enforcement.
  #
  # fetch-depth: 0 so `origin/main` is resolvable, same as loc-check below —
  # without it, openapi-noop.test.ts's git-diff check self-skips rather than
  # asserting for real.
  verify-harness:
    name: Verify harness (tools/verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job shells out to git (openapi-noop.test.ts's diff, the
          # workspace-isolation install checks) with fetch-depth: 0; it never
          # pushes and all refs are already fetched at checkout, so don't
          # leave the checkout token persisted in .git/config for those
          # child git invocations to reach.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: tools/verify/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: tools/verify
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + tsc + prettier)
        working-directory: tools/verify
        run: pnpm lint

      - name: Run tests
        working-directory: tools/verify
        run: pnpm test --reporter=verbose

  # ─── Build ──────────────────────────────────────────────────────────
  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate OpenAPI schema
        run: |
          if [ -f openapi.yaml ]; then
            pnpm exec redocly lint openapi.yaml
          else
            echo "openapi.yaml not yet present — skipping"
          fi

  # ─── LOC Check ──────────────────────────────────────────────────────
  # PR-only: warns (does not fail) if LOC delta exceeds 500 lines.
  # Excludes: test fixtures, reference docs, migrations, lockfile, openapi.
  loc-check:
    name: LOC delta check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute LOC delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DELTA=$(git diff --stat "$BASE_SHA"..."$HEAD_SHA" -- \
            ':!pnpm-lock.yaml' \
            ':!tests/fixtures/**' \
            ':!docs/references/**' \
            ':!src/db/migrations/**' \
            ':!openapi.yaml' \
            ':!*.SEC' \
            ':!*.docx' \
            | tail -1 \
            | grep -oP '\d+ insertion' | grep -oP '^\d+' || echo 0)

          DELETIONS=$(git diff --stat "$BASE_SHA"..."$HEAD_SHA" -- \
            ':!pnpm-lock.yaml' \
            ':!tests/fixtures/**' \
            ':!docs/references/**' \
            ':!src/db/migrations/**' \
            ':!openapi.yaml' \
            ':!*.SEC' \
            ':!*.docx' \
            | tail -1 \
            | grep -oP '\d+ deletion' | grep -oP '^\d+' || echo 0)

          TOTAL=$((DELTA + DELETIONS))
          echo "LOC delta: +${DELTA} -${DELETIONS} (total churn: ${TOTAL})"

          if [ "$TOTAL" -gt 500 ]; then
            echo "::warning::LOC delta (${TOTAL}) exceeds 500-line sub-MVP limit. Consider splitting this PR."
          fi
