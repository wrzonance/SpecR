name: CodeQL

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}

      - name: Install pnpm
        if: matrix.language == 'javascript-typescript'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # Must match ci.yml and release.yml's PNPM_VERSION — keep all three in
          # step when bumping. Renovate manages this literal but NOT the
          # PNPM_VERSION env vars, so a bump here silently drifts from the
          # others (it did: this read 11.17.0 while both env vars said 11.11.0).
          #
          # This job was previously pinned to pnpm 9, which cannot read a pnpm 11
          # pnpm-workspace.yaml ("packages field missing or empty") — `pnpm
          # install` here failed on every scheduled run since at least
          # 2026-06-22, so JS/TS CodeQL analysis was silently not running.
          # CodeQL is cron-only, so no PR ever surfaced it.
          version: "12.1.0"

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: matrix.language == 'javascript-typescript'
        run: pnpm install --frozen-lockfile

      - name: Build (required for CodeQL JS/TS analysis)
        if: matrix.language == 'javascript-typescript'
        run: pnpm build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
