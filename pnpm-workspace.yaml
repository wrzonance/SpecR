# Fail `pnpm install` outright when the running Node does not satisfy the
# `engines.node` range in package.json, instead of printing a warning and
# continuing. This is what makes the Node 24 pin real rather than advisory —
# see .nvmrc and ADR-081.
#
# pnpm 11 reads this key HERE, in camelCase. Neither `engine-strict=true` in
# .npmrc (the npm spelling) nor `engine-strict` in kebab-case has any effect —
# both were measured to exit 0 on a violating runtime.
#
# Renovate strips this block whenever it rewrites the overrides below (#602,
# #606). If it goes missing again, restore it — the note is what stops someone
# "tidying" the key back into .npmrc and silently reducing the Node pin to
# advisory.
engineStrict: true

# pnpm 11 — allow esbuild postinstall binary build (required by vitest/tsx).
# core-js/protobufjs (transitive deps of @redocly/cli) have install scripts we
# explicitly DENY — they are not needed for `redocly lint` and false silences
# pnpm's unapproved-build error.
allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: false
  tesseract.js: false

# Security overrides — force patched versions of transitive deps flagged by
# Dependabot. None of these vulnerable code paths are reachable in SpecR today
# (no hono middleware is imported; qs.stringify is never called; the dev tools
# never ship in dist/ or run in prod), but we pin the patched versions for
# defense-in-depth and a clean `pnpm audit`. See issues #198 (runtime), #200,
# #203, and #495. No residuals remain: the long-standing depcheck js-yaml@3.x
# gap (formerly dismissed tolerable_risk — no 3.x backport existed) closed when
# js-yaml 3.15.0 shipped the GHSA-h67p-54hq-rp68 fix for the 3.x line
# (2026-06-26); it is pinned below alongside eslint's 4.x consumer.
#
# Every floor here is bounded to the consumer's major (`>=patched <nextMajor`):
# an unbounded floor once let a pin jump majors and break its consumer (#504).
# Selector keys are kept disjoint per major so two entries never claim the same
# declared range (js-yaml 3.x vs 4.x, nanoid 3.x vs 5.x).
overrides:
  # runtime, via @modelcontextprotocol/sdk → @hono/node-server. 2026-09 sweep:
  # GHSA-gqvv-2mrq-wpjv, GHSA-g6gw-c38x-mqfc, GHSA-crvj-82cr-hjcx (<4.13.5) on
  # top of the earlier 4.12.x advisories.
  hono@<4.13.5: '>=4.13.5 <5'
  '@hono/node-server@<1.19.15': '>=1.19.15 <2' # GHSA-frvp-7c67-39w9 (serve-static, Windows)
  qs@<6.16.0: '>=6.16.0 <7' # runtime, via express → body-parser (CVE-2026-8723, GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx)
  esbuild@<0.28.1: '>=0.28.1' # GHSA-gv7w-rqvm-qjhr (high), -g7r4-m6w7-qqqr
  dompurify@<3.4.11: '>=3.4.11' # GHSA-vxr8-fq34-vvx9, GHSA-cmwh-pvxp-8882 (≤3.4.10)
  # GHSA-h67p-54hq-rp68, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh (dev, via eslint and
  # json-schema-ref-parser's 4.x consumers)
  'js-yaml@>=4.0.0 <4.3.2': '>=4.3.2 <5'
  # GHSA-h67p-54hq-rp68 3.x backport (dev, via depcheck ^3.14.1). Ceiling raised
  # 3.x → 5.x in #606; depcheck now resolves js-yaml 5.2.3. js-yaml 4 REMOVED
  # `safeLoad`, which depcheck still calls in three places, so this was verified
  # by cold-install rather than assumed: `pnpm exec depcheck` (release.yml) is
  # byte-identical on 3.15.1 and 5.2.3 today, because all three call sites are
  # unreachable here — two need a .travis.yml / serverless.yml (this repo has
  # neither), and utils/cli-tools.js wraps its call in a try/catch that swallows
  # the TypeError. That last one degrades silently rather than failing loudly:
  # if a YAML-based tool config is ever added, depcheck will stop parsing it and
  # may report a used dependency as unused. Revisit if depcheck ever moves off
  # the safeLoad-era API, or drop to `<4` if that silent gap starts to bite.
  # 3.15.2 carries the same GHSA-2883-xcg3-v3hh / GHSA-5p4m-2wfm-xmqj backports.
  js-yaml@<3.15.2: '>=3.15.2 <6'
  vite: ^8.0.16 # GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3
  # GHSA-35p6-xmwp-9g52, GHSA-g8m3-5g58-fq7m, GHSA-p88m-4jfj-68fv,
  # GHSA-vxpw-j846-p89q (dev, via @redocly/cli). Ceiling raised 7 → 9 in #606,
  # but the raise is inert: @redocly/cli's own range caps undici inside 6.x, so
  # a cold install still resolves 6.28.0 either way. The floor is what matters
  # here; the ceiling is now decorative.
  undici@<6.27.0: '>=6.27.0 <9'
  # runtime, via ajv (@modelcontextprotocol/sdk). GHSA-jqff-g426-hqxp,
  # GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-7p8r-x3mc-p8w7,
  # GHSA-v2hh-gcrm-f6hx, GHSA-4c8g-83qw-93j6 (host confusion / SSRF in URI
  # normalization; ajv only uses it to resolve schema $ref ids).
  # 2026-10 sweep adds GHSA-hrr3-gc8f-f4qj (percent-encoded host case normalization).
  fast-uri@<3.1.8: '>=3.1.8 <4'
  # runtime, via docx's 5.x consumer (docx 9.8+ resolves nanoid 6, which is
  # outside the affected range) — postcss's nanoid@3 line is not
  # affected and MUST stay on 3.x (nanoid 5 is ESM-only). GHSA-28wg-ghj8-5hjv.
  'nanoid@>=5.0.0 <5.1.16': '>=5.1.16 <6'
  # dev, via vite / depcheck. GHSA-fxqj-rqcc-2cmp, GHSA-r28c-9q8g-f849
  # (sourceMappingURL .map disclosure; never invoked on untrusted CSS here).
  postcss@<8.5.23: '>=8.5.23 <9'
  # dev, via minimatch@3 (eslint), minimatch@7 (depcheck) and minimatch@10
  # (eslint-plugin-sonarjs / glob). GHSA-3jxr-9vmj-r5cp (exponential expansion)
  # plus the 2026-09-29 trio GHSA-q2hr-2g5m-vwhr (quadratic `{a},b}` rewrite),
  # GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p (uncontrolled recursion) — the
  # q2hr floors are the highest of the three per line, so they cover all.
  'brace-expansion@>=1.0.0 <1.1.21': '>=1.1.21 <2'
  'brace-expansion@>=2.0.0 <2.1.7': '>=2.1.7 <3'
  'brace-expansion@>=5.0.0 <5.0.12': '>=5.0.12 <6'
  # runtime, via express. GHSA-jqcg-44mw-7w3h (CVE-2026-90711, critical): an
  # IPv4-mapped IPv6 client address matched a trusted-proxy subnet it should
  # not have, letting X-Forwarded-For spoof the trusted client IP. express 5.2.1
  # still declares ^2.0.7, so the floor is what moves the lock.
  proxy-addr@<2.0.8: '>=2.0.8 <3'
  # dev, via depcheck → @vue/compiler-sfc and vite → postcss. GHSA-68fv-2mgg-jv7q
  # (event-loop DoS through indexed source-map section offsets).
  source-map-js@<1.2.2: '>=1.2.2 <2'
  # dev, via pino-pretty (the dev-only log transport). GHSA-jggr-w7fw-pc2j
  # (stack exhaustion copying deeply nested values).
  fast-copy@<4.1.0: '>=4.1.0 <5'
