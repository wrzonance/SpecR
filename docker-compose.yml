services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: specr
      POSTGRES_PASSWORD: specr
      POSTGRES_DB: specr
    ports:
      - "5432:5432"
    volumes:
      - specr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  specr_pgdata:
