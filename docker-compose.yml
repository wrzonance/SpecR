services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: specr
      POSTGRES_PASSWORD: specr
      POSTGRES_DB: specr
    ports:
      # Host port is overridable (the Windows demo launcher picks a free one and
      # points DATABASE_URL at it); defaults to 5432 for `docker compose up`/CI.
      - "${SPECR_DB_HOST_PORT:-5432}:5432"
    volumes:
      - specr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  specr_pgdata:
