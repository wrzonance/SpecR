openapi: 3.1.0
info:
  title: SpecR API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Headless REST API for CSI® MasterFormat®-compatible specification document
    automation with round-trip DOCX support. Independent project; not affiliated
    with CSI.

# No authentication yet — auth lands with Phase 5f (#43). The explicit empty
# security array documents that every endpoint is currently unauthenticated.
security: []

servers:
  - url: http://localhost:3000
    description: Local development server

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [system]
      responses:
        '200':
          description: Server is alive and the database is reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [db, uptime]
                        properties:
                          db:
                            type: string
                            description: Database connectivity state ("connected")
                          uptime:
                            type: integer
                            description: Process uptime in whole seconds
        '503':
          description: 'Database unavailable — `{success: false, error: "database unavailable"}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parse:
    post:
      operationId: parseDocument
      summary: Upload and parse a spec document (async)
      description: >
        Upload a `.docx`, `.sec`, or `.txt` file. Returns 202 immediately with a
        `jobId`; poll `/parse/jobs/{jobId}` for progress and result. Rate-limited
        to 10 requests per IP per minute.
      tags: [parse]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Spec document (.docx, .sec, or .txt). Max 10 MB.
                section:
                  type: string
                  description: Override the detected CSI section number (e.g. "09 91 26").
                title:
                  type: string
                  description: Override the detected section title.
      responses:
        '202':
          description: Parse job accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [jobId]
                        properties:
                          jobId:
                            type: string
                            format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /parse/jobs/{jobId}:
    get:
      operationId: getParseJob
      summary: Poll parse job progress
      tags: [parse]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ParseJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}:
    get:
      operationId: getSpec
      summary: Retrieve a spec with its full paragraph tree
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Spec with paragraph tree
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecTree'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateSpec
      summary: Update spec metadata
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                section:
                  type: string
                  description: CSI section number (e.g. "09 91 26").
                title:
                  type: string
      responses:
        '200':
          description: Updated spec summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}:
    patch:
      operationId: updateParagraph
      summary: Update a single paragraph's text by UUID
      description: >
        Replaces one paragraph's text in place (ADR-009), bumping its
        `base_version` and the spec's `contentVersion`. The Revit add-in pushes
        model-parameter changes here without replacing the whole spec. The node
        must belong to the spec in the path; otherwise the request is rejected
        with 403.


        Optimistic concurrency (ADR-018): supply `expectedVersion` (the spec
        `contentVersion` you read) to make the write conditional — a stale value
        is rejected 409 with the current version, so a concurrent edit is never
        silently clobbered. The composed edit gate also rejects writes to an
        archived spec or one locked upstream in a DMS (409).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  description: New paragraph text (must be non-empty).
                expectedVersion:
                  type: integer
                  minimum: 1
                  description: >
                    Optional optimistic-concurrency precondition — the spec
                    `contentVersion` the caller read. Stale → 409.
      responses:
        '200':
          description: Updated paragraph node (with its subtree)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/editability:
    patch:
      operationId: patchEditability
      summary: Set or clear a paragraph's human editability override
      description: >
        Records the reviewer's correction as the paragraph's `editability_override`
        (ADR-022 D2), stored beside — never merged into — the machine classification.
        `editability: null` clears the override so the effective value falls back to
        the machine verdict. The node must belong to the spec in the path (else 403).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [editability]
              properties:
                editability:
                  oneOf:
                    - type: string
                      enum: [locked, editable, choice, note]
                    - type: 'null'
                  description: Override value, or null to clear it.
      responses:
        '200':
          description: Override applied (or cleared)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [nodeId, editability]
                        properties:
                          nodeId:
                            type: string
                            format: uuid
                          editability:
                            oneOf:
                              - type: string
                                enum: [locked, editable, choice, note]
                              - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/reclassify:
    post:
      operationId: reclassifySpec
      summary: Re-run editability classification over stored source facts
      description: >
        Re-classifies every paragraph from its persisted `source_facts` (ADR-022 D4)
        with no source document — the architectural point of the substrate. Supply
        `rules` to preview candidate conventions; omit them to resolve the spec's
        library convention profile (built-in default fallback). `preview: true`
        computes the diff without persisting. Standing human overrides are never
        touched; the report flags where the fresh machine verdict now disagrees with
        an override (ADR-022 D2).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  $ref: '#/components/schemas/ConventionRules'
                preview:
                  type: boolean
                  description: Compute the diff without persisting (preview-before-save).
      responses:
        '200':
          description: Before/after classification diff report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReclassifyReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/comments/{index}/accept-as-note:
    post:
      operationId: acceptCommentAsNote
      summary: Materialize a margin comment as a note node
      description: >
        Inserts the margin comment at `index` (captured in `source_facts.comments`)
        as a `note` paragraph immediately after the anchor (ADR-022 D4 — never a
        silent tree mutation). Repeating the call returns 409 with the existing
        note's id (idempotent contract). The node must belong to the spec (else 403).


        Materializing a note is a content write: it passes the composed edit gate
        (ADR-018) and bumps the spec's `contentVersion`. Accepting against an
        archived or upstream-locked spec is rejected with 409.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Zero-based index into the anchor's source_facts.comments.
      responses:
        '201':
          description: Note node created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [noteId]
                        properties:
                          noteId:
                            type: string
                            format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            Either the comment was already accepted (the existing note's id
            travels back as `noteId`), or the spec is archived / upstream-locked
            and rejected by the edit gate (no `noteId`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      noteId:
                        type: string
                        format: uuid
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/associations:
    get:
      operationId: listAssociations
      summary: List external content associations for a paragraph
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: List of paragraph associations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParagraphAssociation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAssociation
      summary: Associate external content with a paragraph
      description: >
        Links a DMS document or direct URL to a paragraph. Either a complete DMS
        pair (externalProvider + externalId) or a url must be provided.
        Only link + provenance is stored — never the licensed bytes (ADR-019).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssociation'
      responses:
        '201':
          description: Association created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ParagraphAssociation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/associations/{associationId}:
    delete:
      operationId: deleteAssociation
      summary: Remove an external content association from a paragraph
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/AssociationId'
      responses:
        '204':
          description: Association deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/lineage:
    get:
      operationId: getSpecLineage
      summary: Chain of custody for a spec
      description: >
        Walks `parent_spec_id` from the requested spec to the root library master,
        returning every hop in leaf-first order (`chain[0]` = the requested spec,
        last entry = the root).


        `behindBy` for each hop = the parent's current `contentVersion` minus this
        copy's `originVersion` (the version it was cloned from); null on the root
        because the root has no parent to drift behind.


        `originMeta` is the root's ingest provenance (`filename`, `sha256`, `loader`)
        when the root was file-ingested; null otherwise.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Custody chain from requested spec to root
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecLineage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/style-source:
    post:
      operationId: setSpecStyleSource
      summary: Assign a style template to a spec (manual style-source pick)
      description: >
        Associates an existing style template (#30/#31) with the spec so the
        generator can render it with a real house style (#138). One template per
        spec; re-assigning replaces the previous template. `.SEC`/`.txt`/PDF
        masters carry no adopted visual style, so this is the narrowest useful
        slice of #125's style sources. Both the spec and the template must
        already exist — either missing → 404 (pre-checked, never via the FK error).
        A template assigned to any spec cannot be deleted (DELETE /templates/{id}
        → 409).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId]
              properties:
                templateId:
                  type: string
                  format: uuid
                  description: Style template to associate with the spec.
      responses:
        '200':
          description: Style source assigned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/StyleSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: clearSpecStyleSource
      summary: Clear a spec's style template (fall back to generator defaults)
      description: >
        Removes the spec→template association (#138). Idempotent — clearing an
        already-unset association is still 200. The spec must exist (unknown → 404).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Style source cleared (styleSource is null)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [styleSource]
                        properties:
                          styleSource:
                            type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/generate:
    post:
      operationId: generateDocx
      summary: Generate a DOCX from a stored spec AST
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  format: uuid
                  description: >
                    Style template to apply (font, spacing, indent, numbering format).
                    Omitted → the seeded UFGS-Default template is applied; if that template
                    is absent (un-migrated database) the response is still 200 with an
                    unstyled DOCX. Unknown id → 404.
                sectionNumberFormat:
                  type: string
                  enum: [canonical, dots, compact]
                  default: canonical
                  description: >
                    Presentation format for generated section numbers in the synthetic
                    DOCX title and confidently identified Section references in paragraph
                    text. Canonical emits "09 91 00", dots emits "09.91.00", and compact
                    emits "099100". Stored AST and database values remain canonical.
            examples:
              dotted-section-numbers:
                value:
                  sectionNumberFormat: dots
      responses:
        '200':
          description: DOCX file stream
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/diff:
    post:
      operationId: diffSpecDocx
      summary: Diff a returned DOCX against stored spec state
      description: >
        Upload an edited DOCX generated by SpecR. The response is a UUID-keyed
        3-way diff: base snapshot, current DB state (`ours`), and returned DOCX
        content (`theirs`). The synthetic title paragraph is ignored because it
        is not a persisted AST node.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Returned SpecR-generated DOCX. Max 10 MB.
      responses:
        '200':
          description: Structured merge diff
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DiffResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/merge:
    post:
      operationId: mergeSpecDiff
      summary: Apply accepted changes from a spec diff
      description: >
        Submit accepted change UUIDs along with the `DiffResult` previously
        returned by `/specs/{id}/diff`. Accepted modified/conflict entries update
        `paragraphs.text`, insert a `paragraph_versions` snapshot for the new
        base version, and increment `paragraphs.base_version`. Rejected entries
        are discarded by omission. A successful merge bumps the spec's
        `contentVersion`.


        Optimistic concurrency (ADR-018): supply `expectedVersion` to make the
        merge conditional on the spec being at that `contentVersion` — stale →
        409 with the current version. The composed edit gate also rejects a merge
        on an archived spec or one locked upstream (409).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: Merge apply summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MergeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/lock:
    get:
      operationId: getSpecLock
      summary: Current advisory lock on a spec
      description: >
        Returns the live advisory lock (ADR-018 D2) or `{ locked: false }` when
        none is held. An expired lock reads as free. Advisory only — a lock never
        blocks a write on its own; the edit gate governs writes.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Lock state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [locked, lock]
                        properties:
                          locked:
                            type: boolean
                          lock:
                            description: >
                              The live lock when held, or null when the spec is
                              unlocked (or its lock has expired).
                            oneOf:
                              - $ref: '#/components/schemas/LockState'
                              - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: acquireSpecLock
      summary: Acquire (or refresh / steal-after-expiry) an advisory lock
      description: >
        Acquires the soft lock for `holder`. Succeeds when the spec is free, the
        caller already holds it (refresh), or the existing lock has expired
        (steal). A live lock held by another caller is refused with 409 and the
        blocking holder. There is no unlock ceremony — abandoned locks expire.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder]
              properties:
                holder:
                  type: string
                  minLength: 1
                  description: Caller identity label (authenticated identity once #43 lands).
                ttlSeconds:
                  type: integer
                  minimum: 1
                  maximum: 3600
                  description: Lock lifetime in seconds (default 900 / 15 min).
      responses:
        '200':
          description: Lock acquired
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LockState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A live lock is held by another caller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      holder:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: releaseSpecLock
      summary: Release an advisory lock
      description: >
        Releases the lock only if `holder` matches the current holder. A release
        by a non-holder (or when no lock is held) is refused with 409.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder]
              properties:
                holder:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Lock released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects:
