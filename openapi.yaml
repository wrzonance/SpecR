      parameters:
        - $ref: '#/components/parameters/ConventionLibraryId'
      responses:
        '200':
          description: Resolved convention profile with fallback flag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        $ref: '#/components/schemas/EditingConvention'
                      meta:
                        type: object
                        required: [inherited]
                        properties:
                          inherited:
                            type: boolean
                            description: True when the profile is the inherited built-in default
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: putLibraryConvention
      summary: Create or replace a library's convention profile
      description: >
        Upserts the library's convention profile. Rules are shape-validated
        (malformed rules → 400). User-supplied `noteBanners` regexes are bounded
        for length and ReDoS safety at the write boundary (unsafe pattern → 422).
        Unknown rule keys round-trip unchanged (open schema).
      tags: [conventions]
      parameters:
        - $ref: '#/components/parameters/ConventionLibraryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutConventionBody'
      responses:
        '200':
          description: Convention profile created or replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/EditingConvention'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unsafe or oversized `noteBanners` regex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

