                            type: string
                            format: uuid
                          name:
                            type: string
                          sectionNumberFormat:
                            type: string
                            enum: [canonical, dots, compact, spaced-compact]
                          clientId:
                            type: [string, 'null']
                            format: uuid
                            description: Associated client (ADR-054), or null when unassociated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteProject
      summary: Soft-delete (withdraw) a project
      description: >
        Soft-deletes a project (ADR-031): tombstones it with `deleted_at` + the
        caller-supplied `deletedBy` actor. The project is hidden from
        `GET /projects` but remains retrievable by id (with the tombstone
        surfaced) and reversible via `POST /projects/{id}/restore`. Idempotent —
        re-deleting an already-deleted project returns its EXISTING
        `deletedAt`/`deletedBy`, never overwriting them.
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deletedBy]
              properties:
                deletedBy:
                  type: string
                  minLength: 1
