          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project-scoped outbound reference list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [projectId, specId, references]
                        properties:
                          projectId:
                            type: string
                            format: uuid
                          specId:
                            type: string
                            format: uuid
                          references:
                            type: array
                            items:
                              $ref: '#/components/schemas/OutboundReference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/references/broken:
    get:
      operationId: getBrokenRefs
      summary: List broken cross-references in a project
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Broken cross-reference list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BrokenRef'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/references/inbound:
    get:
      operationId: getInboundReferences
      summary: List project specs that reference a section
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: section
          in: query
          required: true
          schema:
            type: string
          description: CSI section number, URL-encoded when it contains spaces
      responses:
        '200':
          description: Project-scoped inbound reference list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [projectId, section, references]
                        properties:
                          projectId:
                            type: string
                            format: uuid
                          section:
                            type: string
                          references:
                            type: array
                            items:
                              $ref: '#/components/schemas/InboundReference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/packages:
    post:
      operationId: createPackage
      summary: Create a design package (named, ordered subset of the project TOC)
      tags: [packages]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Package created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/PackageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Package name already exists in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listPackages
      summary: List a project's design packages with ordered membership
      tags: [packages]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Package list with spec membership
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PackageWithSpecs'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{id}/specs:
    put:
      operationId: setPackageSpecs
      summary: Replace a package's ordered spec membership
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Package UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specIds]
              properties:
                specIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                  description: >
                    Ordered list of spec UUIDs to assign to this package. Position
                    within the package equals array order (1-based). An empty array
                    clears the package. All specs must belong to the package's own
                    project TOC (ADR-015 D4).
      responses:
        '200':
          description: Package membership replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [packageId, specs]
                        properties:
                          packageId:
                            type: string
                            format: uuid
                          specs:
                            type: array
                            items:
                              $ref: '#/components/schemas/PackageSpecEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: "Validation failed, or a spec is not in the package's project TOC"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{id}:
    delete:
      operationId: deletePackage
      summary: Delete a design package (membership rows cascade; specs survive)
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Package UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Package deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [packageId]
                        properties:
                          packageId:
                            type: string
                            format: uuid
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{id}/revisions:
    post:
      operationId: createPackageRevision
      summary: Issue an immutable revision snapshot of a package (ADR-015 D5)
      description: >
        Freezes the full SpecTree of every member section as JSONB inside one
        transaction — a reproducible point-in-time record of exactly what was
        issued. Post-issuance edits never alter the stored trees.
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Package UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateRevisionLegacyBody'
                - $ref: '#/components/schemas/CreateRevisionStructuredBody'
      responses:
        '201':
          description: Revision issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RevisionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision label or sort order already exists for this package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed, or a member tree cannot be snapshotted losslessly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /revisions/{id}:
    get:
      operationId: getRevision
      summary: Read an issued revision's frozen trees (validated on read)
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Revision UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Frozen trees in membership order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RevisionWithTrees'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /revisions/{id}/generate:
    post:
      operationId: generateRevisionManual
      summary: Render an issued manual DOCX from frozen package revision snapshots
      description: >
        Renders the target package revision from `package_revision_specs.tree`, not
        live paragraph rows, so old issuances remain reproducible after database
        edits. When `baseRevisionId` is supplied, addendum mode compares the
        target and base revision snapshots by section-level AST equality and
        emits only sections whose frozen trees differ, under an addendum cover
        listing the affected sections. Running DOCX headers/footers are reserved
        for the header/footer foundation work; this endpoint renders revision
        identity on the cover/front matter only.
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Target revision UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  format: uuid
                  description: >
                    Style template applied to every rendered section. Omitted →
                    the seeded UFGS-Default template; absent default → unstyled
                    200. Unknown id → 404.
                sectionNumberFormat:
                  type: string
                  enum: [canonical, dots, compact]
                  default: canonical
                  description: >
                    Presentation format for generated section numbers in each
                    section title and confidently identified Section references.
                baseRevisionId:
                  type: string
                  format: uuid
                  description: >
                    Base revision for addendum mode. Must belong to the same
                    package as the target revision. Omit to render the full
                    issued manual.
      responses:
        '200':
          description: DOCX manual file stream
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid addendum comparison, or no changed sections to render
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates:
    post:
      operationId: createTemplate
      summary: Create a style template (no rules)
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Unique template name
                owner:
                  type: string
                  minLength: 1
                  description: Optional firm / owner label
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TemplateMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listTemplates
      summary: List all style templates (metadata only, no rules)
      tags: [templates]
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemplateMeta'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}:
    get:
      operationId: getTemplate
      summary: Retrieve a style template with its rules
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template with rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: patchTemplate
      summary: Update template metadata (name and/or owner)
      description: >
        At least one of `name` or `owner` must be present. Pass `owner: null`
        to clear the owner field.
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                owner:
                  type: [string, 'null']
                  minLength: 1
                  description: Pass null to clear the owner
      responses:
        '200':
          description: Updated template metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TemplateMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteTemplate
      summary: Delete a style template and all its rules
      description: >
        A template assigned to any spec as its style source cannot be deleted
        (ON DELETE RESTRICT, #138) — the request returns 409 with the count of
        referencing specs. Clear the association on those specs first
        (DELETE /specs/{id}/style-source).
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Template deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Template is in use by one or more specs as a style source and cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}/rules:
    post:
      operationId: upsertTemplateRules
      summary: Bulk-upsert style rules for a template (transactional)
      description: >
        Replace (or add) rules for the given NodeTypes atomically. Existing rules
        for NodeTypes not in the request are left unchanged. All rules are
        validated before any write — one invalid rule rolls back all changes.
        Unknown OOXML property keys are preserved in `properties` (JSONB catchall).
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/StyleRule'
      responses:
        '200':
          description: Template with updated rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/import:
    post:
      operationId: importTemplate
      summary: Derive a firm style template from a source-of-truth DOCX
      description: >
        Upload a `.docx` file to derive a reusable firm style template via
        per-NodeType consensus derivation (mode/median, consistency-wins-else-intent
        per §5 of the style fidelity program). Returns the persisted template and
        a `DerivationReport` for review.


        The raw DOCX is never stored — only the derived JSONB style definition is
        persisted (ADR-021). Unknown OOXML property keys are preserved in the
        `properties` object.


        **Theme-font caveat:** `asciiTheme` references are not yet resolved
        (issue #149). Documents that use theme fonts will derive without a
        concrete font family until theme-font support lands.


        Rate-limited to 10 requests per IP per minute (shared with `POST /parse`).
      tags: [templates]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                  description: Source-of-truth `.docx` file. Max 10 MB.
                name:
                  type: string
                  minLength: 1
                  description: Unique template name (used as the lookup key).
                owner:
                  type: string
                  minLength: 1
                  description: >
                    Optional firm / owner label (e.g. "ACME Architects"). Stored
                    as metadata only; has no effect on derivation.
      responses:
        '201':
          description: Template derived and persisted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [template, report]
                        properties:
                          template:
                            $ref: '#/components/schemas/Template'
                          report:
                            $ref: '#/components/schemas/DerivationReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/required-sections:
    get:
      operationId: listBaselineRequiredSections
      summary: List a project's baseline required sections
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Baseline required-section list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RequiredSection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putBaselineRequiredSections
      summary: Replace (or seed) a project's baseline required sections
      description: >
        `sections` and `seedFrom` are mutually exclusive. `seedFrom: toc` copies
        the project's TOC into an empty baseline. Re-replacing renumbers position.
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequiredSectionsBody' }
      responses:
        '200':
          description: Updated baseline required-section list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RequiredSection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{id}/packages/{packageId}/required-sections:
    get:
      operationId: listPackageRequiredSections
      summary: List a design package's required sections
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: packageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Package required-section list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RequiredSection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putPackageRequiredSections
      summary: Replace (or seed) a design package's required sections
      description: >
        `sections` and `seedFrom` are mutually exclusive. `seedFrom: baseline`
        copies the project baseline; `seedFrom: toc` copies the project TOC;
        `seedFrom: {packageId}` copies another package. Re-replacing renumbers position.
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: packageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequiredSectionsBody' }
      responses:
        '200':
          description: Updated package required-section list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RequiredSection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{id}/coordination-report:
    get:
      operationId: getCoordinationReport
      summary: Project coordination report — required/present/reference findings
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: packageId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Coordination report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/CoordinationReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

# ─── Components ───────────────────────────────────────────────────────────────

components:
  parameters:
    SpecId:
      name: id
      in: path
      required: true
      description: Spec UUID
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Paragraph (node) UUID
      schema:
        type: string
        format: uuid
    ProjectId:
      name: id
      in: path
      required: true
      description: Project UUID
      schema:
        type: string
        format: uuid
    LibraryId:
      name: libraryId
      in: path
      required: true
      description: Library UUID
      schema:
        type: string
        format: uuid
    Division:
      name: division
      in: path
      required: true
      description: Two-digit division number
      schema:
        type: string
        pattern: '^\d{2}$'
    TemplateId:
      name: id
      in: path
      required: true
      description: Template UUID
      schema:
        type: string
        format: uuid
    ConventionLibraryId:
      name: id
      in: path
      required: true
      description: Library UUID
      schema:
        type: string
        format: uuid

    AssociationId:
      name: associationId
      in: path
      required: true
      description: Paragraph association UUID
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request — validation error or unsupported file type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden — the resource exists but does not belong to the parent in the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict — a resource with that identity already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WriteConflict:
      description: >
        Write rejected by the concurrency / edit gate (ADR-018): a stale
        `expectedVersion`, an archived spec, or a spec locked upstream. On a
        stale version the current version travels back as `currentVersion`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  currentVersion:
                    type: integer
                    description: Present on a stale-version conflict — the spec's current contentVersion.
    UnprocessableEntity:
      description: Unprocessable — file parsed but semantically unusable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: >
        Rate limit exceeded (10 uploads per IP per minute) —
        `{success: false, error: "too many requests — please wait before uploading again"}`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── Envelope shapes ────────────────────────────────────────────────────────

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

    # ── Required Sections ──────────────────────────────────────────────────────

    RequiredSection:
      type: object
      required: [id, section, title, position]
      properties:
        id: { type: string, format: uuid }
        section:
          type: string
          description: Canonical CSI section number (ADR-020 expanded shape).
        title: { type: [string, 'null'] }
        position: { type: integer, minimum: 1 }

    RequiredSectionsBody:
      type: object
      description: >
        Provide either `sections` (explicit list) or `seedFrom` (copy an existing
        baseline/TOC/package) — not both.
      properties:
        sections:
          type: array
          items:
            type: object
            required: [section]
            properties:
              section:
                type: string
                description: Canonical CSI section number.
              title:
                type: string
                minLength: 1
        seedFrom:
          oneOf:
            - type: string
              enum: [baseline, toc]
            - type: object
              required: [packageId]
              properties:
                packageId: { type: string, format: uuid }
      # sections and seedFrom are mutually exclusive (server returns 422 if both
      # are present); neither is allowed too (an empty PUT clears the scope).
      not:
        required: [sections, seedFrom]

    # ── Coordination Report ────────────────────────────────────────────────────

    CoordinationReport:
      type: object
      required: [projectId, packageId, findings, summary, notes]
      properties:
        projectId: { type: string, format: uuid }
        packageId: { type: [string, 'null'], format: uuid }
        findings:
          type: array
          items: { $ref: '#/components/schemas/CoordinationFinding' }
        summary: { $ref: '#/components/schemas/CoordinationSummary' }
        notes:
          type: array
          items: { type: string }
    CoordinationSummary:
      type: object
      required: [requiredNotPresent, presentNotRequired, danglingRef, total]
      properties:
        requiredNotPresent: { type: integer }
        presentNotRequired: { type: integer }
        danglingRef: { type: integer }
        total: { type: integer }
    CoordinationFinding:
      oneOf:
        - $ref: '#/components/schemas/FindingRequiredNotPresent'
        - $ref: '#/components/schemas/FindingPresentNotRequired'
        - $ref: '#/components/schemas/FindingDanglingRef'
      discriminator:
        propertyName: type
        mapping:
          required_not_present: '#/components/schemas/FindingRequiredNotPresent'
          present_not_required: '#/components/schemas/FindingPresentNotRequired'
          dangling_ref: '#/components/schemas/FindingDanglingRef'
    FindingRequiredNotPresent:
      type: object
      required: [type, section, title, requiredId]
      properties:
        type: { type: string, enum: [required_not_present] }
        section: { type: string }
        title: { type: [string, 'null'] }
        requiredId: { type: string, format: uuid }
    FindingPresentNotRequired:
      type: object
      required: [type, section, specId, title]
      properties:
        type: { type: string, enum: [present_not_required] }
        section: { type: string }
        specId: { type: string, format: uuid }
        title: { type: string }
    FindingDanglingRef:
      type: object
      required:
        [
          type,
          refId,
          sourceSpecId,
          sourceSpecSection,
          targetSpecSection,
          referenceText,
          availableFrom,
        ]
      properties:
        type: { type: string, enum: [dangling_ref] }
        refId: { type: string, format: uuid }
        sourceSpecId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        targetSpecSection: { type: string }
        referenceText: { type: string }
        availableFrom:
          type: array
          items:
            type: object
            required: [libraryId, name]
            properties:
              libraryId: { type: string, format: uuid }
              name: { type: string }

    # ── Parse ──────────────────────────────────────────────────────────────────

    ParseStage:
      type: string
      enum:
        - queued
        - running
        - extracting
        - numbering
        - styles
        - document
        - classifying
        - persisting
        - complete
        - failed

    ParseJob:
      type: object
      required: [jobId, status, progress, expiresAt]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ParseStage'
          description: >
            Overall job state. In practice takes `queued`, `running`, `complete`,
            or `failed`; the fine-grained pipeline step lives in `progress.stage`.
        progress:
          type: object
          required: [stage, pct]
          properties:
            stage:
              $ref: '#/components/schemas/ParseStage'
              description: Current pipeline step
            pct:
              type: number
              minimum: 0
              maximum: 100
        result:
          $ref: '#/components/schemas/ParseJobResult'
          description: Present once status is `complete`
        error:
          type: string
          description: Present once status is `failed`
        expiresAt:
          type: integer
          description: Job record expiry as a Unix epoch timestamp in milliseconds

    ParseJobResult:
      type: object
      required: [specId, section, title, nodeCount]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
          description: CSI section number, or "unknown" if not detected
        title:
          type: string
        nodeCount:
          type: integer
          description: Total nodes in the persisted paragraph tree
        capabilities:
          type: array
          items:
            type: string
          description: 'Parser capability flags (e.g. "read-only", "parse-warnings")'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'

    ParseWarning:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [root-continuation, empty-part, no-structure-found, unusual-part-count]
        lineHint:
          type: string
          description: 'Source location hint (e.g. "line 12: <text>")'
        suggestion:
          type: string

    # ── Specs ──────────────────────────────────────────────────────────────────

    SignalConflict:
      type: object
      required: [signal, reportedIlvl, reportedNodeType]
      properties:
        signal:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: The losing inference signal that disagreed with the winner
        reportedIlvl:
          type: integer
          description: Normalized ilvl the losing signal reported (part=0 … pr7=8)
        reportedNodeType:
          type: string
          enum: [spec, part, article, pr1, pr2, pr3, pr4, pr5, pr6, pr7, note, continuation]

    SourceTextSpan:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: integer
          minimum: 0
        - type: integer
          minimum: 0

    SourceCommentFact:
      type: object
      required: [author, text, anchor]
      properties:
        author:
          type: string
        text:
          type: string
        anchor:
          $ref: '#/components/schemas/SourceTextSpan'

    SourceColorFact:
      type: object
      required: [color, coverage, spans]
      properties:
        color:
          type: string
        coverage:
          type: number
          minimum: 0
          maximum: 1
        spans:
          type: array
          items:
            $ref: '#/components/schemas/SourceTextSpan'

    SourceChoiceTokenFact:
      type: object
      required: [kind, options, span]
      properties:
        kind:
          type: string
          enum: [angle, bracket]
        options:
          type: array
          items:
            type: string
        span:
          $ref: '#/components/schemas/SourceTextSpan'

    SourceFacts:
      type: object
      description: >-
        Parser source facts for this paragraph. Present only when non-empty;
        unknown JSON keys are preserved for forward-compatible fact producers.
      additionalProperties: true
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/SourceCommentFact'
        colors:
          type: array
          items:
            $ref: '#/components/schemas/SourceColorFact'
        choiceTokens:
          type: array
          items:
            $ref: '#/components/schemas/SourceChoiceTokenFact'
        banner:
          type: string
        vanish:
          type: boolean
          const: true

    SpecNode:
      type: object
      required: [id, type, text, children, meta]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [spec, part, article, pr1, pr2, pr3, pr4, pr5, pr6, pr7, note, continuation]
        text:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpecNode'
        meta:
          type: object
          properties:
            vanish:
              type: boolean
              description: Hidden (w:vanish) paragraph — editorial note, not owner-facing
            source:
              type: string
              enum: [ufgs, arcat, cpi, unknown]
            revitParam:
              type: string
            baseVersion:
              type: integer
              minimum: 0
            conflicts:
              type: array
              description: >-
                DOCX inference signal disagreements for this paragraph. Present
                only when non-empty — the hierarchy level was ambiguous and the
                engine picked the highest-priority signal.
              items:
                $ref: '#/components/schemas/SignalConflict'
            sourceFacts:
              $ref: '#/components/schemas/SourceFacts'
            editability:
              $ref: '#/components/schemas/SpecNodeEditability'
            associations:
              type: array
              description: >-
                External content links for this paragraph (#109). Present only
                when the paragraph has one or more associations.
              items:
                $ref: '#/components/schemas/ParagraphAssociation'

    SpecTree:
      type: object
      required: [id, section, title, parts]
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
          description: 'CSI section number (e.g. "09 91 26"), or "unknown" if not detected'
        title:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/SpecNode'
        styleSource:
          description: >
            Manually assigned style template (#138), or null when none is set.
            Only present on GET /specs/{id}.
          oneOf:
            - $ref: '#/components/schemas/StyleSource'
            - type: 'null'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'

    StyleSource:
      type: object
      required: [templateId, templateName]
      properties:
        templateId:
          type: string
          format: uuid
        templateName:
          type: string

    SpecSummary:
      type: object
      required: [specId, title, section]
      properties:
        specId:
          type: string
          format: uuid
        title:
          type: string
        section:
          type: string

    ParagraphDiff:
      type: object
      required: [uuid, text, index]
      properties:
        uuid:
          type: string
          format: uuid
          description: Synthesized UUID for a paragraph added outside known controls
        text:
          type: string
        index:
          type: integer
          minimum: 0
          description: Document-order index in the returned DOCX

    ModifiedDiff:
      type: object
      required: [uuid, base, theirs, ours]
      properties:
        uuid:
          type: string
          format: uuid
        base:
          type: string
          description: Base snapshot text
        theirs:
          type: string
          description: Returned DOCX text
        ours:
          type: string
          description: Current DB text

    DiffResult:
      type: object
      required: [added, modified, deleted, conflicts, warnings]
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/ParagraphDiff'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/ModifiedDiff'
        deleted:
          type: array
          items:
            type: string
            format: uuid
        conflicts:
          type: array
          description: Same shape as modified; present when ours and theirs both changed
          items:
            $ref: '#/components/schemas/ModifiedDiff'
        warnings:
          type: array
          items:
            type: string

    MergeRequest:
      type: object
      required: [accept, diff]
      additionalProperties: false
      properties:
        accept:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs from `diff.modified` or `diff.conflicts` to apply
        diff:
          $ref: '#/components/schemas/DiffResult'
        expectedVersion:
          type: integer
          minimum: 1
          description: >
            Optional optimistic-concurrency precondition (ADR-018) — the spec
            `contentVersion` the redline was diffed against. Stale → 409.

    LockState:
      type: object
      required: [holder, acquiredAt, expiresAt]
      description: An advisory soft lock on a spec (ADR-018 D2).
      properties:
        holder:
          type: string
          description: Caller identity label holding the lock.
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    MergeResult:
      type: object
      required: [applied, rejected]
      properties:
        applied:
          type: integer
          minimum: 0
          description: Number of paragraph rows changed
        rejected:
          type: integer
          minimum: 0
          description: Number of diff entries omitted from `accept`

    LineageHop:
      type: object
      required: [specId, scope, name, contentVersion, originVersion, behindBy]
      description: >
        One node in the derivation chain. `originVersion` and `behindBy` are null
        on the root (it has no parent to drift behind).
      properties:
        specId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [library, project]
          description: Whether this spec lives in a library or a project
        name:
          type: string
          description: Library or project name that owns this spec
        contentVersion:
          type: integer
          description: Current edit generation of this spec
        originVersion:
          type: [integer, 'null']
          description: Content version of the parent this spec was cloned from; null on root
        behindBy:
          type: [integer, 'null']
          description: >
            Parent's current contentVersion minus this copy's originVersion —
            how many parent edits this copy has not yet seen; null on root

    SpecLineage:
      type: object
      required: [chain, originMeta]
      properties:
        chain:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineageHop'
          description: >
            Derivation chain, leaf-first. `chain[0]` is the requested spec;
            the last entry is the root library master.
        originMeta:
          description: >
            Ingest provenance of the chain root (filename, sha256, loader);
            null when the root was not file-ingested.
          oneOf:
            - type: object
              required: [filename, sha256, loader]
              properties:
                filename:
                  type: string
                sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                loader:
                  type: string
            - type: 'null'

    DivisionGeneralSpecRef:
      type: object
      required: [specId, section, title]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
        title:
          type: string

    DivisionGeneralCandidate:
      allOf:
        - $ref: '#/components/schemas/DivisionGeneralSpecRef'
        - type: object
          required: [rank, reason, confidence]
          properties:
            rank:
              type: integer
              minimum: 1
            reason:
              type: string
              enum: [title_keyword, first_in_division]
              description: Why this spec is listed as an advisory fallback candidate
            confidence:
              type: string
              enum: [medium, low]

    DivisionGeneralSpecResult:
      type: object
      required:
        - scope
        - ownerId
        - division
        - expectedSection
        - status
        - generalSpec
        - detectionMethod
        - notes
        - message
        - candidates
      properties:
        scope:
          type: string
          enum: [library, project]
        ownerId:
          type: string
          format: uuid
        division:
          type: string
          pattern: '^\d{2}$'
        expectedSection:
          type: string
          description: Exact section number that would be assigned automatically, e.g. "27 00 00"
        status:
          type: string
          enum: [resolved, missing, not_applicable]
        generalSpec:
          oneOf:
            - $ref: '#/components/schemas/DivisionGeneralSpecRef'
            - type: 'null'
        detectionMethod:
          type: [string, 'null']
          enum: [exact_section, manual, null]
        notes:
          type: [string, 'null']
        message:
          type: string
        candidates:
          type: array
          description: Advisory only; never treated as inherited until manually selected
          items:
            $ref: '#/components/schemas/DivisionGeneralCandidate'

    SetDivisionGeneralSpecBody:
      description: 'Provide exactly one of `generalSpecId` or `status: not_applicable`.'
      oneOf:
        - type: object
          required: [generalSpecId]
          additionalProperties: false
          properties:
            generalSpecId:
              type: string
              format: uuid
              description: Same-scope spec in the requested division to use as the general spec
            notes:
              type: string
              minLength: 1
        - type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [not_applicable]
              description: Records that no in-scope general requirements spec is issued here
            notes:
              type: string
              minLength: 1

    # ── Projects ───────────────────────────────────────────────────────────────

    ProjectListItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ProjectSummary:
      type: object
      required: [projectId, name, description, sources]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        sources:
          type: array
          description: Ordered source libraries (priority ascending)
          items:
            type: object
            required: [libraryId, name, tier, priority]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string
              tier:
                type: string
                enum: [company, client]
              priority:
                type: integer
                minimum: 1

    ProjectWithToc:
      type: object
      required: [projectId, name, description, sources, toc]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        sources:
          type: array
          description: Ordered source libraries (priority ascending)
          items:
            type: object
            required: [libraryId, name, tier, priority]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string
              tier:
                type: string
                enum: [company, client]
              priority:
                type: integer
                minimum: 1
        toc:
          type: array
          items:
            type: object
            required: [specId, section, title, position]
            properties:
              specId:
                type: string
                format: uuid
              section:
                type: string
              title:
                type: string
              position:
                type: integer
                description: 1-based TOC ordering

    BrokenRef:
      type: object
      required:
        [refId, sourceSpecId, sourceSpecSection, targetSpecSection, referenceText, availableFrom]
      properties:
        refId:
          type: string
          format: uuid
        sourceSpecId:
          type: string
          format: uuid
        sourceSpecSection:
          type: string
          description: CSI section number of the spec containing the reference
        targetSpecSection:
          type: [string, 'null']
          description: Section number the reference points at (as written in the source document)
        referenceText:
          type: string
        availableFrom:
          type: array
          description: >
            Project source libraries that hold the missing target section — an
            actionable "add this section" advisory. Priority order.
          items:
            type: object
            required: [libraryId, name]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string

    OutboundReference:
      type: object
      required: [sourceSpecId, referenceText, targetSection, targetSpecId, isResolved, isBroken]
      properties:
        sourceSpecId:
          type: string
          format: uuid
        referenceText:
          type: string
        targetSection:
          type: [string, 'null']
          description: Section number this reference points at, if the reference targets a section
        targetSpecId:
          type: [string, 'null']
          format: uuid
        isResolved:
          type: boolean
        isBroken:
          type: boolean

    InboundReference:
      type: object
      required:
        [
          sourceSpecId,
          sourceSection,
          sourceTitle,
          sourceParagraphId,
          referenceText,
          isResolved,
          isBroken,
        ]
      properties:
        sourceSpecId:
          type: string
          format: uuid
        sourceSection:
          type: string
          description: CSI section number of the spec containing the reference
        sourceTitle:
          type: string
        sourceParagraphId:
          type: string
          format: uuid
        referenceText:
          type: string
        isResolved:
          type: boolean
        isBroken:
          type: boolean

    # ── Packages ───────────────────────────────────────────────────────────────

    PackageSummary:
      type: object
      required: [packageId, projectId, name, position]
      properties:
        packageId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          description: 1-based order of the package within its project

    PackageSpecEntry:
      type: object
      required: [specId, section, title, position]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
        title:
          type: string
        position:
          type: integer
          description: 1-based order of the spec within the package

    PackageWithSpecs:
      allOf:
        - $ref: '#/components/schemas/PackageSummary'
        - type: object
          required: [specs]
          properties:
            specs:
              type: array
              items:
                $ref: '#/components/schemas/PackageSpecEntry'

    RevisionAttributes:
      type: object
      description: >
        Open JSONB attributes for a profile-defined revision type. Known common
        keys include `number`, `title`, and `phase`; unknown keys are preserved.
      additionalProperties: true
      properties:
        number:
          oneOf:
            - type: string
            - type: number
        title:
          type: string
        phase:
          type: string

    CreateRevisionLegacyBody:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          description: Legacy freeform label; still accepted for backward compatibility

    CreateRevisionStructuredBody:
      type: object
      required: [type]
      properties:
        type:
          type: string
          minLength: 1
          description: String key defined by the resolved revision nomenclature profile
        date:
          type: string
          format: date
        sortOrder:
          type: integer
          minimum: 1
        attributes:
          $ref: '#/components/schemas/RevisionAttributes'

    RevisionSummary:
      type: object
      required:
        [
          revisionId,
          packageId,
          label,
          displayName,
          type,
          date,
          sortOrder,
          number,
          attributes,
          issuedAt,
          specCount,
        ]
      properties:
        revisionId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        label:
          type: string
          description: Backward-compatible display label, unique per package
        displayName:
          type: string
          description: Profile-rendered display name; #102 consumes this directly
        type:
          type: string
          description: Profile-defined revision type key
        date:
          type: string
          format: date
        sortOrder:
          type: integer
          minimum: 1
          description: Queryable ordering key within the package
        number:
          type: [string, 'null']
          description: Profile-rendered revision number, or null when not applicable
        attributes:
          $ref: '#/components/schemas/RevisionAttributes'
        issuedAt:
          type: string
          format: date-time
        specCount:
          type: integer
          description: Number of member sections frozen in this revision

    RevisionSpecEntry:
      type: object
      required: [specId, position, tree]
      properties:
        specId:
          type: string
          format: uuid
        position:
          type: integer
          description: 1-based membership order at issuance
        tree:
          $ref: '#/components/schemas/SpecTree'

    RevisionWithTrees:
      type: object
      required:
        [
          revisionId,
          packageId,
          label,
          displayName,
          type,
          date,
          sortOrder,
          number,
          attributes,
          issuedAt,
          specs,
        ]
      properties:
        revisionId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        label:
          type: string
        displayName:
          type: string
        type:
          type: string
        date:
          type: string
          format: date
        sortOrder:
          type: integer
          minimum: 1
        number:
          type: [string, 'null']
        attributes:
          $ref: '#/components/schemas/RevisionAttributes'
        issuedAt:
          type: string
          format: date-time
        specs:
          type: array
          items:
            $ref: '#/components/schemas/RevisionSpecEntry'

    # ── Templates ──────────────────────────────────────────────────────────────

    StyleNodeType:
      type: string
      enum: [part, article, pr1, pr2, pr3, pr4, pr5, pr6, pr7]
      description: >
        CSI paragraph role. Maps to the nine generator levels: `part` (PART 1 –
        GENERAL), `article` (1.1 REFERENCES), `pr1`–`pr7` (A. / 1. / a. / 1) /
        a), then repeated 1) / a) paragraph tiers).

    StyleRule:
      type: object
      required: [nodeType, properties]
      properties:
        nodeType:
          $ref: '#/components/schemas/StyleNodeType'
        properties:
          $ref: '#/components/schemas/StyleProperties'

    StyleProperties:
      type: object
      description: >
        OOXML-derived style properties for a CSI paragraph role. Recognized keys
        are documented below; **unknown OOXML keys are preserved** via the JSONB
        catchall schema. All sub-objects also accept additional OOXML properties.
      properties:
        rPr:
          type: object
          description: Run (character) properties
          properties:
            rFonts:
              type: object
              description: Font references
              properties:
                ascii:
                  type: string
                hAnsi:
                  type: string
                cs:
                  type: string
                eastAsia:
                  type: string
              additionalProperties: true
            sz:
              type: integer
              description: Font size in half-points (e.g. 20 = 10 pt)
            b:
              type: boolean
              description: Bold
            i:
              type: boolean
              description: Italic
            caps:
              type: boolean
              description: All-caps
            smallCaps:
              type: boolean
            u:
              type: string
              description: Underline type (e.g. "single")
            strike:
              type: boolean
            color:
              type: string
              description: 'RRGGBB hex or "auto" (e.g. "FF0000")'
            highlight:
              type: string
          additionalProperties: true
        pPr:
          type: object
          description: Paragraph properties
          properties:
            spacing:
              type: object
              properties:
                before:
                  type: integer
                  description: Space before in twips
                after:
                  type: integer
                  description: Space after in twips
                line:
                  type: integer
                  description: Line spacing value in twips
                lineRule:
                  type: string
                  enum: [auto, exact, atLeast]
                contextualSpacing:
                  type: boolean
              additionalProperties: true
            ind:
              type: object
              description: Indentation (twips)
              properties:
                left:
                  type: integer
                right:
                  type: integer
                firstLine:
                  type: integer
                hanging:
                  type: integer
              additionalProperties: true
            jc:
              type: string
              enum: [left, center, right, both, distribute, start, end]
          additionalProperties: true
        numbering:
          type: object
          description: Numbering definition (from `numbering.xml` level)
          properties:
            ilvl:
              type: integer
            numFmt:
              type: string
            lvlText:
              type: string
            start:
              type: integer
          additionalProperties: true
      additionalProperties: true

    TemplateMeta:
      type: object
      required: [id, name, owner, createdAt]
      description: Template identity and metadata without style rules
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique template name
        owner:
          type: [string, 'null']
          description: Firm / owner label, or null if not provided
        createdAt:
          type: string
          format: date-time

    Template:
      allOf:
        - $ref: '#/components/schemas/TemplateMeta'
        - type: object
          required: [rules]
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/StyleRule'
              description: One rule per styleable NodeType (9 max)

    DerivationReport:
      type: object
      required: [nodeTypes, skippedNodeTypes, vanishSkipped]
      description: >
        Per-NodeType derivation audit trail returned alongside the template. Use
        this to review confidence levels, intent disagreements, and rejected
        outlier values before accepting the template as authoritative.
      properties:
        nodeTypes:
          type: array
          items:
            $ref: '#/components/schemas/NodeTypeReport'
          description: Report for each NodeType that had at least one paragraph
        skippedNodeTypes:
          type: array
          items:
            $ref: '#/components/schemas/StyleNodeType'
          description: NodeTypes with zero paragraphs in the source document
        vanishSkipped:
          type: integer
          description: >
            Count of `w:vanish` (hidden) paragraphs excluded from derivation.
            Hidden paragraphs are editorial instructions, not layout specimens.

    NodeTypeReport:
      type: object
      required: [nodeType, paragraphCount, styledCount, modalStyleId, decisions]
      properties:
        nodeType:
          $ref: '#/components/schemas/StyleNodeType'
        paragraphCount:
          type: integer
          description: Total non-vanish paragraphs for this NodeType
        styledCount:
          type: integer
          description: Paragraphs that carried a recognised Word style ID
        modalStyleId:
          type: [string, 'null']
          description: >
            Most-common Word style ID among voters. Used as the **intent**
            reference in §5 consensus derivation: when no majority exists,
            the modal style's own property value is preferred over the median.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/PropertyDecision'
          description: One decision per derived OOXML property path

    PropertyDecision:
      type: object
      required: [path, value, source, confidence, disagreesWithIntent, rejected]
      description: >
        Decision record for a single OOXML property (e.g. `rPr.sz`, `pPr.ind.left`).
      properties:
        path:
          type: string
          description: Dotted OOXML leaf path (e.g. "rPr.b", "pPr.ind.left")
        value:
          description: Chosen property value
        source:
          type: string
          enum: [consensus, intent, median, single, mode]
          description: >
            Algorithm branch that produced this value.
            `consensus` — strict majority (>50%) agreed.
            `intent` — no majority; modal style's own value used as tie-breaker.
            `median` — no majority, no intent, numeric values; lower-middle median chosen.
            `single` — only one styled paragraph for this NodeType.
            `mode` — low-plurality non-numeric fallback (first-seen tie-break).
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of styled voters that agreed on the chosen value
        disagreesWithIntent:
          type: boolean
          description: >
            True when `source` is not `intent` but the modal style's value differs
            from the chosen value. Flag for human review.
        rejected:
          type: array
          description: Alternate values that were not chosen
          items:
            type: object
            required: [value, count]
            properties:
              value:
                description: The rejected property value
              count:
                type: integer
                description: Number of voters that carried this value

    # ── Editability classification (ADR-022) ────────────────────────────────────

    SpecNodeEditability:
      type: object
      required: [value, confidence, evidence]
      properties:
        value:
          type: string
          enum: [locked, editable, choice, note]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
        override:
          type: string
          enum: [locked, editable, choice, note]

    ReclassifyReport:
      type: object
      required: [specId, persisted, total, changed, entries]
      properties:
        specId:
          type: string
          format: uuid
        persisted:
          type: boolean
          description: false on a preview pass (diff computed, nothing written).
        total:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
          description: Entries whose machine value changed from before to after.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EditabilityDiffEntry'

    EditabilityDiffEntry:
      type: object
      required: [nodeId, before, after, overrideDisagrees]
      properties:
        nodeId:
          type: string
          format: uuid
        before:
          oneOf:
            - type: string
              enum: [locked, editable, choice, note]
            - type: 'null'
          description: Machine classification before this pass (null = was unclassified).
        after:
          type: string
          enum: [locked, editable, choice, note]
        overrideDisagrees:
          type: boolean
          description: A standing human override now differs from the fresh machine verdict.

    # ── Editing conventions (ADR-022 O-10) ──────────────────────────────────────

    ConventionRules:
      type: object
      description: >
        Open editing-convention ruleset. The named keys below are recognised;
        unknown keys are preserved verbatim (round-trip). `noteBanners` are
        user-supplied regex SOURCES bounded for safety at the write boundary.
      additionalProperties: true
      properties:
        colorMeanings:
          type: array
          items:
            type: object
            additionalProperties: true
        choiceTokens:
          type: array
          items:
            type: object
            additionalProperties: true
        noteBanners:
          type: array
          items:
            type: string
          description: Regex sources matching note/specifier banners
        comments:
          type: object
          additionalProperties: true
        defaultEditability:
          type: string
          enum: [locked, editable, choice, note]

    Library:
      type: object
      required: [id, tier, name, owner, parentLibraryId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tier:
          type: string
          enum: [reference, company, client]
        name:
          type: string
        owner:
          type: [string, 'null']
        parentLibraryId:
          type: [string, 'null']
          format: uuid
          description: Parent library (e.g. a client master's company parent), or null
        createdAt:
          type: string
          format: date-time

    LibrarySpec:
      type: object
      required: [specId, section, title, nodeCount]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
        title:
          type: string
        nodeCount:
          type: integer
          description: Number of paragraph nodes in the spec's tree

    EditingConvention:
      type: object
      required: [id, libraryId, name, rules, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: [string, 'null']
          format: uuid
          description: Owning library, or null for a built-in industry default
        name:
          type: string
        rules:
          $ref: '#/components/schemas/ConventionRules'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PutConventionBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        rules:
          $ref: '#/components/schemas/ConventionRules'

    CloneConventionBody:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
          format: uuid
          description: A built-in or another library's convention profile id

    # ── Revision nomenclature profiles (ADR-025 / #209) ───────────────────────

    RevisionNomenclatureType:
      type: object
      required: [key]
      additionalProperties: true
      properties:
        key:
          type: string
          minLength: 1
        name:
          type: string
        format:
          type: object
          additionalProperties: true
          properties:
            displayName:
              type: string
              description: Template using `{attributeKey}` placeholders
            number:
              type: string
              description: Template for the rendered revision number
        fields:
          type: array
          items:
            type: object
            required: [key]
            additionalProperties: true
            properties:
              key:
                type: string
                minLength: 1
              kind:
                type: string
                enum: [string, integer, number, date, boolean, json]
              required:
                type: boolean
              sequence:
                type: string

    RevisionNomenclatureProfile:
      type: object
      required: [id, projectId, name, types, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
          description: Owning project, or null for a built-in default
        name:
          type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/RevisionNomenclatureType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PutRevisionNomenclatureBody:
      type: object
      required: [name, types]
      properties:
        name:
          type: string
          minLength: 1
        types:
          type: array
          items:
            $ref: '#/components/schemas/RevisionNomenclatureType'

    CloneRevisionNomenclatureBody:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
          format: uuid
          description: A built-in or another project's revision nomenclature profile id

    ParagraphAssociation:
      type: object
      required: [id, label, externalMetadata, createdAt]
      description: External content link associated with a paragraph node (#109).
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
        externalProvider:
          type: string
          description: DMS connector identity (ADR-014 D5). Present together with externalId or absent.
        externalId:
          type: string
          description: Document identifier within the DMS. Present together with externalProvider or absent.
        url:
          type: string
          format: uri
          description: Direct URL provenance for firms without a DMS connector.
        contentHash:
          type: string
          description: sha256 hex digest of the referenced bytes, when known.
        externalMetadata:
          type: object
          additionalProperties: true
          description: Arbitrary provider-specific metadata (empty object when none supplied).
        createdAt:
          type: string
          format: date-time

    CreateAssociation:
      type: object
      required: [label]
      description: >
        Request body for associating external content with a paragraph.
        Either a url, or both externalProvider and externalId, must be provided.
        externalProvider and externalId are both-or-neither — a lone one of the
        pair is rejected (422) even when a url is present.
      dependentRequired:
        externalProvider: [externalId]
        externalId: [externalProvider]
      properties:
        label:
          type: string
          minLength: 1
        externalProvider:
          type: string
          description: DMS connector identity. Always paired with externalId (both-or-neither).
        externalId:
          type: string
          description: Document identifier within the DMS. Always paired with externalProvider (both-or-neither).
        url:
          type: string
          format: uri
          description: Direct URL. Required when externalProvider/externalId are absent.
        contentHash:
          type: string
          description: sha256 hex digest of the referenced bytes.
        externalMetadata:
          type: object
          additionalProperties: true
          description: Arbitrary provider-specific metadata.
