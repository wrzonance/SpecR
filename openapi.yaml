openapi: 3.1.0
info:
  title: SpecR API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Headless REST API for CSI® MasterFormat®-compatible specification document
    automation with round-trip DOCX support. Independent project; not affiliated
    with CSI.

# No authentication yet — auth lands with Phase 5f (#43). The explicit empty
# security array documents that every endpoint is currently unauthenticated.
security: []

servers:
  - url: http://localhost:3000
    description: Local development server

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [system]
      responses:
        '200':
          description: Server is alive and the database is reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [db, uptime]
                        properties:
                          db:
                            type: string
                            description: Database connectivity state ("connected")
                          uptime:
                            type: integer
                            description: Process uptime in whole seconds
        '503':
          description: 'Database unavailable — `{success: false, error: "database unavailable"}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parse:
    post:
      operationId: parseDocument
      summary: Upload and parse a spec document (async)
      description: >
        Upload a `.docx`, `.sec`, `.txt`, or `.pdf` file. Returns 202 immediately with a
        `jobId`; poll `/parse/jobs/{jobId}` for progress and result. Rate-limited per IP
        to a configurable quota (default 10 requests/minute via `RATE_LIMIT_UPLOAD_MAX`;
        disable with `DISABLE_RATE_LIMIT`). Optionally pass `numberingProfileId` to apply
        a saved structural numbering profile (#299) as a deterministic override during
        this parse; omit it for the default 5-signal inference. Profile application is at
        parse time — an already-parsed spec is not re-applied (SpecR keeps no source DOCX).
      tags: [parse]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Spec document (.docx, .sec, .txt, or .pdf). Max 10 MB.
                section:
                  type: string
                  description: Override the detected CSI section number (e.g. "09 91 26").
                title:
                  type: string
                  description: Override the detected section title.
                numberingProfileId:
                  type: string
                  format: uuid
                  description: >
                    Optional saved numbering profile to apply as a deterministic
                    structural override (#299). Must exist (→ 404 if not). Applies to
                    DOCX inference; omit for default 5-signal behavior.
      responses:
        '202':
          description: Parse job accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [jobId]
                        properties:
                          jobId:
                            type: string
                            format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /parse/jobs/{jobId}:
    get:
      operationId: getParseJob
      summary: Poll parse job progress
      tags: [parse]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ParseJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /search:
    get:
      operationId: searchParagraphs
      summary: Ranked full-text paragraph search
      description: >
        Ranked full-text search over paragraph content (ADR-062): PostgreSQL
        `websearch_to_tsquery` + `ts_rank_cd` (proximity-aware, so a tight cluster
        of the query terms outranks the same terms scattered across a long
        paragraph) with `ts_headline` snippets. A degenerate (no-lexeme) query
        falls back to a substring scan. Every hit carries stable anchors — spec id,
        section, title, and paragraph UUID — so a client can navigate straight to
        the result. Scope with `libraryId`/`projectId` (a spec is a library master
        or a project working copy), `division`, `part` (CSI PART 1/2/3), and
        `nodeType`. Hidden (`meta.vanish`) content is not filtered — retrieval
        surfaces all stored text; suppression is a render concern.
      tags: [search]
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (natural language or keywords; supports quoted phrases, `or`, `-negation`).
          schema:
            type: string
            minLength: 1
        - name: libraryId
          in: query
          required: false
          description: Scope to specs owned by this library master.
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: false
          description: Scope to specs owned by this project.
          schema:
            type: string
            format: uuid
        - name: division
          in: query
          required: false
          description: 2-digit CSI division, e.g. "27".
          schema:
            type: string
            pattern: '^\d{2}$'
        - name: part
          in: query
          required: false
          description: CSI PART ordinal — 1 (General), 2 (Products), or 3 (Execution).
          schema:
            type: integer
            minimum: 1
            maximum: 3
        - name: nodeType
          in: query
          required: false
          description: >-
            Restrict to a paragraph node type (part, article, pr1…pr7, note,
            or the object/objectText body-object types, #300).
          schema:
            type: string
            enum:
              [
                spec,
                part,
                article,
                pr1,
                pr2,
                pr3,
                pr4,
                pr5,
                pr6,
                pr7,
                note,
                continuation,
                object,
                objectText,
              ]
        - name: limit
          in: query
          required: false
          description: Maximum results (1–100, default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Ranked paragraph hits (highest rank first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: '#/components/schemas/SearchHit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}:
    get:
      operationId: getSpec
      summary: Retrieve a spec with its full paragraph tree
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Spec with paragraph tree
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecTree'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateSpec
      summary: Update spec metadata
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                section:
                  type: string
                  description: CSI section number (e.g. "09 91 26").
                title:
                  type: string
      responses:
        '200':
          description: Updated spec summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: withdrawSpec
      summary: Soft-withdraw (tombstone) a library master
      description: >
        Soft-withdraws a library master (ADR-030): tombstones it with
        `withdrawn_at`. The row, its paragraphs, and `parent_spec_id` lineage
        edges stay intact — the master is hidden from listings/resolution
        (`GET /libraries/{id}/specs`, project source resolution, broken-ref
        `availableFrom`, the coordination present set) but remains retrievable
        by id (with `withdrawnAt` surfaced) and reversible via
        `POST /specs/{id}/restore` — and a re-import of the same section/source
        into the library also revives it (#415), replacing its content. Idempotent —
        a re-withdraw returns the EXISTING `withdrawnAt`, never a new
        timestamp. Withdrawal targets library masters only; on a project copy
        it returns 409.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Master withdrawn (or already was)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [specId, withdrawnAt]
                        properties:
                          specId:
                            type: string
                            format: uuid
                          withdrawnAt:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The id is a project copy, not a library master — withdrawal applies
            to masters. Remove a project copy via
            `DELETE /projects/{id}/specs/{specId}` instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/restore:
    post:
      operationId: restoreSpec
      summary: Restore a withdrawn library master
      description: >
        Clears a library master's withdrawal tombstone (ADR-030), making it
        visible in listings/resolution again. Idempotent — restoring a master
        that is not withdrawn is a 200 no-op. On a project copy it returns 409
        (withdrawal/restore applies to masters).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Master restored (or was already active)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [specId]
                        properties:
                          specId:
                            type: string
                            format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The id is a project copy, not a library master — withdrawal/restore
            applies to masters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs:
    post:
      operationId: insertParagraph
      summary: Insert a new paragraph after an anchor node
      description: >
        Inserts a new paragraph immediately after `anchorNodeId`, as its
        sibling (same parent), shifting the following siblings' positions
        (#372). CSI labels are render-derived from node type + sibling
        ordinal, so consumers renumber automatically. `nodeType` defaults to
        the anchor's own type; only `article`, `pr1`–`pr7`, and `continuation`
        are insertable — an anchor whose type falls outside that set (a part
        or note) requires an explicit `nodeType`, otherwise the request is
        rejected 422. Parts are never insertable (a CSI section keeps its
        three-part shape) and notes materialize via accept-as-note instead.
        An explicit `nodeType` must also be a legal sibling of the anchor: its
        own type, `continuation` (legal at any tier), or any insertable type
        when the anchor is tierless — a `note` or a `continuation`, neither of
        which carries a CSI tier of its own and so cannot constrain the tier of
        what follows it. A mismatched tier — e.g. `pr1` after an `article`
        anchor, or `article` after a `pr1` anchor — is rejected 422, since it
        would place the new node one CSI tier away from where that type
        belongs.


        Inserting is a content write: it passes the composed edit gate
        (ADR-018) and bumps the spec's `contentVersion`. Supply
        `expectedVersion` to make the write conditional — a stale value is
        rejected 409 with the current version. The anchor must belong to the
        spec in the path; otherwise the request is rejected with 403.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anchorNodeId, text]
              properties:
                anchorNodeId:
                  type: string
                  format: uuid
                  description: >
                    The paragraph the new node is inserted after (same
                    parent, next position).
                text:
                  type: string
                  minLength: 1
                  description: New paragraph text (must be non-empty).
                nodeType:
                  type: string
                  enum: [article, pr1, pr2, pr3, pr4, pr5, pr6, pr7, continuation]
                  description: >
                    Node type for the new paragraph. Defaults to the anchor's
                    own type.
                expectedVersion:
                  type: integer
                  minimum: 1
                  description: >
                    Optional optimistic-concurrency precondition — the spec
                    `contentVersion` the caller read. Stale → 409.
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '201':
          description: Created paragraph node
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /specs/{id}/paragraphs/{nodeId}:
    patch:
      operationId: updateParagraph
      summary: Update a single paragraph's text by UUID
      description: >
        Replaces one paragraph's text in place (ADR-009), bumping its
        `base_version` and the spec's `contentVersion`. The Revit add-in pushes
        model-parameter changes here without replacing the whole spec. The node
        must belong to the spec in the path; otherwise the request is rejected
        with 403.


        Optimistic concurrency (ADR-018): supply `expectedVersion` (the spec
        `contentVersion` you read) to make the write conditional — a stale value
        is rejected 409 with the current version, so a concurrent edit is never
        silently clobbered. The composed edit gate also rejects writes to an
        archived spec or one locked upstream in a DMS (409).


        A body `object` node (#300, ADR-072) is locked — its content is a
        captured OOXML blob, editable only through its `objectText` children —
        so a direct write to it is rejected 422.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  description: New paragraph text (must be non-empty).
                expectedVersion:
                  type: integer
                  minimum: 1
                  description: >
                    Optional optimistic-concurrency precondition — the spec
                    `contentVersion` the caller read. Stale → 409.
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '200':
          description: Updated paragraph node (with its subtree)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/editability:
    patch:
      operationId: patchEditability
      summary: Set or clear a paragraph's human editability override
      description: >
        Records the reviewer's correction as the paragraph's `editability_override`
        (ADR-022 D2), stored beside — never merged into — the machine classification.
        `editability: null` clears the override so the effective value falls back to
        the machine verdict. The node must belong to the spec in the path (else 403).
        Setting a non-null override on an `object` or `objectText` node is rejected
        422 — their editability is fixed at capture time (ADR-072 decision 2: an
        `object` always `locked`, its `objectText` children always `editable`) and
        is never a human-editable choice; clearing (`null`) such a node is a no-op
        ownership-checked 200, since there is never a standing override to clear.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [editability]
              properties:
                editability:
                  oneOf:
                    - type: string
                      enum: [locked, editable, choice, note]
                    - type: 'null'
                  description: Override value, or null to clear it.
      responses:
        '200':
          description: Override applied (or cleared)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [nodeId, editability]
                        properties:
                          nodeId:
                            type: string
                            format: uuid
                          editability:
                            oneOf:
                              - type: string
                                enum: [locked, editable, choice, note]
                              - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/removal:
    patch:
      operationId: removeParagraph
      summary: Remove or restore a paragraph (reversible soft removal)
      description: >
        The editability program's reversible paragraph removal (#251, ADR-022).
        `removed: true` sets the node's `vanish` flag — it is suppressed from the
        owner-facing renders (DOCX and Markdown) while the row, its subtree, and
        any contained cross-references stay intact; `removed: false` reverses it.
        This is a soft, reversible removal by design (symmetric with the spec
        soft-delete in ADR-030), not a hard cascading DELETE. Only body paragraphs
        are removable: a structural heading (`part`/`article`) or a `note` node —
        which the owner-facing renderers cannot suppress — is rejected 422. The
        toggle is idempotent: re-sending the same `removed` value is a no-op that
        returns the node unchanged without minting a new content version. The node
        must belong to the spec in the path (else 403). The composed edit gate
        (ADR-018) rejects an archived spec or one locked upstream in a DMS (409).
        Every model-driven render honors removal: the `.SEC` egress filters an
        owner-removed body paragraph (and its subtree), consistent with DOCX and
        Markdown (#278, ADR-060), so removed content never appears in an export.
        This is a filter, not a lossless encode — SEC's hidden marker already means
        "specifier note", so removal is not round-tripped back as `vanish` — and it
        is latent regardless, as there is no `.SEC` export endpoint today.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [removed]
              properties:
                removed:
                  type: boolean
                  description: >
                    true to remove (set vanish), false to restore (clear vanish).
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '200':
          description: Updated paragraph node (with its subtree)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/acknowledgement:
    patch:
      operationId: acknowledgeParagraph
      summary: Acknowledge or un-acknowledge a note or textBox object node
      description: >
        Per-node acknowledgement (#545, ADR-079 follow-on): the specifier
        affirms they have read and accepted a `note` or a `textBox` `object`
        node. `acknowledged: true` clears the issuance-readiness gate's
        `specifier_note_present` / `body_object_present` finding for it
        WITHOUT removing or hiding the content — it still renders exactly as
        before in every output format. `acknowledged: false` reverses it.
        Deliberately separate state from `vanish`: only `note` nodes and
        `textBox`-kind `object` nodes are acknowledgeable — a `table`-kind
        object (structural content, ADR-072) or any other node type is
        rejected 422. The toggle is idempotent — re-sending the same value is
        a no-op that returns the node unchanged without minting a new content
        version. The node must belong to the spec in the path (else 403). The
        composed edit gate (ADR-018) rejects an archived spec or one locked
        upstream in a DMS (409).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledged]
              properties:
                acknowledged:
                  type: boolean
                  description: true to acknowledge, false to un-acknowledge.
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '200':
          description: Updated paragraph node (with its subtree)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/reject:
    patch:
      operationId: rejectParagraph
      summary: Revert a paragraph's pending edits to its last-checkpoint state
      description: >
        Per-paragraph reject (ADR-052 D4): reverts `nodeId` to the text it held
        at `checkpointId`'s sealed content_version, shipped as an unconditional
        restore-to-version write through the same machinery as PATCH
        `/specs/{id}/paragraphs/{nodeId}` — no `expectedVersion` is threaded,
        so any edit made after the checkpoint sealed is discarded rather than
        blocking on a stale-version conflict. The write is itself an ordinary
        history row, so a reject is always visible in the oplog, never a
        silent no-op. `checkpointId` must have sealed this exact spec (spec-
        or project-scoped alike); one that never sealed it, or has never
        recorded state for this paragraph before its cutoff, is rejected.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkpointId]
              properties:
                checkpointId:
                  type: string
                  format: uuid
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '200':
          description: Reverted paragraph node (with its subtree)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Paragraph not found, or checkpointId never sealed this spec
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '422':
          description: >
            The target is a locked `object` node, or no state was recorded
            for this paragraph at or before the checkpoint's cutoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/reclassify:
    post:
      operationId: reclassifySpec
      summary: Re-run editability classification over stored source facts
      description: >
        Re-classifies every paragraph from its persisted `source_facts` (ADR-022 D4)
        with no source document — the architectural point of the substrate. Supply
        `rules` to preview candidate conventions; omit them to resolve the spec's
        library convention profile (built-in default fallback). `preview: true`
        computes the diff without persisting. Standing human overrides are never
        touched; the report flags where the fresh machine verdict now disagrees with
        an override (ADR-022 D2).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  $ref: '#/components/schemas/ConventionRules'
                preview:
                  type: boolean
                  description: Compute the diff without persisting (preview-before-save).
      responses:
        '200':
          description: Before/after classification diff report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ReclassifyReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/finalize:
    post:
      operationId: finalizeSpec
      summary: Finalize onboarding (review → active)
      description: >
        Marks a human as having reviewed the machine's first pass: flips
        `onboardingStatus` from `review` to `active` (ADR-022 D6). Also snapshots
        the spec's resolved convention rules into its library's OWN convention
        profile, so the next import from that library self-classifies against them
        instead of falling back to the built-in default. `active` does NOT seal the
        spec — corrections (#136), reclassify, conventions (#137) and style-source
        (#138) endpoints keep working. Idempotent: finalizing an already-active spec
        returns 200 unchanged.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Onboarding finalized (or already active)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [onboardingStatus]
                        properties:
                          onboardingStatus:
                            type: string
                            enum: [active]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/reopen:
    post:
      operationId: reopenSpec
      summary: Reopen onboarding (active → review)
      description: >
        Flips `onboardingStatus` from `active` back to `review` (ADR-022 D6).
        Purely informational — no endpoint behavior gates on it. Reopening an
        already-`review` spec returns 200 unchanged.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Onboarding reopened (or already in review)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [onboardingStatus]
                        properties:
                          onboardingStatus:
                            type: string
                            enum: [review]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/comments/{index}/accept-as-note:
    post:
      operationId: acceptCommentAsNote
      summary: Materialize a margin comment as a note node
      description: >
        Inserts the margin comment at `index` (captured in `source_facts.comments`)
        as a `note` paragraph immediately after the anchor (ADR-022 D4 — never a
        silent tree mutation). Repeating the call returns 409 with the existing
        note's id (idempotent contract). The node must belong to the spec (else 403).


        Materializing a note is a content write: it passes the composed edit gate
        (ADR-018) and bumps the spec's `contentVersion`. Accepting against an
        archived or upstream-locked spec is rejected with 409.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Zero-based index into the anchor's source_facts.comments.
      requestBody:
        required: false
        description: >
          Optional (#377) — the route was bodyless pre-#377 and a truly absent
          body still resolves as if `{}` were sent (byte-identical behavior).
        content:
          application/json:
            schema:
              type: object
              properties:
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '201':
          description: Note node created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [noteId]
                        properties:
                          noteId:
                            type: string
                            format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            Either the comment was already accepted (the existing note's id
            travels back as `noteId`), or the spec is archived / upstream-locked
            and rejected by the edit gate (no `noteId`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      noteId:
                        type: string
                        format: uuid
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/comments/{index}/closure:
    patch:
      operationId: setCommentClosed
      summary: Close or reopen a source-document review comment
      description: >
        A mutable comment-closure toggle (#545, ADR-079 follow-on) — the only
        supported path to clear the issuance-readiness gate's `open_comment`
        finding on an existing spec. `closed: true` closes the comment at
        `index` (captured in `source_facts.comments`); `false` reopens it.
        The node must belong to the spec (else 403). `no-comment` (no comment
        exists at `index`) is a lookup miss → 404, not a validation failure.
        The toggle is idempotent — re-sending the same value is a no-op that
        returns the node unchanged without minting a new content version.
        Passes the composed edit gate (ADR-018): archived/upstream-locked →
        409. `POST .../accept-as-note` also closes the originating comment as
        part of accepting it (#545) — this endpoint is for closing (or
        reopening) a comment independently of accepting it as a note.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Zero-based index into the anchor's source_facts.comments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closed]
              properties:
                closed:
                  type: boolean
                  description: true to close, false to reopen.
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '200':
          description: Updated paragraph node (with its subtree)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Paragraph not found, or no comment exists at that index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/associations:
    get:
      operationId: listAssociations
      summary: List external content associations for a paragraph
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: List of paragraph associations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParagraphAssociation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAssociation
      summary: Associate external content with a paragraph
      description: >
        Links a DMS document or direct URL to a paragraph. Either a complete DMS
        pair (externalProvider + externalId) or a url must be provided.
        Only link + provenance is stored — never the licensed bytes (ADR-019).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssociation'
      responses:
        '201':
          description: Association created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ParagraphAssociation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/associations/{associationId}:
    delete:
      operationId: deleteAssociation
      summary: Remove an external content association from a paragraph
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/AssociationId'
      responses:
        '204':
          description: Association deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/lineage:
    get:
      operationId: getSpecLineage
      summary: Chain of custody for a spec
      description: >
        Walks `parent_spec_id` from the requested spec to the root library master,
        returning every hop in leaf-first order (`chain[0]` = the requested spec,
        last entry = the root).


        `behindBy` for each hop = the parent's current `contentVersion` minus this
        copy's `originVersion` (the version it was cloned from); null on the root
        because the root has no parent to drift behind.


        `originMeta` is the root's ingest provenance (`filename`, `sha256`, `loader`)
        when the root was file-ingested; null otherwise.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Custody chain from requested spec to root
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecLineage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/paragraphs/{nodeId}/history:
    get:
      operationId: getParagraphHistory
      summary: Read one paragraph's stored iterations
      description: >
        Defaults to tier-1 coalesced sessions (ADR-052 D3/D9): consecutive
        tier-0 edits by one actor fold into one session with a net
        before/after diff, still carrying the raw span as each session's
        nested `entries`. `raw=true` returns the tier-0 snapshots directly,
        oldest-first, including the creation row and current state. A project
        paragraph starts at its derive point by default; `includeOrigin=true`
        prepends the direct master's pre-derive iterations through
        `origin_paragraph_id` (ADR-052 D5) for either shape.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - $ref: '#/components/parameters/NodeId'
        - name: includeOrigin
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: raw
          in: query
          required: false
          description: Return tier-0 raw iterations instead of the default coalesced sessions.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paragraph iterations — coalesced sessions by default, raw when `raw=true`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        oneOf:
                          - type: array
                            items:
                              $ref: '#/components/schemas/ParagraphHistorySession'
                          - type: array
                            items:
                              $ref: '#/components/schemas/ParagraphHistoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/history:
    get:
      operationId: getSpecHistory
      summary: Read a spec's content-version timeline
      description: >
        Returns content-version steps with changed-paragraph counts plus derive
        and immutable package-revision milestones. `packageId` narrows revision
        milestones to one issuance track; edits remain the same within-spec branch.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - name: packageId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Version timeline and milestones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/history/diff:
    get:
      operationId: getSpecHistoryDiff
      summary: Compare two stored states of one spec
      description: >
        Resolves each anchor as a content version, package revision UUID,
        `origin`, or `current`, then returns paragraph-UUID-aligned
        added/removed/modified rows in document order. Text is before/after at
        paragraph grain; word-level highlighting is intentionally client-side.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/HistoryAnchor'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/HistoryAnchor'
      responses:
        '200':
          description: Row-level point-to-point diff
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecHistoryDiff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/hierarchy-report:
    get:
      operationId: getSpecHierarchyReport
      summary: Per-paragraph hierarchy-inference scoring report
      description: >
        Every scored structural paragraph in the spec, worst confidence first,
        labeled exactly as a client would see it in the rendered markdown
        (WS2, #424). `counts` and `unscoredReason` mirror the `hierarchy` field
        of `OnboardingReport` (ADR-055) exactly; `paragraphs` carries ALL scored
        nodes (not just the below-threshold subset) so a caller can review the
        full confidence distribution, not only what already tripped the review
        threshold.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Hierarchy-inference scoring report, worst-first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HierarchyReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/style-source:
    post:
      operationId: setSpecStyleSource
      summary: Assign a style template to a spec (manual style-source pick)
      description: >
        Associates an existing style template (#30/#31) with the spec so the
        generator can render it with a real house style (#138). One template per
        spec; re-assigning replaces the previous template. `.SEC`/`.txt`/PDF
        masters carry no adopted visual style, so this is the narrowest useful
        slice of #125's style sources. Both the spec and the template must
        already exist — either missing → 404 (pre-checked, never via the FK error).
        A template concurrently deleted during assignment is also reported as 404,
        not a scope conflict (#366). A template assigned to any spec cannot be
        deleted (DELETE /templates/{id} → 409). Library scoping (#318): the template
        must be a built-in / global template (`libraryId: null`) or owned by the
        spec's own library; a template from another library is rejected with 409.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId]
              properties:
                templateId:
                  type: string
                  format: uuid
                  description: Style template to associate with the spec.
      responses:
        '200':
          description: Style source assigned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/StyleSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: clearSpecStyleSource
      summary: Clear a spec's style template (fall back to generator defaults)
      description: >
        Removes the spec→template association (#138). Idempotent — clearing an
        already-unset association is still 200. The spec must exist (unknown → 404).
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Style source cleared (styleSource is null)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [styleSource]
                        properties:
                          styleSource:
                            type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/generate:
    post:
      operationId: generateDocx
      summary: Generate a DOCX from a stored spec AST
      description: >
        Header/footer content is resolved automatically (#304): when the spec
        belongs to exactly one project, and that project's client → project →
        package → revision scope chain has at least one configured
        `header_footer_configs` layer, the resolved composition and field
        values (project name, client name, etc.) are rendered into the
        generated DOCX, stamped with the current date. An orphan spec, a spec
        owned by two or more projects, or a resolvable project with no
        configured layers anywhere in its chain all fall back gracefully — the
        DOCX renders with no header/footer, identical to the pre-#304 output.
        This resolution has no request or response shape of its own; it is
        driven entirely by existing project/package/revision and
        `header_footer_configs` state.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  format: uuid
                  description: >
                    Style template to apply (font, spacing, indent, numbering format).
                    Omitted → the seeded UFGS-Default template is applied; if that template
                    is absent (un-migrated database) the response is still 200 with an
                    unstyled DOCX. Unknown id → 404.
                sectionNumberFormat:
                  type: string
                  enum: [canonical, dots, compact, spaced-compact]
                  description: >
                    Presentation format for generated section numbers in the synthetic
                    DOCX title and confidently identified Section references in paragraph
                    text. Canonical emits "09 91 00", dots emits "09.91.00", compact
                    emits "099100", and spaced-compact emits "09 9100". Stored AST and
                    database values remain canonical. Omitted → the sole owning project's
                    override, then its client's firm default, then canonical. If the spec
                    belongs to no project (or several), canonical applies.
                mode:
                  $ref: '#/components/schemas/IssuanceMode'
                overrideReadinessGate:
                  type: boolean
                  description: >
                    Unaudited escape hatch (ADR-079 decision 8, #406) — renders
                    despite outstanding findings. Ignored unless mode is final.
            examples:
              dotted-section-numbers:
                value:
                  sectionNumberFormat: dots
      responses:
        '200':
          description: DOCX file stream
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >
            `mode: 'final'` is blocked by the ADR-079 (#406) issuance-readiness
            gate — the spec has one or more outstanding ReadinessFinding
            entries, returned inline as `findings`. The error message also
            reports the finding count and points at
            `GET /specs/{id}/readiness-report` for the full list; pass
            `overrideReadinessGate: true` to generate anyway.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      findings:
                        type: array
                        items: { $ref: '#/components/schemas/ReadinessFinding' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/diff:
    post:
      operationId: diffSpecDocx
      summary: Diff a returned DOCX against stored spec state
      description: >
        Upload an edited DOCX generated by SpecR. The response is a UUID-keyed
        3-way diff: base snapshot, current DB state (`ours`), and returned DOCX
        content (`theirs`). The synthetic title paragraph is ignored because it
        is not a persisted AST node.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Returned SpecR-generated DOCX. Max 10 MB.
      responses:
        '200':
          description: Structured merge diff
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DiffResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/merge:
    post:
      operationId: mergeSpecDiff
      summary: Apply accepted changes from a spec diff
      description: >
        Submit accepted change UUIDs along with the `DiffResult` previously
        returned by `/specs/{id}/diff`. Accepted modified/conflict entries update
        `paragraphs.text`, insert a `paragraph_versions` snapshot for the new
        base version, and increment `paragraphs.base_version`. Rejected entries
        are discarded by omission. A successful merge bumps the spec's
        `contentVersion` at most once — not once per applied entry — and only
        when at least one change is actually applied; a no-op merge (nothing
        accepted) leaves `contentVersion` unchanged.


        Accepted `diff.added` entries insert the new paragraph immediately
        after `afterUuid` (the nearest preceding controlled paragraph in
        document order) — the same sibling-insert primitive `POST
        /specs/{id}/paragraphs` uses. An addition with no `afterUuid` (nothing
        precedes it, including table-cell paragraphs) cannot currently be
        applied and is rejected 400; accept the redlined DOCX to capture it by
        hand instead. An addition whose `afterUuid` resolves to a structural
        node (part/article/note, outside the pr1–pr7/continuation body tier) is
        also rejected 400 — an orphan carries no tier to become that node's
        sibling. Re-submitting an already-applied addition is a no-op, not a
        duplicate (a re-used uuid naming a different-text or different-spec row
        is rejected 400, not silently duplicated). Accepted `diff.deleted`
        entries reversibly `vanish` the paragraph (ADR-022) —
        the same as `PATCH .../removal` — snapshotting its prior text into
        `paragraph_versions`; only body paragraphs are removable this way, a
        `part`/`article`/`note` uuid in `diff.deleted` is rejected 400.


        Optimistic concurrency (ADR-018): supply `expectedVersion` to make the
        merge conditional on the spec being at that `contentVersion` — stale →
        409 with the current version. The composed edit gate also rejects a merge
        on an archived spec or one locked upstream (409).


        `diff.objectConflicts` (#520) entries are detection-only: accepting an
        entry's `objectId` or any of its `affectedUuids` is always rejected
        400 — a structural change on a table/text box (a row/column added or
        removed, a kind change) cannot be auto-merged and must be resolved by
        hand.


        `diff.deleteConflicts` (#465) entries ARE auto-mergeable, unlike
        `objectConflicts` — accepting one discards the divergent `ours` edit
        and applies the deletion, the same `vanish` path `diff.deleted`
        uses; omitting the uuid from `accept` keeps the edit untouched. If
        the paragraph's text changed again between diff-compute time and
        accept time, the merge is rejected 409 rather than silently
        discarding a THIRD, never-seen edit.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: Merge apply summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MergeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/lock:
    get:
      operationId: getSpecLock
      summary: Current advisory lock on a spec
      description: >
        Returns the live advisory lock (ADR-018 D2) or `{ locked: false }` when
        none is held. An expired lock reads as free. Advisory only — a lock never
        blocks a write on its own; the edit gate governs writes.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Lock state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [locked, lock]
                        properties:
                          locked:
                            type: boolean
                          lock:
                            description: >
                              The live lock when held, or null when the spec is
                              unlocked (or its lock has expired).
                            oneOf:
                              - $ref: '#/components/schemas/LockState'
                              - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: acquireSpecLock
      summary: Acquire (or refresh / steal-after-expiry) an advisory lock
      description: >
        Acquires the soft lock for `holder`. Succeeds when the spec is free, the
        caller already holds it (refresh), or the existing lock has expired
        (steal). A live lock held by another caller is refused with 409 and the
        blocking holder. There is no unlock ceremony — abandoned locks expire.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder]
              properties:
                holder:
                  type: string
                  minLength: 1
                  description: Caller identity label (authenticated identity once #43 lands).
                ttlSeconds:
                  type: integer
                  minimum: 1
                  maximum: 3600
                  description: Lock lifetime in seconds (default 900 / 15 min).
      responses:
        '200':
          description: Lock acquired
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LockState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A live lock is held by another caller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      holder:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: releaseSpecLock
      summary: Release an advisory lock
      description: >
        Releases the lock only if `holder` matches the current holder. A release
        by a non-holder (or when no lock is held) is refused with 409.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder]
              properties:
                holder:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Lock released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

