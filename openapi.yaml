  /projects/{id}/specs:
    get:
      operationId: listProjectSpecs
      summary: List a project's specs with resolved disciplines
      description: >
        Returns the project's specs (its table-of-contents rows), each with its
        resolved `discipline` (ADR-065). Project copies belong to no single
        library, so disciplines resolve against the built-in default mapping.
        Pass `discipline` to keep only specs resolving to that discipline key.
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: discipline
          in: query
          required: false
          description: >
            Discipline key (from GET /disciplines) to filter the listing by. The value is
            trimmed before matching, and blank is unset: an empty or whitespace-only value
            is treated as no filter, so `?discipline=` returns the full listing rather
            than an empty one.
          schema:
            type: string
      responses:
        '200':
          description: Specs in the project TOC
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
