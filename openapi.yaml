                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [projectId]
                        properties:
                          projectId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /packages/{id}/header-footer:
    get:
      operationId: getPackageHeaderFooter
      summary: Get a design package's own header/footer config override
      description: >
        Reads only the package's own override row. Use
