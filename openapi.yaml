  /libraries:
    get:
      operationId: listLibraries
      summary: List all libraries
      description: >
        Returns every library (reference, company, and client tiers), ordered by
        tier then name. The seeded built-in reference and company masters are
        always present.
      tags: [libraries]
      responses:
        '200':
          description: All libraries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Library'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/clients:
    post:
      operationId: createClientLibrary
      summary: Create a client-tier library
      description: >
        Creates a client library under a company-tier parent (the seeded Default
        Company Master when no parent is given). The library's owner is set to its
        name.
      tags: [libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                parentLibraryId:
                  type: string
                  format: uuid
                  description: Company-tier parent; defaults to the Default Company Master
      responses:
        '201':
          description: Client library created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Library'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{id}:
    patch:
      operationId: renameLibrary
      summary: Rename a client library
      description: >
        Renames a client-tier library (name only; owner unchanged). Built-in
        reference and company libraries cannot be renamed.
      tags: [libraries]
      parameters:
        - name: id
          in: path
          required: true
          description: Library UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Renamed library
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Library'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{id}/specs:
    get:
      operationId: listLibrarySpecs
      summary: List the specs owned by a library
      description: >
        Returns the specs owned by the library, each with its paragraph node
        count and `withdrawnAt` tombstone, ordered by section. Withdrawn masters
        (ADR-030) are hidden by default; pass `includeWithdrawn=true` to surface
        them so a browse-and-restore flow can discover the spec UUID that
        `POST /specs/{id}/restore` needs.
      tags: [libraries]
      parameters:
        - name: id
          in: path
          required: true
          description: Library UUID
          schema:
            type: string
            format: uuid
        - name: includeWithdrawn
          in: query
          required: false
          description: Include withdrawn masters (ADR-030), each with its withdrawnAt timestamp.
          schema:
            type: boolean
            default: false
        - name: discipline
          in: query
          required: false
          description: >
            Discipline key (from GET /disciplines) to filter the listing by, resolved
            under the library's mapping (ADR-065). The value is trimmed before matching,
            and blank is unset: an empty or whitespace-only value is treated as no filter,
            so `?discipline=` returns the full listing rather than an empty one.
          schema:
            type: string
      responses:
        '200':
          description: Specs owned by the library
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LibrarySpec'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{id}/reference-graph:
    get:
      operationId: getLibraryReferenceGraph
      summary: Library section-reference graph (nodes, edges, umbrella annotations)
      tags: [libraries]
      parameters:
        - name: id
          in: path
          required: true
          description: Library UUID
          schema: { type: string, format: uuid }
        - name: includeAnchors
          in: query
          required: false
          description: Add capped per-edge paragraph anchor lists (see ReferenceGraph.anchorCap).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Reference graph for the library
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ReferenceGraph' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/import/jobs/{jobId}:
    get:
      operationId: getOnboardingJob
      summary: Poll a library-onboarding job
      tags: [libraries]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Onboarding job status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/OnboardingJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{id}/import:
    post:
      operationId: importLibraryMaster
      summary: Onboard a master document into a library (async)
      description: >
        Upload a `.docx`, `.sec`, or `.txt` master document into the target
        ADR-015 library. Returns 202 with a `jobId`; poll
        `/libraries/import/jobs/{jobId}` for progress and the onboarding report.
        The pipeline parses (capturing source facts), persists the spec into the
        library, derives a style template (DOCX only), classifies editability
        using the library's convention profile or the built-in default, and
        summarizes hierarchy-inference confidence (ADR-055) into the report's
        hierarchy section. Importing a section/source the library already holds
        replaces that master's parsed content in place (`content_version` bumps) —
        and if the master was withdrawn, the re-import revives it (clears
        `withdrawnAt`, #415). Source bytes are discarded after parse (ADR-021).
        Rate-limited per IP (default
        10 requests/minute, shared with `POST /parse`; configurable, can be disabled).
      tags: [libraries]
      parameters:
        - name: id
          in: path
          required: true
          description: Library UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Master document (.docx, .sec, or .txt). Max 10 MB.
      responses:
        '202':
          description: Onboarding job accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [jobId]
                        properties:
                          jobId:
                            type: string
                            format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{id}/conventions:
    get:
      operationId: getLibraryConvention
      summary: Get a library's convention profile (or inherited built-in)
      description: >
        Returns the library's own convention profile, or the inherited built-in
        industry default when the library has no profile of its own. The
        `meta.inherited` flag is `true` when the returned profile is the
        fallback built-in (`data.libraryId` is then `null`).
      tags: [conventions]
      parameters:
        - $ref: '#/components/parameters/ConventionLibraryId'
      responses:
        '200':
          description: Resolved convention profile with fallback flag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        $ref: '#/components/schemas/EditingConvention'
                      meta:
                        type: object
                        required: [inherited]
                        properties:
                          inherited:
                            type: boolean
                            description: True when the profile is the inherited built-in default
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: putLibraryConvention
      summary: Create or replace a library's convention profile
      description: >
        Upserts the library's convention profile. Rules are shape-validated
        (malformed rules → 400). User-supplied `noteBanners` regexes are bounded
        for length and ReDoS safety at the write boundary (unsafe pattern → 422).
        Unknown rule keys round-trip unchanged (open schema).
      tags: [conventions]
      parameters:
        - $ref: '#/components/parameters/ConventionLibraryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutConventionBody'
      responses:
        '200':
          description: Convention profile created or replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/EditingConvention'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unsafe or oversized `noteBanners` regex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{id}/conventions/clone:
    post:
      operationId: cloneLibraryConvention
      summary: Clone a convention profile into a library
      description: >
        Clones a source profile (a built-in or another library's profile,
        identified by `sourceId`) into the target library, creating or replacing
        the target library's own profile.
      tags: [conventions]
      parameters:
        - $ref: '#/components/parameters/ConventionLibraryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneConventionBody'
      responses:
        '201':
          description: Convention profile cloned into the library
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/EditingConvention'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unsafe or oversized `noteBanners` regex in the source profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /disciplines:
    get:
      operationId: listDisciplines
      summary: List disciplines with their resolved section mapping
      description: >
        Returns the discipline catalog, each discipline with its CSI division
        rules resolved for an optional `libraryId` (ADR-065). With no `libraryId`,
        or when the library has no rules of its own, the built-in default mapping
        is returned and `meta.inherited` is `true`. Unmapped disciplines carry an
        empty `rules` array.
      tags: [disciplines]
      parameters:
        - name: libraryId
          in: query
          required: false
          description: Resolve the mapping for this library (falls back to the built-in default).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resolved discipline catalog with fallback flag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResolvedDiscipline'
                      meta:
                        type: object
                        required: [inherited]
                        properties:
                          inherited:
                            type: boolean
                            description: True when the built-in default backs the result
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{id}/disciplines:
    put:
      operationId: putLibraryDisciplines
      summary: Replace a library's discipline rule set
      description: >
        Replaces the library's discipline rule set wholesale (ADR-065). Each rule
        maps an inclusive CSI division range to a discipline `key` from
        GET /disciplines; ranges must not overlap. A malformed body → 400, an
        unknown discipline key → 422. The library then owns its mapping
        (`meta.inherited: false`). Clear the override with DELETE.
      tags: [disciplines]
      parameters:
        - name: id
          in: path
          required: true
          description: Library UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDisciplinesBody'
      responses:
        '200':
          description: Discipline rule set replaced; resolved catalog returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResolvedDiscipline'
                      meta:
                        type: object
                        required: [inherited]
                        properties:
                          inherited:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unknown discipline key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: clearLibraryDisciplines
      summary: Clear a library's discipline override
      description: >
        Removes the library's own discipline rules, reverting it to the built-in
        default (ADR-065). Idempotent: `data.cleared` is `true` when an override
        was removed, `false` when the library already had none.
      tags: [disciplines]
      parameters:
        - name: id
          in: path
          required: true
          description: Library UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Override cleared (or already absent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [cleared]
                        properties:
                          cleared:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

