                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [specId, section, position, source]
                        properties:
                          specId:
                            type: string
                            format: uuid
                            description: The project-owned clone's id (not the master's)
                          section:
                            type: string
                          position:
                            type: integer
                            description: 1-based TOC position assigned to the section
                          source:
                            type: object
                            required: [libraryId, name]
                            properties:
                              libraryId:
                                type: string
                                format: uuid
                              name:
                                type: string
                          shadowed:
                            type: array
                            description: Lower-priority sources that also hold this section
                            items:
                              type: object
                              required: [libraryId, name]
                              properties:
                                libraryId:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Section already in project'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Malformed section number, or no source library holds the section'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/specs/{specId}:
    delete:
      operationId: removeSectionFromProject
      summary: Remove a project-owned section copy (blocked if edited, unless force)
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: specId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Delete the copy even if it has project edits (content_version > 1)
      responses:
        '200':
          description: Section copy removed (dangling cross-references marked broken)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [projectId, specId]
                        properties:
                          projectId:
                            type: string
                            format: uuid
                          specId:
                            type: string
                            format: uuid
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Section has project edits (repeat with ?force=true) or belongs to a design package'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/specs/{specId}/references:
    get:
      operationId: getOutboundReferences
      summary: List cross-references emitted by a project spec
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: specId
          in: path
