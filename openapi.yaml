    get:
      operationId: getPackageReadinessReport
      summary: Issuance-readiness dry-run across a design package (ADR-079)
      description: >
        Aggregates the ADR-079 issuance-readiness findings (#406) across
        every member spec of the package, each stamped with the spec section
