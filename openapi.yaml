        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ─── Version history: checkpoints & pending summaries (#380, ADR-052) ────────

  /specs/{id}/checkpoints:
    post:
      operationId: createSpecCheckpoint
      summary: Seal a spec at its current content_version (checkpoint)
      description: >
        Stores a named marker (the Word "accept changes" moment, ADR-052
        D3/D4) sealing this spec at its current content_version. Everything
        recorded after the latest checkpoint reads as pending until the next
        one. `actorLabel` is REQUIRED — checkpoints.user_id is NOT NULL, so
        (unlike an ordinary paragraph write) there is no system-actor
        fallback.
      tags: [checkpoints]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, actorLabel]
              properties:
                name:
                  type: string
                  minLength: 1
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '201':
          description: Checkpoint sealed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Checkpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      operationId: listSpecCheckpoints
      summary: List checkpoints sealed directly against this spec
      description: >
        Checkpoints created directly against this spec, most recent first.
        Does NOT include project-scoped checkpoints that also covered it —
        see `sealedByCheckpointId` on the pending-summary and coalesced
        history reads for "which checkpoint (spec- or project-scoped) most
        recently sealed this spec".
      tags: [checkpoints]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Spec-scoped checkpoints, most recent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Checkpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/checkpoints:
    post:
      operationId: createProjectCheckpoint
      summary: Seal every spec in a project at its current content_version (checkpoint)
      description: >
        Same sealing semantics as `POST /specs/{id}/checkpoints`, scoped to
        every spec directly owned by this project (ADR-015 branch
        membership, `specs.project_id` — never the `project_specs`
        package/TOC curation join). One row seals all in-scope specs at once.
      tags: [checkpoints]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, actorLabel]
              properties:
                name:
                  type: string
                  minLength: 1
                actorLabel:
                  $ref: '#/components/schemas/ActorLabel'
      responses:
        '201':
          description: Checkpoint sealed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Checkpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      operationId: listProjectCheckpoints
      summary: List checkpoints sealed directly against this project
      tags: [checkpoints]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project-scoped checkpoints, most recent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Checkpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /checkpoints/{id}:
    get:
      operationId: getCheckpoint
      summary: Retrieve a single checkpoint
      tags: [checkpoints]
      parameters:
        - $ref: '#/components/parameters/CheckpointId'
      responses:
        '200':
          description: The checkpoint
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Checkpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /specs/{id}/pending-summary:
    get:
      operationId: getSpecPendingSummary
      summary: Everything a spec has accumulated since its last checkpoint
      description: >
        Counts DISTINCT pending paragraphs (never raw op count) — a paragraph
        edited five times since the checkpoint is one pending change — and
        rolls them up by the actor of each paragraph's LATEST pending edit
        (ADR-052 D9). A spec never checkpointed reports its whole recorded
        history as pending.
      tags: [checkpoints]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Spec pending-change summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/SpecPendingSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/pending-summary:
    get:
      operationId: getProjectPendingSummary
      summary: Everything every spec in a project has accumulated since its own last checkpoint
      description: >
        Aggregates `SpecPendingSummary` across every spec directly owned by
        this project (ADR-015 branch membership) — each spec measured against
        ITS OWN last checkpoint, never a single project-wide cutoff.
        `packageId` is echoed back for the caller's own issuance-deadline
        framing (ADR-052 D9) and never scopes the query.
      tags: [checkpoints]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: packageId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project pending-change summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ProjectPendingSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ─── Numbering profiles (#299) ───────────────────────────────────────────────

  /libraries/{id}/numbering-profiles:
    get:
      operationId: listNumberingProfiles
      summary: List numbering profiles for a library
      description: >
        Returns the library's own profiles plus the singleton built-in CSI
        Default (library_id IS NULL). Library rows appear first (ordered by
        created_at); the built-in is last.
      tags: [numbering-profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Library UUID
      responses:
        '200':
          description: Numbering profiles (library-owned + CSI Default)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NumberingProfileRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createNumberingProfile
      summary: Create a numbering profile for a library
      description: >
        Creates a new named numbering profile owned by the library. The `rules`
        object carries the NumberingProfile shape (tiers, numbering, styleLadder,
        articleIlvl). Library must exist (missing → 404). Each entry's `tier` is
        optional — the server derives it from ilvl + articleIlvl and rejects
        (422) a declared value that disagrees; articleIlvl is required once
        numbering or styleLadder is non-empty (ADR-067).
      tags: [numbering-profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Library UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, rules]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Display name for the profile.
                rules:
                  $ref: '#/components/schemas/NumberingProfile'
      responses:
        '201':
          description: Numbering profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NumberingProfileRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /numbering-profiles/snapshot:
    post:
      operationId: snapshotNumberingProfile
      summary: Extract a numbering profile from a DOCX upload
      description: >
        Upload a `.docx` file and receive back its extracted `NumberingProfile`
        (tiers, numbering, styleLadder, articleIlvl) without persisting anything.
        Useful for previewing what profile would be inferred from a source-of-truth
        DOCX before creating a permanent profile row.


        Rate-limited per IP (default 10 requests/minute, shared with `POST /parse`; configurable, disable with `DISABLE_RATE_LIMIT`).
      tags: [numbering-profiles]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Source `.docx` file. Max 10 MB.
      responses:
        '200':
          description: Extracted numbering profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NumberingProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /numbering-profiles/{id}:
    get:
      operationId: getNumberingProfile
      summary: Get a numbering profile by ID
      tags: [numbering-profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Numbering profile UUID
      responses:
        '200':
          description: Numbering profile row
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NumberingProfileRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: patchNumberingProfile
      summary: Update a numbering profile (name and/or rules)
      description: >
        Partial update: omit a field to leave it unchanged. At least one of
        `name` or `rules` is required — an empty body is rejected (422).
        When `rules` is supplied, each entry's `tier` is optional —
        the server derives it from ilvl + articleIlvl and rejects (422) a
        declared value that disagrees; articleIlvl is required once numbering
        or styleLadder is non-empty (ADR-067). The built-in CSI Default
        (`libraryId: null`) is protected and cannot be modified (→ 409) — it
        is the fallback for every unassigned spec.
      tags: [numbering-profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Numbering profile UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                rules:
                  $ref: '#/components/schemas/NumberingProfile'
      responses:
        '200':
          description: Updated numbering profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/NumberingProfileRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteNumberingProfile
      summary: Delete a numbering profile
      description: >
        Permanently deletes a library-owned profile. The built-in CSI Default
        (`libraryId: null`) is protected and cannot be deleted (→ 409). A
        profile assigned to any spec cannot be deleted (→ 409).
      tags: [numbering-profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Numbering profile UUID
      responses:
        '204':
          description: Profile deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/numbering-profile:
    put:
      operationId: setSpecNumberingProfile
      summary: Assign a numbering profile to a spec
      description: >
        Associates an existing numbering profile with the spec so the parser
        uses it as a deterministic numbering override (#299). One profile per
        spec; re-assigning replaces the previous one. Both the spec and the
        profile must exist (either missing → 404, pre-checked; a profile
        concurrently deleted during assignment is also reported as 404, not a
        scope conflict, #366). Library scoping: the profile must be the built-in
        CSI Default or owned by the spec's own library; a profile from another
        library is rejected with 409.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId:
                  type: string
                  format: uuid
                  description: Numbering profile to assign to the spec.
      responses:
        '200':
          description: Numbering profile assigned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [profileId, name]
                        properties:
                          profileId:
                            type: string
                            format: uuid
                          name:
                            type: string
                            description: Display name of the assigned profile.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: clearSpecNumberingProfile
      summary: Clear a spec's numbering profile
      description: >
        Removes the spec→profile association, so the spec falls back to the built-in
        CSI Default when its structure is resolved. The spec must exist (missing → 404).
        Idempotent when no profile is currently assigned — the UPDATE still returns
        rowCount=1 if the spec exists.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '204':
          description: Numbering profile cleared
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Standards registry (#446, ADR-064) ──────────────────────────────────────
  /libraries/{id}/standards:
    get:
      operationId: getLibraryStandards
      summary: Library standards rollup (distinct cited standards + registry verdict)
      tags: [libraries]
      parameters:
        - name: id
          in: path
          required: true
          description: Library UUID
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Standards rollup for the library
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/StandardsRollup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/standards:
    get:
      operationId: getProjectStandards
      summary: Project standards rollup (distinct cited standards + registry verdict)
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Standards rollup for the project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/StandardsRollup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /standards/{orgCode}/{standardCode}:
    put:
      operationId: recordStandardVerification
      summary: Record a standards verification verdict (upsert; server stamps last verified)
      description: >
        Upserts the registry record for one standard, keyed on (orgCode,
        standardCode). PUT-replace (ADR-064 §3): the body fully describes the
        verdict — omitted optional fields reset to null, status defaults to
        'unknown' — and the server stamps last_verified_at = now() on every write.
        orgCode is normalized to uppercase; standardCode is stored verbatim and
        must be percent-encoded in the path when it contains reserved characters
        (e.g. a slash in A653/A653M).
      tags: [standards]
      parameters:
        - name: orgCode
          in: path
          required: true
          description: Standards organization code (e.g. ASTM); normalized to uppercase.
          schema: { type: string, minLength: 1 }
        - name: standardCode
          in: path
          required: true
          description: Standard identifier within the org (e.g. C150). Percent-encode reserved chars.
          schema: { type: string, minLength: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StandardVerificationBody' }
      responses:
        '200':
          description: The upserted registry record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/StandardRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /libraries/{id}/header-footer:
    get:
      operationId: getLibraryHeaderFooter
      summary: Get a client library's header/footer config
      description: >
        Reads the client library's own header/footer config (ADR-040). This is
        the top of the client -> project -> package -> revision precedence
        chain read by the resolve endpoints below; it is never itself
        inherited from anywhere.
      tags: [header-footer]
      parameters:
        - name: id
          in: path
          required: true
          description: Client library UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The library's header/footer config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/HeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      operationId: putLibraryHeaderFooter
      summary: Create or replace a client library's header/footer config
      description: >
        Upsert (ADR-040). The body is the full `HeaderFooterComposition` —
        v1 (#208) `header`/`footer`/`style` fields, or v2 (#302)
        `variants`/`pageNumbering`/`raw` — validated and stored verbatim,
        including any unrecognized top-level extension keys.
      tags: [header-footer]
      parameters:
        - name: id
          in: path
          required: true
          description: Client library UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeaderFooterComposition'
      responses:
        '200':
          description: Config created or replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/HeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Library not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteLibraryHeaderFooter
      summary: Delete a client library's header/footer config
      tags: [header-footer]
      parameters:
        - name: id
          in: path
          required: true
          description: Client library UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Config deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [libraryId]
                        properties:
                          libraryId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Library not found, or the library has no header/footer config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/header-footer:
    get:
      operationId: getProjectHeaderFooter
      summary: Get a project's own header/footer config override
      description: >
        Reads only the project's own override row — not the effective
        (inherited) config. Use `GET /projects/{id}/header-footer/resolved`
        for the merged client -> project result (ADR-040).
      tags: [header-footer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project's header/footer config override
          content:
