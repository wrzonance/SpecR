  /projects/{id}/keynotes:
    get:
      operationId: getProjectKeynotes
      summary: Project keynote table export (tab-delimited, Revit format)
      description: >
        Exports the project's valid keynotes as the flat, tab-delimited text table
        BIM authoring tools consume (ADR-016 D3). Deterministic — a pure rendering
        of the project-filtered keynote query: a master keynote qualifies when its
        source library feeds the project and its target section is present in the
        project TOC (ADR-016 D2). Each row is `code<TAB>description` for a top-level
        keynote, or `code<TAB>description<TAB>parentCode` when it has a parent, so
        the keynote hierarchy is preserved. Rows are ordered by code; a code carried
        by two source libraries resolves to the higher-priority one. A project with
        no valid keynotes returns an empty body (200). Unknown project → 404.
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tab-delimited keynote table
          content:
            text/plain:
              schema:
                type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/revit-links:
    get:
      operationId: getProjectRevitLinks
      summary: Project Revit link inventory — element↔spec mapping read model
      description: >
        Read-only inventory (#103) over revit_parameter_mappings joined through
        paragraphs to project specs. Returns two pivots — byElement
        (element→sections) and bySpec (section→elements) — plus summary counts,
        including specsWithoutModelBacking. Optional revitInstanceId or specId
        query params narrow the two pivots; the summary is always project-wide.
        Note: unmappedElements is 0 under the current mappings-only substrate —
        model-placed-but-unmapped elements are unobservable without a model-element
        registry (ADR-029); the field is kept for forward contract stability.
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: revitInstanceId
          in: query
          required: false
          description: Filter the pivots to one Revit element instance id.
          schema: { type: string, minLength: 1 }
        - name: specId
          in: query
          required: false
          description: Filter the pivots to one project spec.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Revit link inventory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/RevitLinkInventory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /reports/compare:
    post:
      operationId: postCompareReport
      summary: Cross-spec comparison matrix — align two live or frozen sources by origin or structure, with summary, differences filter, and optional baseline lens
      description: >
        Grounded, deterministic cross-spec comparison (ADR-047/053, extended by #392/
        ADR-078). Aligns exactly two sources and returns a symmetric matrix: one row
        per aligned paragraph, one column per source, each cell the source's verbatim
        text or absent. Every present cell traces to a real specId + paragraph UUID;
        nothing is synthesized. Each entry in `sources` is either a live spec UUID
        (project or master) or a frozen `{revisionId, specId}` object naming the
        frozen tree of that spec within one issued package revision (see
        CompareSource) — e.g. a live spec against a past issuance of itself, or two
        past issuances of the same package against each other. Alignment is by
        resolved paragraph origin for clones of a shared master (project↔project,
        project↔master with behindBy drift) or by canonical structural address for
        independently-ingested specs of the same section — selected via `alignment`
        (default `auto`) and echoed as `alignedBy`. `include: differences` returns only
        non-identical rows; a `summary` rollup is always emitted over the full matrix.
        Optionally designate one source's underlying specId as `baseline` to reframe
        cells as added/removed/modified/unchanged; a `baseline` matching zero or more
        than one source (e.g. the same spec frozen at two different revisions) is
        rejected as ambiguous (422) rather than silently resolved. `drift` (version
        drift from the lineage chain) is reported only for live columns — a frozen
        column has no lineage of its own to walk, so it is omitted there, never faked.
        A source id that does not resolve — an unknown live spec UUID, or a frozen
        `(revisionId, specId)` pair that does not exist — returns 404.
      tags: [reports]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompareRequest' }
      responses:
        '200':
          description: Comparison report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ComparisonReport' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/submittal-register:
    post:
      operationId: postSubmittalRegister
      summary: Product-driven submittal register for selected project specs
      description: >
        Builds a PM-facing register from selected project specs. Rows are driven by
        PART 2 - PRODUCTS product candidates; required submittal types come from
        each spec's PART 1 Submittals article; datasheet evidence comes from
        paragraph associations.
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmittalRegisterBody' }
      responses:
        '200':
          description: Product-driven submittal register
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/SubmittalRegister' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /specs/{id}/open-comments:
    get:
      operationId: getSpecOpenComments
      summary: Open (unclosed) Word comments in a spec
      description: >
        Lists the review comments in the spec that are NOT resolved (#256 C1) — the
        direct answer to "have all comments been closed?". A comment is closed when
        its runs are struck through OR its text ends in "Closed" (case/whitespace
        tolerant); everything else is reported here. A comment spanning N paragraphs
        surfaces once per covered paragraph.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Open-comments report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/OpenCommentsReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/open-comments:
    get:
      operationId: getProjectOpenComments
      summary: Open (unclosed) Word comments across a project
      description: >
        Aggregates the unresolved review comments across every spec in the project,
        sorted by section (#256 C1). A comment is closed when its runs are struck
        through OR its text ends in "Closed"; everything else is reported here.
      tags: [projects]
