    # ── Language-lint rule profiles (#411 / ADR-080) ──────────────────────────
    # SpecR ships the schema and matching engine, never rule content — every
    # category is optional and starts empty until a firm authors it.

    LanguageRuleTerm:
      type: object
      additionalProperties: false
      required: [term]
      properties:
        term:
          type: string
          minLength: 1
          description: >
            For a literal term (isRegex omitted or false), #541's
            LanguageRulesWriteSchema bounds this to 500 characters — but ONLY
            at the PUT write boundary (see PutLanguageRulesBody's own rules
            override). This shared read/response schema is deliberately
            unbounded: mapRow's GET read path stays on the unbounded
            LanguageRulesSchema so a pre-existing (or directly-inserted) row
            longer than 500 characters keeps reading successfully —
            grandfathered, never rejected by GET's own response contract.
        isRegex:
          type: boolean
          description: Interpret `term` as a regex pattern; a literal term is boundary-matched instead.
        suggestion:
          type: string
          description: Optional replacement text shown alongside a finding.
    LanguageRules:
      type: object
      additionalProperties: false
      description: >
        Read/response shape — deliberately unbounded (see LanguageRuleTerm).
        #541's combined 500-literal-term cap across bannedTerms/
        reinforcingWords/partyVocabulary/requiredPhrases is enforced only at
        the PUT write boundary (LanguageRulesWriteSchema); a grandfathered
        profile already over that cap must still GET successfully against
        this schema.
      properties:
        bannedTerms:
          type: array
          items: { $ref: '#/components/schemas/LanguageRuleTerm' }
        reinforcingWords:
          type: array
          items: { $ref: '#/components/schemas/LanguageRuleTerm' }
        partyVocabulary:
          type: array
          items: { $ref: '#/components/schemas/LanguageRuleTerm' }
        requiredPhrases:
          type: array
          items: { $ref: '#/components/schemas/LanguageRuleTerm' }
    LanguageRuleTermWrite:
      allOf:
        - $ref: '#/components/schemas/LanguageRuleTerm'
        - type: object
          properties:
            term:
              maxLength: 500
              description: >
                Write-boundary bound (#541, LanguageRulesWriteSchema): a PUT
                literal term (isRegex omitted or false) exceeding 500 Unicode
                code points is rejected 422. Pre-existing rows longer than
                this are grandfathered — see LanguageRuleTerm, the shape used
                by GET responses, which carries no such bound.
    LanguageRulesWrite:
      allOf:
        - $ref: '#/components/schemas/LanguageRules'
        - type: object
          description: >
            PUT request shape only — mirrors LanguageRulesWriteSchema (#541)
            plus checkRegexPatterns (ADR-080 D6). Two INDEPENDENT write-time
            caps apply, and neither is per-field: 500 LITERAL (isRegex
            omitted or false) terms COMBINED across
            bannedTerms/reinforcingWords/partyVocabulary/requiredPhrases, and
            64 `isRegex: true` patterns COMBINED across those same 4
            categories. The caps are never summed against each other — one
            array may legitimately hold 500 literal terms AND 64 regex terms
            at once, which is why each array's maxItems below is 564
            (500 + 64), a COARSE ceiling rather than a restatement of either
            cap. Consequently a PUT can be well within every field's own
            maxItems and still be rejected 422 once the 4 categories' literal
            terms sum past 500 or their regex terms sum past 64. GET
            responses are never validated against this shape — see
            LanguageRules, which carries no such bound, so a grandfathered
            over-cap profile still reads successfully.
          properties:
            bannedTerms:
              type: array
              maxItems: 564
              description: >
                maxItems here is a COARSE per-array ceiling, NOT a cap this
                field owns: 564 = the 500 combined literal-term cap
                (MAX_LITERAL_TERMS) plus the 64 combined regex-pattern cap
                (MAX_REGEX_PATTERNS), because one array may legitimately hold
                both at once. Neither sub-cap is independent of the other 3
                literal-term fields: bannedTerms/reinforcingWords/
                partyVocabulary/requiredPhrases share ONE combined write-time
                cap of 500 literal (isRegex omitted or false) terms total
                (#541, LanguageRulesWriteSchema) AND ONE combined cap of 64
                `isRegex: true` patterns total (ADR-080 D6,
                checkRegexPatterns). A PUT can be within this field's own
                maxItems and still be rejected 422 if the 4 categories'
                literal terms sum past 500 or their regex terms sum past 64 —
                do not generate per-field validation that treats 564, 500, or
                64 as available on its own.
              items: { $ref: '#/components/schemas/LanguageRuleTermWrite' }
            reinforcingWords:
              type: array
              maxItems: 564
              description: >
                maxItems here is a COARSE per-array ceiling, NOT a cap this
                field owns: 564 = the 500 combined literal-term cap
                (MAX_LITERAL_TERMS) plus the 64 combined regex-pattern cap
                (MAX_REGEX_PATTERNS), because one array may legitimately hold
                both at once. Neither sub-cap is independent of the other 3
                literal-term fields: bannedTerms/reinforcingWords/
                partyVocabulary/requiredPhrases share ONE combined write-time
                cap of 500 literal (isRegex omitted or false) terms total
                (#541, LanguageRulesWriteSchema) AND ONE combined cap of 64
                `isRegex: true` patterns total (ADR-080 D6,
                checkRegexPatterns). A PUT can be within this field's own
                maxItems and still be rejected 422 if the 4 categories'
                literal terms sum past 500 or their regex terms sum past 64 —
                do not generate per-field validation that treats 564, 500, or
                64 as available on its own.
              items: { $ref: '#/components/schemas/LanguageRuleTermWrite' }
            partyVocabulary:
              type: array
              maxItems: 564
              description: >
                maxItems here is a COARSE per-array ceiling, NOT a cap this
                field owns: 564 = the 500 combined literal-term cap
                (MAX_LITERAL_TERMS) plus the 64 combined regex-pattern cap
                (MAX_REGEX_PATTERNS), because one array may legitimately hold
                both at once. Neither sub-cap is independent of the other 3
                literal-term fields: bannedTerms/reinforcingWords/
                partyVocabulary/requiredPhrases share ONE combined write-time
                cap of 500 literal (isRegex omitted or false) terms total
                (#541, LanguageRulesWriteSchema) AND ONE combined cap of 64
                `isRegex: true` patterns total (ADR-080 D6,
                checkRegexPatterns). A PUT can be within this field's own
                maxItems and still be rejected 422 if the 4 categories'
                literal terms sum past 500 or their regex terms sum past 64 —
                do not generate per-field validation that treats 564, 500, or
                64 as available on its own.
              items: { $ref: '#/components/schemas/LanguageRuleTermWrite' }
            requiredPhrases:
              type: array
              maxItems: 564
              description: >
                maxItems here is a COARSE per-array ceiling, NOT a cap this
                field owns: 564 = the 500 combined literal-term cap
                (MAX_LITERAL_TERMS) plus the 64 combined regex-pattern cap
                (MAX_REGEX_PATTERNS), because one array may legitimately hold
                both at once. Neither sub-cap is independent of the other 3
                literal-term fields: bannedTerms/reinforcingWords/
                partyVocabulary/requiredPhrases share ONE combined write-time
                cap of 500 literal (isRegex omitted or false) terms total
                (#541, LanguageRulesWriteSchema) AND ONE combined cap of 64
                `isRegex: true` patterns total (ADR-080 D6,
                checkRegexPatterns). A PUT can be within this field's own
                maxItems and still be rejected 422 if the 4 categories'
                literal terms sum past 500 or their regex terms sum past 64 —
                do not generate per-field validation that treats 564, 500, or
                64 as available on its own.
              items: { $ref: '#/components/schemas/LanguageRuleTermWrite' }
    LanguageRuleProfile:
      type: object
      required: [id, scope, ownerId, rules, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope:
          type: string
          enum: [library, project]
        ownerId:
          type: string
          format: uuid
          description: The library or project id that owns this profile
        rules: { $ref: '#/components/schemas/LanguageRules' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PutLanguageRulesBody:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules: { $ref: '#/components/schemas/LanguageRulesWrite' }

    # ── Revision nomenclature profiles (ADR-025 / #209) ───────────────────────

    RevisionNomenclatureType:
      type: object
