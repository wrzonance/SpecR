  /projects/{id}/generate:
    post:
      operationId: generateManual
      summary: Assemble a project manual DOCX from all TOC sections
      description: >
        Renders every section in the project's TOC (MasterFormat / position order)
        into a single DOCX manual (ADR-017 D1). Each section is its own OOXML
        section with an independent numbering instance, so multilevel numbering
        restarts at PART 1 per section. Every paragraph keeps its `w:sdt` UUID
        anchor for round-trip. The manual opens with a cover page (project name +
        description, style-template applied) and a Word TOC field over the section
        headings — Word computes the TOC entries and pagination on open; SpecR emits
        the field, not page numbers; the cover page itself stays headerless (no
        header/footer reference in its `sectPr`). This route renders the live draft
        from `project_specs`; issued and addendum manuals render from frozen package
        revisions via `POST /revisions/{id}/generate`. Header/footer content is
        resolved and rendered per #481: the project's client → project
        `header_footer_configs` chain is resolved once (this route is project-scoped
        and never consults package- or revision-level layers — use
        `POST /revisions/{id}/generate` for those) and the result is rendered into
        every TOC section's own OOXML section (never just the manual's first page),
        so a `first`/title-page variant applies to each section's own opening page.
        A project with zero configured layers falls back to the pre-#481 output
        unchanged.
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  format: uuid
                  description: >
                    Style template applied to every section. Omitted → the seeded
                    UFGS-Default template; absent default → unstyled 200. Unknown id → 404.
                sectionNumberFormat:
                  type: string
                  enum: [canonical, dots, compact, spaced-compact]
                  description: >
                    Presentation format for generated section numbers in each
                    section title and confidently identified Section references.
                    Omitted → project override, then client/firm default, then
                    canonical.
                mode:
                  $ref: '#/components/schemas/IssuanceMode'
                overrideReadinessGate:
                  type: boolean
                  description: >
                    Unaudited escape hatch (ADR-079 decision 8, #406) — renders
                    despite outstanding findings. Ignored unless mode is final.
      responses:
        '200':
          description: DOCX manual file stream
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >
            Project has no sections to assemble, or `mode: 'final'` is blocked
            by the ADR-079 (#406) issuance-readiness gate — one or more of the
            assembled TOC sections has an outstanding ReadinessFinding,
            returned inline as `findings` across all TOC sections combined.
            There is no project-scoped readiness report; use
            `GET /specs/{id}/readiness-report` per section to see which
            section each finding came from. Pass
            `overrideReadinessGate: true` to generate anyway.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      findings:
                        type: array
                        items: { $ref: '#/components/schemas/ReadinessFinding' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{libraryId}/divisions/{division}/general-spec:
    get:
      operationId: getLibraryDivisionGeneralSpec
      summary: Get division general-spec status for a library
      description: >
        Returns the confirmed division-general spec when one exists. Only an exact
        `NN 00 00` section is assigned automatically. If no exact section exists,
        the response is `status: missing` and fallback matches are returned as
        advisory candidates only.
      tags: [libraries]
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Division'
      responses:
        '200':
          description: Division general-spec status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DivisionGeneralSpecResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: setLibraryDivisionGeneralSpec
      summary: Manually set a library division general spec
      description: >
        Assigns a same-library spec in the requested division as the division
        general spec, or records that this division has no in-scope general
        requirements spec.
      tags: [libraries]
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Division'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDivisionGeneralSpecBody'
      responses:
        '200':
          description: Manual division-general decision stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DivisionGeneralSpecResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /conventions:
    get:
      operationId: listConventions
      summary: List built-in editing-convention profiles
      description: >
