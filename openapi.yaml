                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [packageId]
                        properties:
                          packageId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /revisions/{id}/header-footer:
    get:
      operationId: getRevisionHeaderFooter
      summary: Get an issued revision's own header/footer config override
      description: >
        Reads only the revision's own override row. Use
        `GET /revisions/{id}/header-footer/resolved` for the merged
        client -> project -> package -> revision result (ADR-040).
      tags: [header-footer]
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: The revision's header/footer config override
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/HeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      operationId: putRevisionHeaderFooter
      summary: Create or replace an issued revision's header/footer config override
      description: >
        Upsert (ADR-040). The body is the full `HeaderFooterComposition`; see
        `PUT /libraries/{id}/header-footer` for the shape contract.
      tags: [header-footer]
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeaderFooterComposition'
      responses:
        '200':
          description: Config created or replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/HeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteRevisionHeaderFooter
      summary: Delete an issued revision's header/footer config override
      tags: [header-footer]
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Override deleted; resolved reads fall back to the parent scope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [revisionId]
                        properties:
                          revisionId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/header-footer/resolved:
    get:
      operationId: resolveProjectHeaderFooter
      summary: Read the effective (merged) header/footer config for a project
      description: >
        Merges every contributing config row anchored above and at this
        project — client library, then the project itself — in that
        precedence order (later layers win per-key, ADR-040). `layers` lists
        every contributing row low-to-high precedence; the winning scope for
        any given key is `layers[layers.length - 1].scope`, whichever layer
        last touched it — no separate winning-scope field is synthesized.
      tags: [header-footer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Resolved header/footer config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ResolvedHeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /packages/{id}/header-footer/resolved:
    get:
      operationId: resolvePackageHeaderFooter
      summary: Read the effective (merged) header/footer config for a design package
      description: >
        Merges every contributing config row anchored above and at this
        package — client library, project, then the package itself — in
        that precedence order (ADR-040). See
        `GET /projects/{id}/header-footer/resolved` for the layers/provenance
        contract.
      tags: [header-footer]
      parameters:
        - $ref: '#/components/parameters/PackageId'
      responses:
        '200':
          description: Resolved header/footer config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ResolvedHeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /revisions/{id}/header-footer/resolved:
    get:
      operationId: resolveRevisionHeaderFooter
      summary: Read the effective (merged) header/footer config for an issued revision
      description: >
        Merges every contributing config row anchored above and at this
        revision — client library, project, package, then the revision
        itself — in that precedence order (ADR-040). See
        `GET /projects/{id}/header-footer/resolved` for the layers/provenance
        contract.
      tags: [header-footer]
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Resolved header/footer config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ResolvedHeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /libraries/{id}/language-rules:
    get:
      operationId: getLibraryLanguageRules
      summary: Get a library's language-lint rule profile
      description: >
        Returns the library's own language-lint rule profile (ADR-080):
        banned terms, reinforcing words to avoid, recognized party
        vocabulary, and required phrases. Linting is opt-in — SpecR ships no
        default content, so a library with nothing configured returns 404,
        never a fallback profile.
      tags: [language-rules]
      parameters:
        - $ref: '#/components/parameters/ConventionLibraryId'
      responses:
        '200':
          description: The library's language-rule profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/LanguageRuleProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      operationId: putLibraryLanguageRules
      summary: Create or replace a library's language-lint rule profile
      description: >
        Upsert (ADR-080) — one profile per library. Malformed rules shape is
        rejected with 400. Two further write-boundary bounds are rejected with
        422: an unsafe or oversized `isRegex: true` term pattern (ADR-080 D6),
        and — since #541 — a literal (isRegex omitted or false) term longer
        than 500 characters or a profile carrying more than 500 literal terms
        combined across bannedTerms/reinforcingWords/partyVocabulary/
        requiredPhrases. Pre-existing profiles already exceeding the literal
        bounds are grandfathered: the bounds gate writes only, so GET keeps
        returning such a profile unchanged.
      tags: [language-rules]
      parameters:
        - $ref: '#/components/parameters/ConventionLibraryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutLanguageRulesBody'
      responses:
        '200':
          description: Language-rule profile created or replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/LanguageRuleProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >
            Write-boundary bound violated — an unsafe or oversized `isRegex`
            term pattern, or (#541) a literal term over 500 characters or
            more than 500 literal terms combined across the 4 categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteLibraryLanguageRules
      summary: Delete a library's language-lint rule profile
      tags: [language-rules]
      parameters:
        - $ref: '#/components/parameters/ConventionLibraryId'
      responses:
        '200':
          description: Profile deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [libraryId]
                        properties:
                          libraryId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: No language-rule profile configured for this library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/language-rules:
    get:
      operationId: getProjectLanguageRules
      summary: Get a project's language-lint rule profile
      description: >
        Returns the project's own language-lint rule profile (ADR-080). This
        is the project's own profile only, not the merged effective set used
        by GET /projects/{id}/language-findings. Linting is opt-in — a
        project with nothing configured returns 404, never a fallback.
      tags: [language-rules]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project's language-rule profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/LanguageRuleProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      operationId: putProjectLanguageRules
      summary: Create or replace a project's language-lint rule profile
      description: >
        Upsert (ADR-080) — one profile per project. Malformed rules shape is
        rejected with 400. Two further write-boundary bounds are rejected with
        422: an unsafe or oversized `isRegex: true` term pattern (ADR-080 D6),
        and — since #541 — a literal (isRegex omitted or false) term longer
        than 500 characters or a profile carrying more than 500 literal terms
        combined across bannedTerms/reinforcingWords/partyVocabulary/
        requiredPhrases. Pre-existing profiles already exceeding the literal
        bounds are grandfathered: the bounds gate writes only, so GET keeps
        returning such a profile unchanged.
      tags: [language-rules]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutLanguageRulesBody'
      responses:
        '200':
          description: Language-rule profile created or replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/LanguageRuleProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >
            Write-boundary bound violated — an unsafe or oversized `isRegex`
            term pattern, or (#541) a literal term over 500 characters or
            more than 500 literal terms combined across the 4 categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteProjectLanguageRules
      summary: Delete a project's language-lint rule profile
      tags: [language-rules]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Profile deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [projectId]
                        properties:
                          projectId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: No language-rule profile configured for this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /projects/{id}/language-findings:
    get:
      operationId: getLanguageFindings
      summary: Language-lint findings report for a project (or one of its packages)
      description: >
        Scans every present spec in the project (or, with `packageId`, just
        that package) against its resolved language-rule layers — the
        authoring library, the project's client library, and the project's
        own profile, ADR-080 D5 — and reports findings. `configured: false`
        (with an explanatory note, no findings) means linting is off for
        every present spec; that is a normal opt-in state, never a 404/500.
      tags: [language-rules]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: packageId
          in: query
          required: false
          description: Scope the report to one design package
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Language-lint findings report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/LanguageFindingsReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

# ─── Components ───────────────────────────────────────────────────────────────

components:
  parameters:
    SpecId:
      name: id
      in: path
      required: true
      description: Spec UUID
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Paragraph (node) UUID
      schema:
        type: string
        format: uuid
    CheckpointId:
      name: id
      in: path
      required: true
      description: Checkpoint UUID
      schema:
        type: string
        format: uuid
    ProjectId:
      name: id
      in: path
      required: true
      description: Project UUID
      schema:
        type: string
        format: uuid
    ClientId:
      name: id
      in: path
      required: true
      description: Client UUID
      schema:
        type: string
        format: uuid
    LibraryId:
      name: libraryId
      in: path
      required: true
      description: Library UUID
      schema:
        type: string
        format: uuid
    PackageId:
      name: id
      in: path
      required: true
      description: Design package UUID
      schema:
        type: string
        format: uuid
    RevisionId:
      name: id
      in: path
      required: true
      description: Package revision UUID
      schema:
        type: string
        format: uuid
    Division:
      name: division
      in: path
      required: true
      description: Two-digit division number
      schema:
        type: string
        pattern: '^\d{2}$'
    TemplateId:
      name: id
      in: path
      required: true
      description: Template UUID
      schema:
        type: string
        format: uuid
    ConventionLibraryId:
      name: id
      in: path
      required: true
      description: Library UUID
      schema:
        type: string
        format: uuid

    AssociationId:
      name: associationId
      in: path
      required: true
      description: Paragraph association UUID
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request — validation error or unsupported file type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden — the resource exists but does not belong to the parent in the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict — a resource with that identity already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WriteConflict:
      description: >
        Write rejected by the concurrency / edit gate (ADR-018): a stale
        `expectedVersion`, an archived spec, or a spec locked upstream. On a
        stale version the current version travels back as `currentVersion`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  currentVersion:
                    type: integer
                    description: Present on a stale-version conflict — the spec's current contentVersion.
    PayloadTooLarge:
      description: >
        Request body too large. The default REST body limit is 100KB; the
        four header/footer composition PUT routes
        (`/libraries|projects|packages|revisions/{id}/header-footer`) are
        dispatched to a larger, route-scoped limit of 7252652 bytes, sized to
        fit one image field at its own maxLength
        (`HEADER_FOOTER_JSON_BODY_LIMIT_BYTES`, derived from
        `MAX_IMAGE_BASE64_LENGTH`) plus headroom for the surrounding
        composition JSON — `{success: false, error: "payload too large"}`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Unprocessable — file parsed but semantically unusable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: >
        Rate limit exceeded (default 10 uploads per IP per minute; configurable) —
        `{success: false, error: "too many requests — please wait before uploading again"}`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── Shared field schemas ───────────────────────────────────────────────────

    ActorLabel:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '[\s\S]*\S[\s\S]*'
      description: >
        Optional caller identity attributed to a paragraph-history write (#377);
        omitted falls back to a system sentinel. Resolves to a users.label and
        shares its contract: trimmed before resolution, whitespace-only rejected,
        and the 1-200 length bounds (Unicode code points) apply to the trimmed
        value.

    # ── Envelope shapes ────────────────────────────────────────────────────────

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

    # ── Full-text search (ADR-062) ─────────────────────────────────────────────

    SearchHit:
      type: object
      description: One ranked paragraph match with stable navigation anchors.
      required: [paragraphId, text, nodeType, specId, specSection, specTitle, snippet, rank]
      properties:
        paragraphId:
          type: string
          format: uuid
          description: Paragraph UUID — the stable anchor for this hit.
        text:
          type: string
          description: Full paragraph text.
        nodeType:
          type: string
          description: >-
            CSI node type (part, article, pr1…pr7, note, continuation, or the
            object/objectText body-object types, #300).
        specId:
          type: string
          format: uuid
          description: UUID of the owning spec.
        specSection:
          type: string
          description: CSI section number of the owning spec, e.g. "07 84 00".
        specTitle:
          type: string
          description: Title of the owning spec.
        snippet:
          type: string
          description: ts_headline excerpt with matched terms wrapped in <mark>…</mark>.
        rank:
          type: number
          description: ts_rank_cd relevance score; 0 on the degenerate substring-fallback path.

    # ── Cross-spec comparison (reports) ────────────────────────────────────────

    CompareSource:
      description: >
        One comparison source (#392, ADR-078). A bare UUID names a LIVE spec
        (project or master) — the original, back-compat shape. An object names
        the FROZEN tree of one spec within one issued package revision: a
        point-in-time `package_revision_specs.tree` snapshot, not the live
        `specs` row. `baseline` resolves against a source's underlying `specId`
        (see `sourceSpecId`), not literal array membership, so a live source and
        a frozen source of the SAME underlying spec are a legal, distinct pair —
        e.g. a live spec compared against one of its own past issuances.
      oneOf:
        - type: string
          format: uuid
          description: A live spec UUID.
        - type: object
          description: A frozen source — the tree of `specId` as issued in `revisionId`.
          required: [revisionId, specId]
          additionalProperties: false
          properties:
            revisionId:
              type: string
              format: uuid
              description: Issued package-revision UUID (see GET /packages/{id}/revisions).
            specId:
              type: string
              format: uuid
              description: The spec's id as of that revision (a package_revision_specs member).

    CompareRequest:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          description: >
            Exactly two distinct sources to compare. Each is either a live spec
            UUID or a frozen `{revisionId, specId}` object (see CompareSource).
            A live source and a frozen source of the same underlying spec are a
            legal, distinct pair; two structurally-identical frozen objects are
            not — both are rejected as non-distinct (422).
          items: { $ref: '#/components/schemas/CompareSource' }
          minItems: 2
          maxItems: 2
        baseline:
          type: string
          format: uuid
          description: >
            Optional — the underlying specId of one of `sources` (resolved via
            each source's `specId`, not literal array membership). Must match
            exactly one source; zero or multiple matches (e.g. the same spec
            frozen at two different revisions) is rejected as ambiguous (422)
            rather than silently resolved to the first match.
        alignment:
          type: string
          enum: [origin, structure, auto]
          default: auto
          description: >
            Row alignment strategy. `origin` keys on resolved paragraph origin
            (clones of a shared master); `structure` keys on the canonical structural
            address (independently-ingested specs of the same section); `auto`
            (default) uses origin when the sources share a cross-source origin key,
            structure when they share none but are the same section, else origin.
            The mode actually used is echoed as `alignedBy`.
        include:
          type: string
          enum: [all, differences]
          default: all
          description: >
            Row scope. `all` (default) returns the full matrix; `differences` returns
            only non-identical rows (modified / present-in-one). `summary` always
            reports full-matrix totals regardless of this filter.

    ComparisonColumn:
      type: object
      required: [specId, section, title]
      properties:
        specId: { type: string, format: uuid }
        section: { type: string }
        title: { type: [string, 'null'] }
        revisionId:
          type: string
          format: uuid
          description: >
            Present iff this column was resolved from a frozen source (#392); a
            live column never carries this (omitted, not null).
        revisionLabel:
          type: string
          description: >
            The frozen revision's raw `package_revisions.label` — not a
            nomenclature-resolved display name. Present iff `revisionId` is
            present.

    ComparisonCell:
      description: A grounded cell — either a source's verbatim paragraph, or an absent sentinel.
      oneOf:
        - type: object
          required: [present, specId, paragraphUuid, text]
          properties:
            present: { type: boolean, enum: [true] }
            specId: { type: string, format: uuid }
            paragraphUuid: { type: string, format: uuid }
            text: { type: string }
        - type: object
          required: [present]
          properties:
            present: { type: boolean, enum: [false] }

    ComparisonMatrixRow:
      type: object
      required: [originId, cells]
      properties:
        originId:
          type: string
          description: >
            Row alignment key. A real paragraph UUID under `origin` alignment; a
            canonical structural-address string under `structure` (see `alignedBy`).
        cells:
          type: array
          description: Index-aligned to `columns`.
          items: { $ref: '#/components/schemas/ComparisonCell' }

    BaselineLensRow:
      type: object
      required: [originId, states]
      properties:
        originId: { type: string }
        states:
          type: array
          description: Index-aligned to `columns`.
          items:
            type: string
            enum: [baseline, unchanged, added, removed, modified, absent]

    BaselineLens:
      type: object
      required: [specId, rows]
      properties:
        specId: { type: string, format: uuid }
        rows:
          type: array
          items: { $ref: '#/components/schemas/BaselineLensRow' }

    DriftEntry:
      type: object
      required: [specId, behindBy]
      properties:
        specId: { type: string, format: uuid }
        behindBy:
          type: integer
          description: Versions this cloned source is behind its master parent (lineage chain).

    ComparisonSummary:
      type: object
      required: [rows, aligned, identical, differing, columns]
      description: Grounded rollup over the full matrix (before any `include` filter).
      properties:
        rows: { type: integer, description: Total aligned rows in the full matrix. }
        aligned: { type: integer, description: Rows present in ≥2 columns. }
        identical: { type: integer, description: Rows present in all columns with identical text. }
        differing: { type: integer, description: Rows that are not identical (rows − identical). }
        columns:
          type: array
          description: Per-column counts, index-aligned to `columns`.
          items:
            type: object
            required: [specId, present, onlyIn]
            properties:
              specId: { type: string, format: uuid }
              present: { type: integer, description: Rows where this column's cell is present. }
              onlyIn: { type: integer, description: Rows present ONLY in this column. }

    ComparisonReport:
      type: object
      required: [columns, rows, summary, alignedBy]
      properties:
        columns:
          type: array
          items: { $ref: '#/components/schemas/ComparisonColumn' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ComparisonMatrixRow' }
        alignedBy:
          type: string
          enum: [origin, structure]
          description: >
            The alignment mode actually used. Under `structure`,
            `ComparisonMatrixRow.originId` is a canonical structural-address string,
            not a paragraph UUID.
        summary:
          $ref: '#/components/schemas/ComparisonSummary'
        baseline:
          $ref: '#/components/schemas/BaselineLens'
        drift:
          type: array
          items: { $ref: '#/components/schemas/DriftEntry' }

    # ── Required Sections ──────────────────────────────────────────────────────

    RequiredSection:
      type: object
      required: [id, section, title, position]
      properties:
        id: { type: string, format: uuid }
        section:
          type: string
          description: Canonical CSI section number (ADR-020 expanded shape).
        title: { type: [string, 'null'] }
        position: { type: integer, minimum: 1 }

    RequiredSectionsBody:
      type: object
      description: >
        Provide either `sections` (explicit list) or `seedFrom` (copy an existing
        baseline/TOC/package) — not both.
      properties:
        sections:
          type: array
          items:
            type: object
            required: [section]
            properties:
              section:
                type: string
                description: Canonical CSI section number.
              title:
                type: string
                minLength: 1
        seedFrom:
          oneOf:
            - type: string
              enum: [baseline, toc]
            - type: object
              required: [packageId]
              properties:
                packageId: { type: string, format: uuid }
      # sections and seedFrom are mutually exclusive (server returns 422 if both
      # are present); neither is allowed too (an empty PUT clears the scope).
      not:
        required: [sections, seedFrom]

    # ── Coordination Report ────────────────────────────────────────────────────

    ReferenceGraph:
      type: object
      description: >
        One-call section-reference graph for a project or library (#447). Edges
        resolve scope-relative: a target section is resolved to the in-scope node
        that owns it, or null (dangling).
      required: [scope, nodes, edges, umbrella, anchorCap, notes]
      properties:
        scope:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [project, library] }
            id: { type: string, format: uuid }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ReferenceGraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/ReferenceGraphEdge' }
        umbrella:
          type: array
          items: { $ref: '#/components/schemas/ReferenceGraphUmbrellaDivision' }
        anchorCap:
          type: integer
          description: Max paragraph anchors emitted per edge when includeAnchors=true.
        notes:
          type: array
          items: { type: string }
    ReferenceGraphNode:
      type: object
      required: [specId, section, title, division, isUmbrella]
      properties:
        specId: { type: string, format: uuid }
        section: { type: string }
        title: { type: string }
        division: { type: [string, 'null'] }
        isUmbrella:
          type: boolean
          description: True when section equals "{division} 00 00".
    ReferenceGraphEdge:
      type: object
      required: [sourceSpecId, targetSection, targetSpecId, citationCount]
      properties:
        sourceSpecId: { type: string, format: uuid }
        targetSection: { type: string }
        targetSpecId:
          type: [string, 'null']
          format: uuid
          description: In-scope spec that owns targetSection, or null when dangling.
        citationCount: { type: integer }
        anchors:
          type: array
          description: Paragraph UUIDs citing the target (only when includeAnchors=true; capped at anchorCap).
          items: { type: string, format: uuid }
        anchorsTruncated:
          type: boolean
          description: True when citationCount exceeded anchorCap (only when includeAnchors=true).
    ReferenceGraphUmbrellaDivision:
      type: object
      required: [division, umbrellaSpecId, umbrellaPresent, notCalledOut]
      properties:
        division: { type: string }
        umbrellaSpecId: { type: [string, 'null'], format: uuid }
        umbrellaPresent: { type: boolean }
        notCalledOut:
          type: array
          description: In-scope specs in the division that never cite its "{division} 00 00" umbrella.
          items:
            type: object
            required: [specId, section]
            properties:
              specId: { type: string, format: uuid }
              section: { type: string }
    CoordinationReport:
      type: object
      required: [projectId, packageId, findings, summary, notes]
      properties:
        projectId: { type: string, format: uuid }
        packageId: { type: [string, 'null'], format: uuid }
        findings:
          type: array
          items: { $ref: '#/components/schemas/CoordinationFinding' }
        summary: { $ref: '#/components/schemas/CoordinationSummary' }
        notes:
          type: array
          items: { type: string }
    CoordinationSummary:
      type: object
      required:
        [
          requiredNotPresent,
          presentNotRequired,
          danglingRef,
          relatedListedNotCited,
          relatedCitedNotListed,
          standardCitedNotListed,
          productWithoutSubmittalType,
          submittalTypeWithoutProduct,
          productMissingDatasheet,
          impliedRelatedSection,
          umbrellaNotCalledOut,
          generalRequirementDuplicated,
          total,
        ]
      properties:
        requiredNotPresent: { type: integer }
        presentNotRequired: { type: integer }
        danglingRef: { type: integer }
        relatedListedNotCited: { type: integer }
        relatedCitedNotListed: { type: integer }
        standardCitedNotListed: { type: integer }
        productWithoutSubmittalType: { type: integer }
        submittalTypeWithoutProduct: { type: integer }
        productMissingDatasheet: { type: integer }
        impliedRelatedSection: { type: integer }
        umbrellaNotCalledOut: { type: integer }
        generalRequirementDuplicated: { type: integer }
        total: { type: integer }

    # ── Language-lint rule profiles + findings (#411 / ADR-080) ───────────────

    LanguageFindingsReport:
      type: object
      required: [projectId, packageId, configured, findings, summary, notes]
      properties:
        projectId: { type: string, format: uuid }
        packageId: { type: [string, 'null'], format: uuid }
        configured:
          type: boolean
          description: >
            False when NOT ONE present spec resolved a language-rule layer
            anywhere in its chain — linting is opt-in, so this is a normal
            state (empty findings), never an error.
        findings:
          type: array
          items: { $ref: '#/components/schemas/LanguageFinding' }
        summary: { $ref: '#/components/schemas/LanguageFindingsSummary' }
        notes:
          type: array
          items: { type: string }
    LanguageFindingsSummary:
      type: object
      required: [bannedTerm, reinforcingWord, partyVocabulary, phraseMissing, total]
      properties:
        bannedTerm: { type: integer }
        reinforcingWord: { type: integer }
        partyVocabulary: { type: integer }
        phraseMissing: { type: integer }
        total: { type: integer }
    LanguageFinding:
      oneOf:
        - $ref: '#/components/schemas/LanguageTermFlaggedFinding'
        - $ref: '#/components/schemas/LanguagePhraseMissingFinding'
      discriminator:
        propertyName: type
        mapping:
          language_term_flagged: '#/components/schemas/LanguageTermFlaggedFinding'
          language_phrase_missing: '#/components/schemas/LanguagePhraseMissingFinding'
    LanguageTermFlaggedFinding:
      type: object
      description: A banned term, reinforcing word, or flagged party-vocabulary match at one paragraph.
      required: [type, category, term, suggestion, specId, section, paragraphId, matchedText]
      properties:
        type: { type: string, enum: [language_term_flagged] }
        category:
          type: string
          enum: [bannedTerm, reinforcingWord, partyVocabulary]
        term: { type: string }
        suggestion: { type: [string, 'null'] }
        specId: { type: string, format: uuid }
        section: { type: string }
        paragraphId: { type: string, format: uuid }
        matchedText: { type: string }
    LanguagePhraseMissingFinding:
      type: object
      description: >
        A required phrase absent anywhere in the spec's scanned text — a
        whole-spec fact, never paragraph-located (ADR-080 D8).
      required: [type, phrase, suggestion, specId, section]
      properties:
        type: { type: string, enum: [language_phrase_missing] }
        phrase: { type: string }
        suggestion: { type: [string, 'null'] }
        specId: { type: string, format: uuid }
        section: { type: string }

    RevitLinkInventory:
      type: object
      description: Project-scoped Revit link inventory (#103) — element↔spec read model.
      required: [projectId, byElement, bySpec, summary]
      properties:
        projectId: { type: string, format: uuid }
        byElement:
          type: array
          description: One entry per Revit element, listing the specs it drives.
          items: { $ref: '#/components/schemas/RevitElementLinks' }
        bySpec:
          type: array
          description: One entry per present project spec, listing its linked elements.
          items: { $ref: '#/components/schemas/RevitSpecLinks' }
        summary: { $ref: '#/components/schemas/RevitLinkSummary' }
    RevitElementLinks:
      type: object
      required: [revitInstanceId, specs, linkCount]
      properties:
        revitInstanceId:
          type: string
          description: Revit element (family instance) id, stable per element within a model.
        specs:
          type: array
          items: { $ref: '#/components/schemas/RevitLinkedSpec' }
        linkCount:
          type: integer
          description: Number of mapping rows for this element within the project scope.
    RevitLinkedSpec:
      type: object
      required: [specId, section, title]
      properties:
        specId: { type: string, format: uuid }
        section: { type: string }
        title: { type: string }
    RevitSpecLinks:
      type: object
      required: [specId, section, title, elements, linkCount]
      properties:
        specId: { type: string, format: uuid }
        section: { type: string }
        title: { type: string }
        elements:
          type: array
          description: Distinct Revit element ids linked to this spec's paragraphs.
          items: { type: string }
        linkCount:
          type: integer
          description: Number of mapping rows targeting this spec within the project scope.
    RevitLinkSummary:
      type: object
      required:
        [
          elementCount,
          specCount,
          mappedSpecCount,
          specsWithoutModelBacking,
          unmappedElements,
          mappingCount,
        ]
      properties:
        elementCount:
          type: integer
          description: Distinct Revit elements with at least one link in the project.
        specCount:
          type: integer
          description: Total present project specs.
        mappedSpecCount:
          type: integer
          description: Project specs with at least one linked element.
        specsWithoutModelBacking:
          type: integer
          description: Project specs with no linked Revit element.
        unmappedElements:
          type: integer
          description: >-
            0 under the current mappings-only substrate — every mapped element
            resolves to a present project spec. A true count needs the deferred
            model-element registry (ADR-029 / ADR-049).
        mappingCount:
          type: integer
          description: Total in-scope mapping rows.
    CoordinationFinding:
      oneOf:
        - $ref: '#/components/schemas/FindingRequiredNotPresent'
        - $ref: '#/components/schemas/FindingPresentNotRequired'
        - $ref: '#/components/schemas/FindingDanglingRef'
        - $ref: '#/components/schemas/FindingRelatedListedNotCited'
        - $ref: '#/components/schemas/FindingRelatedCitedNotListed'
        - $ref: '#/components/schemas/FindingStandardCitedNotListed'
        - $ref: '#/components/schemas/FindingProductWithoutSubmittalType'
        - $ref: '#/components/schemas/FindingSubmittalTypeWithoutProduct'
        - $ref: '#/components/schemas/FindingProductMissingDatasheet'
        - $ref: '#/components/schemas/FindingImpliedRelatedSection'
        - $ref: '#/components/schemas/FindingUmbrellaNotCalledOut'
        - $ref: '#/components/schemas/FindingGeneralRequirementDuplicated'
      discriminator:
        propertyName: type
        mapping:
          required_not_present: '#/components/schemas/FindingRequiredNotPresent'
          present_not_required: '#/components/schemas/FindingPresentNotRequired'
          dangling_ref: '#/components/schemas/FindingDanglingRef'
          related_listed_not_cited: '#/components/schemas/FindingRelatedListedNotCited'
          related_cited_not_listed: '#/components/schemas/FindingRelatedCitedNotListed'
          standard_cited_not_listed: '#/components/schemas/FindingStandardCitedNotListed'
          product_without_submittal_type: '#/components/schemas/FindingProductWithoutSubmittalType'
          submittal_type_without_product: '#/components/schemas/FindingSubmittalTypeWithoutProduct'
          product_missing_datasheet: '#/components/schemas/FindingProductMissingDatasheet'
          implied_related_section: '#/components/schemas/FindingImpliedRelatedSection'
          umbrella_not_called_out: '#/components/schemas/FindingUmbrellaNotCalledOut'
          general_requirement_duplicated: '#/components/schemas/FindingGeneralRequirementDuplicated'
    FindingRequiredNotPresent:
      type: object
      required: [type, section, title, requiredId]
      properties:
        type: { type: string, enum: [required_not_present] }
        section: { type: string }
        title: { type: [string, 'null'] }
        requiredId: { type: string, format: uuid }
    FindingPresentNotRequired:
      type: object
      required: [type, section, specId, title]
      properties:
        type: { type: string, enum: [present_not_required] }
        section: { type: string }
        specId: { type: string, format: uuid }
        title: { type: string }
    FindingDanglingRef:
      type: object
      required:
        [
          type,
          refId,
          sourceSpecId,
          sourceSpecSection,
          sourceParagraphId,
          snippet,
          targetSpecSection,
          referenceText,
          availableFrom,
        ]
      properties:
        type: { type: string, enum: [dangling_ref] }
        refId: { type: string, format: uuid }
        sourceSpecId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        sourceParagraphId:
          type: string
          format: uuid
          description: Paragraph the dangling reference sits in — the paragraph-level locator
        snippet:
          type: string
          description: Short excerpt of that paragraph, centred on the matched reference
        targetSpecSection: { type: string }
        referenceText: { type: string }
        availableFrom:
          type: array
          items:
            type: object
            required: [libraryId, name]
            properties:
              libraryId: { type: string, format: uuid }
              name: { type: string }
    FindingRelatedListedNotCited:
      type: object
      description: >
        A3 — a section appears in this spec's Related Sections article but is never
        referenced anywhere else in its body. Likely an over-broad coordination list.
      required: [type, sourceSpecId, sourceSpecSection, sourceParagraphId, section]
      properties:
        type: { type: string, enum: [related_listed_not_cited] }
        sourceSpecId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        sourceParagraphId:
          type: string
          format: uuid
          description: Related Sections list paragraph that names the section — the paragraph-level locator
        section: { type: string, description: Canonical CSI number listed but not cited }
    FindingRelatedCitedNotListed:
      type: object
      description: >
        A2 — a section is cited in this spec's body but absent from its Related
        Sections article. The coordination list is missing a real dependency.
      required: [type, sourceSpecId, sourceSpecSection, sourceParagraphId, section]
      properties:
        type: { type: string, enum: [related_cited_not_listed] }
        sourceSpecId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        sourceParagraphId:
          type: string
          format: uuid
          description: Body paragraph that cites the section — the paragraph-level locator
        section: { type: string, description: Canonical CSI number cited but not listed }
    FindingStandardCitedNotListed:
      type: object
      description: >
        B2 — a code/standard (ASTM, NFPA, UL, …) is cited in this spec's body but
        absent from its References article. (The inverse, a listed-but-uncited
        standard, is intentionally NOT reported — #259 non-goal B1.)
      required: [type, sourceSpecId, sourceSpecSection, sourceParagraphId, standardCode]
      properties:
        type: { type: string, enum: [standard_cited_not_listed] }
        sourceSpecId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        sourceParagraphId:
          type: string
          format: uuid
          description: Body paragraph that cites the standard — the paragraph-level locator
        standardCode: { type: string, description: 'Normalized "ORG identifier", e.g. ASTM E814' }
    FindingImpliedRelatedSection:
      type: object
      description: >
        Advisory suggestion: this spec body contains a distinctive keyword from an
        in-scope section title, but that section is not already listed in this
        spec's Related Sections article. Suppressed for own-section, already-listed,
        generic, and overly common title keywords.
      required:
        [
          type,
          sourceSpecId,
          sourceSpecSection,
          sourceParagraphId,
          impliedSection,
          impliedTitle,
          matchedKeyword,
          confidence,
        ]
      properties:
        type: { type: string, enum: [implied_related_section] }
        sourceSpecId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        sourceParagraphId:
          type: string
          format: uuid
          description: Paragraph whose body text matched the implied section title keyword
        impliedSection:
          type: string
          description: Canonical CSI section number suggested for Related Sections
        impliedTitle: { type: string }
        matchedKeyword:
          type: string
          description: Normalized title keyword found in the source paragraph
        confidence:
          type: number
          minimum: 0
          maximum: 1
    FindingUmbrellaNotCalledOut:
      type: object
      description: >
        A subordinate section does not cite its division umbrella section
        (`DD 00 00`). Checked across every division present in scope (ADR-042);
        the coordination report notes list the divisions covered.
      required: [type, sourceSpecId, sourceSpecSection, umbrellaSpecSection]
      properties:
        type: { type: string, enum: [umbrella_not_called_out] }
        sourceSpecId: { type: string, format: uuid }
        sourceSpecSection:
          type: string
          description: Subordinate section missing the umbrella call-out.
        umbrellaSpecSection:
          type: string
          description: Expected division umbrella section number, e.g. `26 00 00`.

    FindingGeneralRequirementDuplicated:
      type: object
      description: >
        Advisory title-level overlap: a technical section's PART 1 article has the
        same derived role or exact normalized title as an article in a present
        Division 00/01 spec or its applicable `DD 00 00` umbrella. References and
        Related Sections are pointer-only roles and are excluded (ADR-073).
      required:
        [
          type,
          sourceSpecId,
          sourceSpecSection,
          sourceParagraphId,
          sourceArticleTitle,
          authoritySpecId,
          authoritySpecSection,
          authorityParagraphId,
          authorityArticleTitle,
          authorityKind,
          matchBasis,
          matchedValue,
        ]
      properties:
        type: { type: string, enum: [general_requirement_duplicated] }
        sourceSpecId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        sourceParagraphId:
          type: string
          format: uuid
          description: Technical-section PART 1 article that overlaps the authority article.
        sourceArticleTitle: { type: string }
        authoritySpecId: { type: string, format: uuid }
        authoritySpecSection: { type: string }
        authorityParagraphId:
          type: string
          format: uuid
          description: Division 00/01 or division-umbrella article used for comparison.
        authorityArticleTitle: { type: string }
        authorityKind:
          type: string
          enum: [division_00_01, division_umbrella]
        matchBasis:
          type: string
          enum: [article_role, normalized_title]
        matchedValue:
          type: string
          description: Derived role or normalized article title that established the overlap.

    FindingProductWithoutSubmittalType:
      type: object
      description: >
        A PART 2 product was specified, but the spec's PART 1 Submittals article
        yielded no recognized required submittal type for the product register.
      required: [type, specId, sourceSpecSection, productName, sourceParagraphId]
      properties:
        type: { type: string, enum: [product_without_submittal_type] }
        specId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        productName: { type: string }
        sourceParagraphId: { type: string, format: uuid }
    FindingSubmittalTypeWithoutProduct:
      type: object
      description: >
        A PART 1 Submittals article requires a submittal type, but no PART 2
        product candidate exists in that selected spec.
      required: [type, specId, sourceSpecSection, submittalType]
      properties:
        type: { type: string, enum: [submittal_type_without_product] }
        specId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        submittalType: { type: string }
    FindingProductMissingDatasheet:
      type: object
      description: >
        A PART 2 product is present but has no paragraph association that can
        serve as product-data/datasheet evidence.
      required: [type, specId, sourceSpecSection, productName, sourceParagraphId]
      properties:
        type: { type: string, enum: [product_missing_datasheet] }
        specId: { type: string, format: uuid }
        sourceSpecSection: { type: string }
        productName: { type: string }
        sourceParagraphId: { type: string, format: uuid }

    # ── Submittal Register (#263) ───────────────────────────────────────────────

    SubmittalRegisterBody:
      type: object
      required: [specIds]
      properties:
        specIds:
          type: array
          description: Project spec UUIDs selected for the register. Empty array is valid.
          items: { type: string, format: uuid }
          uniqueItems: true
    SubmittalRegister:
      type: object
      required: [projectId, specIds, rows, findings, summary, notes]
      properties:
        projectId: { type: string, format: uuid }
        specIds:
          type: array
          items: { type: string, format: uuid }
        rows:
          type: array
          items: { $ref: '#/components/schemas/SubmittalRegisterRow' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/SubmittalRegisterFinding' }
        summary: { $ref: '#/components/schemas/SubmittalRegisterSummary' }
        notes:
          type: array
          items: { type: string }
    SubmittalRegisterRow:
      type: object
      required: [productName, requiredSubmittalTypes, datasheets, datasheetStatus, sources]
      properties:
        productName: { type: string }
        requiredSubmittalTypes:
          type: array
          items: { type: string }
        datasheets:
          type: array
          items: { $ref: '#/components/schemas/ParagraphAssociation' }
        datasheetStatus: { type: string, enum: [present, missing] }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SubmittalRegisterSource' }
    SubmittalRegisterSource:
      type: object
      required: [specId, section, title, paragraphId, paragraphText]
      properties:
        specId: { type: string, format: uuid }
        section: { type: string }
        title: { type: string }
        paragraphId: { type: string, format: uuid }
        paragraphText: { type: string }
    SubmittalRegisterFinding:
      oneOf:
        - $ref: '#/components/schemas/FindingProductWithoutSubmittalType'
        - $ref: '#/components/schemas/FindingSubmittalTypeWithoutProduct'
        - $ref: '#/components/schemas/FindingProductMissingDatasheet'
      discriminator:
        propertyName: type
        mapping:
          product_without_submittal_type: '#/components/schemas/FindingProductWithoutSubmittalType'
          submittal_type_without_product: '#/components/schemas/FindingSubmittalTypeWithoutProduct'
          product_missing_datasheet: '#/components/schemas/FindingProductMissingDatasheet'
    SubmittalRegisterSummary:
      type: object
      required:
        [
          rows,
          productWithoutSubmittalType,
          submittalTypeWithoutProduct,
          productMissingDatasheet,
          totalFindings,
        ]
      properties:
        rows: { type: integer }
        productWithoutSubmittalType: { type: integer }
        submittalTypeWithoutProduct: { type: integer }
        productMissingDatasheet: { type: integer }
        totalFindings: { type: integer }

    # ── Open comments (#262) ─────────────────────────────────────────────────────

    OpenCommentsScope:
      oneOf:
        - type: object
          required: [kind, specId]
          properties:
            kind: { type: string, enum: [spec] }
            specId: { type: string, format: uuid }
        - type: object
          required: [kind, projectId]
          properties:
            kind: { type: string, enum: [project] }
            projectId: { type: string, format: uuid }
      discriminator:
        propertyName: kind
    OpenComment:
      type: object
      required: [specId, specSection, paragraphId, author, text, anchor]
      properties:
        specId: { type: string, format: uuid }
        specSection: { type: string }
        paragraphId: { type: string, format: uuid }
        author: { type: string }
        text: { type: string }
        anchor: { $ref: '#/components/schemas/SourceTextSpan' }
    OpenCommentsSummary:
      type: object
      required: [open, total]
      properties:
        open: { type: integer }
        total:
          type: integer
          description: Total comment occurrences in scope (open + closed).
    OpenCommentsReport:
      type: object
      required: [scope, openComments, summary]
      properties:
        scope: { $ref: '#/components/schemas/OpenCommentsScope' }
        openComments:
          type: array
          items: { $ref: '#/components/schemas/OpenComment' }
        summary: { $ref: '#/components/schemas/OpenCommentsSummary' }

    # ── Issuance readiness (ADR-079, #406) ────────────────────────────────────────

    IssuanceMode:
      type: string
      enum: [draft, final]
      description: >
        Issuance-readiness gate mode (ADR-079, #406). `draft` (or an omitted
        `mode`) is a complete no-op at zero evaluation cost. `final` evaluates
        every ReadinessFinding across the resolved tree(s) and blocks with 422
        unless the result is already clean or `overrideReadinessGate: true` is
        set. Shared by `POST /packages/{id}/revisions` (structured body) and
        all three `generate` endpoints.

    ReadinessFinding:
      description: >
        One resolvable blocker an editor must clear before a spec can leave
        the firm as Final. Every variant carries nodeId/text plus
        kind-specific detail.
      oneOf:
        - type: object
          required: [type, nodeId, text, kind, options]
          properties:
            type: { type: string, enum: [unresolved_choice_token] }
            nodeId: { type: string, format: uuid }
            text: { type: string }
            kind:
              type: string
              enum: [angle, bracket]
              description: The choice-token delimiter style — `<__>` vs `[__]`.
            options:
              type: array
              items: { type: string }
              description: The pick-one/fill-in choices captured at parse time.
        - type: object
          required: [type, nodeId, text]
          properties:
            type: { type: string, enum: [specifier_note_present] }
            nodeId: { type: string, format: uuid }
            text: { type: string }
        - type: object
          required: [type, nodeId, text, author]
          properties:
            type: { type: string, enum: [open_comment] }
            nodeId: { type: string, format: uuid }
            text: { type: string }
            author: { type: string }
        - type: object
          required: [type, nodeId, text, objectKind]
          properties:
            type: { type: string, enum: [body_object_present] }
            nodeId: { type: string, format: uuid }
            text: { type: string }
            objectKind:
              type: string
              enum: [textBox]
              description: >-
                Always textBox — a body-level table is structural content
                (ADR-072) and never fires this finding.
      discriminator:
        propertyName: type

    StampedReadinessFinding:
      description: A ReadinessFinding stamped with the spec that produced it (package scope).
      allOf:
        - $ref: '#/components/schemas/ReadinessFinding'
        - type: object
          required: [specId, specSection]
          properties:
            specId: { type: string, format: uuid }
            specSection: { type: string }

    StampedHighlightAdvisory:
      type: object
      required: [specId, specSection, finding]
      properties:
        specId: { type: string, format: uuid }
        specSection: { type: string }
        finding: { $ref: '#/components/schemas/HighlightReviewFinding' }

    ReadinessSummary:
      type: object
      required: [unresolvedChoiceToken, specifierNotePresent, openComment, bodyObjectPresent, total]
      properties:
        unresolvedChoiceToken: { type: integer, minimum: 0 }
        specifierNotePresent: { type: integer, minimum: 0 }
        openComment: { type: integer, minimum: 0 }
        bodyObjectPresent: { type: integer, minimum: 0 }
        total:
          type: integer
          minimum: 0
          description: Always equals findings.length — the highlight advisory never counts here.

    ReadinessScope:
      oneOf:
        - type: object
          required: [kind, specId]
          properties:
            kind: { type: string, enum: [spec] }
            specId: { type: string, format: uuid }
        - type: object
          required: [kind, packageId]
          properties:
            kind: { type: string, enum: [package] }
            packageId: { type: string, format: uuid }
      discriminator:
        propertyName: kind

    ReadinessReport:
      type: object
      required: [scope, findings, highlightAdvisory, summary, readyForFinal]
      properties:
        scope: { $ref: '#/components/schemas/ReadinessScope' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/StampedReadinessFinding' }
        highlightAdvisory:
          type: array
          description: Advisory-only (ADR-079 decision 3) — never factors into readyForFinal.
          items: { $ref: '#/components/schemas/StampedHighlightAdvisory' }
        summary: { $ref: '#/components/schemas/ReadinessSummary' }
        readyForFinal:
          type: boolean
          description: >-
            findings.length === 0 — a computed convenience, never a second
            source of truth; the highlight advisory never gates it.

    # ── Parse ──────────────────────────────────────────────────────────────────

    ParseStage:
      type: string
      enum:
        - queued
        - running
        - extracting
        - numbering
        - styles
        - document
        - classifying
        - persisting
        - complete
        - failed

    ParseJob:
      type: object
      required: [jobId, status, progress, expiresAt]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ParseStage'
          description: >
            Overall job state. In practice takes `queued`, `running`, `complete`,
            or `failed`; the fine-grained pipeline step lives in `progress.stage`.
        progress:
          type: object
          required: [stage, pct]
          properties:
            stage:
              $ref: '#/components/schemas/ParseStage'
              description: Current pipeline step
            pct:
              type: number
              minimum: 0
              maximum: 100
        result:
          $ref: '#/components/schemas/ParseJobResult'
          description: Present once status is `complete`
        error:
          type: string
          description: Present once status is `failed`
        expiresAt:
          type: integer
          description: Job record expiry as a Unix epoch timestamp in milliseconds

    ParseJobResult:
      type: object
      required: [specId, section, title, nodeCount]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
          description: CSI section number, or "unknown" if not detected
        title:
          type: string
        nodeCount:
          type: integer
          description: Total nodes in the persisted paragraph tree
        capabilities:
          type: array
          items:
            type: string
          description: 'Parser capability flags (e.g. "read-only", "parse-warnings")'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'

    ParseWarning:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - root-continuation
            - empty-part
            - no-structure-found
            - unusual-part-count
            - non-conforming-part-numbering
            - core-metadata-unreadable
            - pdf-degraded-extraction
            - pdf-ocr-applied
            - pdf-ocr-low-confidence
            - pdf-ocr-unusable
            - pdf-font-encoding-remapped
            - pdf-font-encoding-unrecoverable
            - table-content-skipped
            - header-footer-content-skipped
            - body-drawing-skipped
        lineHint:
          type: string
          description: 'Source location hint (e.g. "line 12: <text>")'
        suggestion:
          type: string

    # ── Onboarding (O-8) ─────────────────────────────────────────────────────────

    OnboardingStage:
      type: string
      enum: [queued, running, parsing, persisting, deriving-style, classifying, complete, failed]

    EditabilityValue:
      type: string
      enum: [locked, editable, choice, note]

    EditabilitySummary:
      type: object
      required: [counts, lowConfidence]
      properties:
        counts:
          type: object
          required: [locked, editable, choice, note]
          properties:
            locked: { type: integer }
            editable: { type: integer }
            choice: { type: integer }
            note: { type: integer }
        lowConfidence:
          type: array
          description: Classified paragraphs below the machine-confidence review threshold.
          items:
            type: object
            required: [nodeId, value, confidence]
            properties:
              nodeId: { type: string, format: uuid }
              value: { $ref: '#/components/schemas/EditabilityValue' }
              confidence: { type: number, minimum: 0, maximum: 1 }

    HighlightReviewFinding:
      type: object
      required: [nodeId, nodeType, text, outlinePath, highlights]
      properties:
        nodeId: { type: string, format: uuid }
        nodeType:
          type: string
          enum:
            [
              spec,
              part,
              article,
              pr1,
              pr2,
              pr3,
              pr4,
              pr5,
              pr6,
              pr7,
              note,
              continuation,
              object,
              objectText,
            ]
        text:
          type: string
        outlinePath:
          type: array
          description: Section number and ancestor headings ending at the flagged paragraph.
          items: { type: string }
        highlights:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SourceHighlightFact'

    HighlightReviewReport:
      type: object
      required: [total, findings]
      properties:
        total:
          type: integer
          minimum: 0
          description: Number of paragraphs carrying one or more highlight clues.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/HighlightReviewFinding'

    HierarchySummary:
      type: object
      required: [counts, lowConfidence]
      properties:
        counts:
          type: object
          required: [scored, unscored, belowThreshold]
          properties:
            scored: { type: integer }
            unscored: { type: integer }
            belowThreshold: { type: integer }
        unscoredReason:
          type: string
          description: >-
            Present when unscored > 0 — why those paragraphs carry no score
            (explicit-structure source, pre-provenance parse, non-DOCX source,
            or manually inserted). Never folded into another bucket.
        lowConfidence:
          type: array
          description: Scored paragraphs below the hierarchy review threshold (0.6), worst-first.
          items:
            type: object
            required: [nodeId, nodeType, ilvl, confidence, evidence]
            properties:
              nodeId: { type: string, format: uuid }
              nodeType:
                type: string
                enum: [part, article, pr1, pr2, pr3, pr4, pr5, pr6, pr7]
              ilvl: { type: integer, minimum: 0, maximum: 8 }
              confidence: { type: number, minimum: 0, maximum: 1 }
              evidence:
                type: array
                items: { type: string }

    OnboardingReport:
      type: object
      required:
        [
          styleDerivation,
          styleSourceNeeded,
          headerFooter,
          editability,
          highlightReview,
          hierarchy,
          parseWarnings,
        ]
      properties:
        styleDerivation:
          oneOf:
            - $ref: '#/components/schemas/DerivationReport'
            - type: 'null'
          description: WT-3 consensus style derivation audit; null for non-DOCX masters.
        styleSourceNeeded:
          type: boolean
          description: True when no style template was derived (non-DOCX) — assign via O-12.
        headerFooter:
          oneOf:
            - $ref: '#/components/schemas/HeaderFooterComposition'
            - type: 'null'
          description: >
            Header/footer composition captured at parse time (ADR-040, #306);
            null when the source had none. Review draft only — not persisted
            here; save it (as-is or edited) via `PUT .../header-footer`
            (#208/#480).
        editability:
          $ref: '#/components/schemas/EditabilitySummary'
        highlightReview:
          $ref: '#/components/schemas/HighlightReviewReport'
          description: Highlighted paragraphs requiring draft/editor-decision review.
        hierarchy:
          $ref: '#/components/schemas/HierarchySummary'
        parseWarnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'

    OnboardingJobResult:
      type: object
      required: [specId, section, title, libraryId, templateId, report]
      properties:
        specId: { type: string, format: uuid }
        section: { type: string }
        title: { type: string }
        libraryId: { type: string, format: uuid }
        templateId:
          type: [string, 'null']
          description: Derived style template id (DOCX) or null (non-DOCX).
        report:
          $ref: '#/components/schemas/OnboardingReport'

    OnboardingJob:
      type: object
      required: [jobId, status, progress, expiresAt]
      properties:
        jobId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OnboardingStage' }
        progress:
          type: object
          required: [stage, pct]
          properties:
            stage: { $ref: '#/components/schemas/OnboardingStage' }
            pct: { type: number, minimum: 0, maximum: 100 }
        result:
          $ref: '#/components/schemas/OnboardingJobResult'
        error: { type: string }
        expiresAt:
          type: integer
          description: Job record expiry as a Unix epoch timestamp in milliseconds.

    # ── Specs ──────────────────────────────────────────────────────────────────

    SignalConflict:
      type: object
      required: [signal, reportedIlvl, reportedNodeType]
      properties:
        signal:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: The losing inference signal that disagreed with the winner
        reportedIlvl:
          type: integer
          description: Normalized ilvl the losing signal reported (part=0 … pr7=8)
        reportedNodeType:
          type: string
          enum:
            [
              spec,
              part,
              article,
              pr1,
              pr2,
              pr3,
              pr4,
              pr5,
              pr6,
              pr7,
              note,
              continuation,
              object,
              objectText,
            ]

    SpecNodeInference:
      type: object
      required: [confidence, signalUsed, agreed, evidence]
      description: >-
        Hierarchy-inference confidence for this paragraph (ADR-055), derived at
        read time from persisted signal provenance and conflicts. Absent when
        the paragraph has no provenance (pre-provenance parse, non-DOCX source,
        or a manually inserted paragraph — no parse-time signals ran) or is
        non-structural (note/continuation).
      properties:
        confidence:
          type: number
          minimum: 0
          maximum: 1
        signalUsed:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: The winning inference signal (1 numbering.xml, 2 style chain, 3 document order, 4 text pattern, 5 indentation)
        agreed:
          type: array
          description: Signals whose vote matched the final resolved classification
          items:
            type: integer
            enum: [1, 2, 3, 4, 5]
        evidence:
          type: array
          description: Human-readable why-chain. Names signals, never source vendors.
          items:
            type: string

    ScoredParagraph:
      type: object
      required: [nodeId, nodeType, ilvl, label, preview, confidence, signalUsed, agreed, evidence]
      description: >-
        One scored structural paragraph in a GET /specs/{id}/hierarchy-report
        response (WS2, #424) — the same inference provenance as
        `SpecNodeInference`, plus the paragraph's identity, CSI label, and a
        text preview.
      properties:
        nodeId: { type: string, format: uuid }
        nodeType:
          type: string
          enum: [part, article, pr1, pr2, pr3, pr4, pr5, pr6, pr7]
        ilvl: { type: integer, minimum: 0, maximum: 8 }
        label:
          type: string
          description: CSI render label exactly as the markdown renderer would show it (e.g. "1.2", "PART 1").
        preview:
          type: string
          description: Paragraph text, truncated to 80 characters (no ellipsis — a straight prefix).
        confidence:
          type: number
          minimum: 0
          maximum: 1
        signalUsed:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: The winning inference signal (1 numbering.xml, 2 style chain, 3 document order, 4 text pattern, 5 indentation)
        agreed:
          type: array
          description: Signals whose vote matched the final resolved classification
          items:
            type: integer
            enum: [1, 2, 3, 4, 5]
        evidence:
          type: array
          description: Human-readable why-chain. Names signals, never source vendors.
          items:
            type: string
        conflicts:
          type: array
          description: Losing signals that disagreed with the winner. Omitted when there are none.
          items:
            $ref: '#/components/schemas/SignalConflict'

    HierarchyReport:
      type: object
      required: [counts, paragraphs]
      description: >-
        Per-paragraph hierarchy-inference scoring report (WS2, #424). `counts`
        and `unscoredReason` mirror `HierarchySummary` (the `hierarchy` field
        of `OnboardingReport`) exactly; `paragraphs` carries ALL scored nodes,
        worst confidence first, not just the below-threshold subset.
      properties:
        counts:
          type: object
          required: [scored, unscored, belowThreshold]
          properties:
            scored: { type: integer }
            unscored: { type: integer }
            belowThreshold: { type: integer }
        unscoredReason:
          type: string
          description: >-
            Present when unscored > 0 — why those paragraphs carry no score
            (explicit-structure source, pre-provenance parse, non-DOCX source,
            or manually inserted). Never folded into another bucket.
        paragraphs:
          type: array
          description: ALL scored structural paragraphs, worst confidence first.
          items:
            $ref: '#/components/schemas/ScoredParagraph'

    SourceTextSpan:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: integer
          minimum: 0
        - type: integer
          minimum: 0

    SourceCommentFact:
      type: object
      required: [author, text, anchor, closed]
      properties:
        author:
          type: string
        text:
          type: string
        anchor:
          $ref: '#/components/schemas/SourceTextSpan'
        closed:
          type: boolean
          description: >
            True when the comment is resolved (#262): its runs are struck through
            OR its text ends in "Closed". For facts persisted before this field
            existed, it is derived from the trailing "Closed" suffix (the strike
            signal is unrecoverable, so such legacy facts read as open).

    SourceColorFact:
      type: object
      required: [color, coverage, spans]
      properties:
        color:
          type: string
        coverage:
          type: number
          minimum: 0
          maximum: 1
        spans:
          type: array
          items:
            $ref: '#/components/schemas/SourceTextSpan'

    SourceHighlightFact:
      type: object
      description: A directly highlighted DOCX run and its paragraph-relative location.
      required: [color, text, span]
      additionalProperties: true
      properties:
        color:
          type: string
          description: Named OOXML highlight color (for example, yellow).
        text:
          type: string
          description: Exact text carried by the highlighted run.
        span:
          $ref: '#/components/schemas/SourceTextSpan'

    SourceChoiceTokenFact:
      type: object
      required: [kind, options, span]
      properties:
        kind:
          type: string
          enum: [angle, bracket]
        options:
          type: array
          items:
            type: string
        span:
          $ref: '#/components/schemas/SourceTextSpan'

    SourceEmphasisFact:
      description: >-
        A run-level formatting deviation from the paragraph effective style.
        Size values use OOXML half-points (for example, 22 means 11 pt).
      oneOf:
        - type: object
          required: [property, value, expected, text, span]
          properties:
            property:
              type: string
              enum: [bold, italic]
            value:
              type: boolean
            expected:
              type: boolean
            text:
              type: string
              description: Text carried by the directly formatted run.
            span:
              $ref: '#/components/schemas/SourceTextSpan'
        - type: object
          required: [property, value, expected, text, span]
          properties:
            property:
              type: string
              const: underline
            value:
              type: string
            expected:
              type: string
            text:
              type: string
              description: Text carried by the directly formatted run.
            span:
              $ref: '#/components/schemas/SourceTextSpan'
        - type: object
          required: [property, value, expected, text, span]
          properties:
            property:
              type: string
              const: size
            value:
              type: integer
              description: Font size in OOXML half-points.
            expected:
              oneOf:
                - type: integer
                  description: Effective font size in OOXML half-points.
                - type: 'null'
            text:
              type: string
              description: Text carried by the directly formatted run.
            span:
              $ref: '#/components/schemas/SourceTextSpan'

    SourceFacts:
      type: object
      description: >-
        Parser source facts for this paragraph. Present only when non-empty;
        unknown JSON keys are preserved for forward-compatible fact producers.
      additionalProperties: true
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/SourceCommentFact'
        colors:
          type: array
          items:
            $ref: '#/components/schemas/SourceColorFact'
        highlights:
          type: array
          description: >-
            First-class highlighted runs. The parser also retains legacy
            `highlight:<color>` entries in `colors` for compatibility.
          items:
            $ref: '#/components/schemas/SourceHighlightFact'
        choiceTokens:
          type: array
          items:
            $ref: '#/components/schemas/SourceChoiceTokenFact'
        emphasis:
          type: array
          description: >-
            Advisory run-level formatting deviations from the paragraph effective
            style. Captured for review only; parsing never rewrites the source.
          items:
            $ref: '#/components/schemas/SourceEmphasisFact'
        banner:
          type: string
        vanish:
          type: boolean
          const: true

    SpecNode:
      type: object
      required: [id, type, text, children, meta]
      allOf:
        # Cross-field invariant enforced by SpecNodeSchema's `.check()`
        # (src/ast/spec-tree-schemas.ts, #650 Part B): `meta.object` is
        # present on EXACTLY the `object` node type — an 'object' node is
        # meaningless without its captured blob, and no other node type may
        # carry one. A biconditional, hence the else-branch.
        - if:
            required: [type]
            properties:
              type:
                const: object
          then:
            required: [meta]
            properties:
              meta:
                required: [object]
          else:
            properties:
              meta:
                not:
                  required: [object]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: >-
            'object' and 'objectText' (#300) model a captured body-level
            table/text-box and its editable interior paragraph text — neither
            participates in CSI numbering or the 5-signal hierarchy engine.
          enum:
            [
              spec,
              part,
              article,
              pr1,
              pr2,
              pr3,
              pr4,
              pr5,
              pr6,
              pr7,
              note,
              continuation,
              object,
              objectText,
            ]
        text:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpecNode'
        meta:
          type: object
          properties:
            vanish:
              type: boolean
              description: Hidden (w:vanish) paragraph — editorial note, not owner-facing
            acknowledged:
              type: boolean
              description: >-
                A specifier has read and accepted this `note` or `textBox`
                `object` node (#545, ADR-079 follow-on), clearing the
                issuance-readiness gate's `specifier_note_present` /
                `body_object_present` finding for it WITHOUT removing or
                hiding the content — it still renders exactly as before.
                Deliberately separate from `vanish`. Present only when true.
            pageBreakBefore:
              type: boolean
              description: >-
                This node should begin on a new page in the rendered DOCX (#497,
                ADR-075) — captured from either source form of a manual break: a
                `w:br w:type="page"` run in the immediately preceding paragraph
                (Word "Insert → Page Break"), or a `w:pageBreakBefore` property on
                the paragraph itself (Word "Page break before"). Persisted and
                round-tripped through the full upload → store → generate flow.
                Present only when true; absent means no manual page break. Never
                set on `type: object` nodes — their OOXML is already preserved
                verbatim in `meta.object`.
            source:
              type: string
              enum: [ufgs, arcat, cpi, unknown]
            revitParam:
              type: string
            baseVersion:
              type: integer
              minimum: 0
            conflicts:
              type: array
              description: >-
                DOCX inference signal disagreements for this paragraph. Present
                only when non-empty — the hierarchy level was ambiguous and the
                engine picked the highest-priority signal.
              items:
                $ref: '#/components/schemas/SignalConflict'
            sourceFacts:
              $ref: '#/components/schemas/SourceFacts'
            editability:
              $ref: '#/components/schemas/SpecNodeEditability'
            inference:
              $ref: '#/components/schemas/SpecNodeInference'
            associations:
              type: array
              description: >-
                External content links for this paragraph (#109). Present only
                when the paragraph has one or more associations.
              items:
                $ref: '#/components/schemas/ParagraphAssociation'
            articleRole:
              type: string
              description: >-
                Semantic CSI role of this article, derived from its heading
                (ADR-033). Present only on `article` nodes whose heading matches
                a recognized CSI role; absent for unknown/non-standard articles
                and all non-article nodes.
              enum:
                - summary
                - references
                - definitions
                - related-sections
                - submittals
                - quality-assurance
                - delivery-storage-handling
                - warranty
            object:
              description: >-
                Captured DOCX body object (#300, ADR-072) — a table or text
                box modeled as an opaque round-trip blob. Present only on
                `type: object` nodes.
              $ref: '#/components/schemas/ObjectMeta'
            originParagraphId:
              type: string
              format: uuid
              description: >-
                The live paragraph this node was frozen from, at revision-freeze
                time (#392, ADR-078). Present only in a revision's frozen
                `SpecTree` (e.g. `GET /revisions/{id}`) — never on a live
                `GET /specs/{id}/tree` response — and only for a paragraph that
                itself has project-copy lineage (migration 018); absent for a
                locally-authored paragraph or a snapshot frozen before this
                field existed.

    ObjectMeta:
      type: object
      description: >-
        Metadata for a captured body-level object (#300, ADR-072): SpecR
        round-trips its OOXML byte-for-byte via `blob` rather than modeling
        its interior as CSI structure.
      required: [kind, floating, generation, blob]
      allOf:
        # Cross-field invariant enforced by ObjectMetaSchema's `.check()`
        # (src/ast/object-schemas.ts, #516): rows/columns are table-grid
        # dimensions, and a textBox has no grid to describe. Stated
        # structurally so a consumer generating types/validators from this
        # contract rejects the same shapes the server does.
        - if:
            required: [kind]
            properties:
              kind:
                const: textBox
          then:
            not:
              anyOf:
                - required: [rows]
                - required: [columns]
      properties:
        kind:
          type: string
          enum: [table, textBox]
        floating:
          type: boolean
          description: Anchored/wrapped (true) vs. inline (false) placement.
        generation:
          type: string
          description: The OOXML drawing generation the object was authored in.
          enum: [drawingml, vml]
        rows:
          type: integer
          minimum: 1
          description: Table row count (table kind only).
        columns:
          type: integer
          minimum: 1
          description: Table column count (table kind only).
        vanishCharStyleIds:
          type: array
          description: >-
            Resolved character-style IDs (#650) carrying an enabled
            `w:vanish` — the styles a run's `w:rStyle` must resolve through
            to be treated as hidden. Captured at import so hidden text stays
            excluded from `objectText` on later edits, without needing
            `styles.xml` at edit time. Absent and `[]` are interchangeable;
            an object captured before this field existed has neither.
          items:
            type: string
        blob:
          type: array
          description: >-
            The object's own top-level OOXML node(s), in document order, as
            fast-xml-parser `preserveOrder: true` JSON — an opaque capture
            format, never interpreted as modeled CSI structure. Always
            non-empty.
          minItems: 1
          items:
            type: object
            additionalProperties: true

    SpecTree:
      type: object
      required: [id, section, title, parts]
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
          description: 'CSI section number (e.g. "09 91 26"), or "unknown" if not detected'
        title:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/SpecNode'
        styleSource:
          description: >
            Manually assigned style template (#138), or null when none is set.
            Only present on GET /specs/{id}.
          oneOf:
            - $ref: '#/components/schemas/StyleSource'
            - type: 'null'
        onboardingStatus:
          description: >
            Whether a human has reviewed the machine's first pass (ADR-022 D6).
            Only present on GET /specs/{id}.
          type: string
          enum: [review, active]
        withdrawnAt:
          type: [string, 'null']
          format: date-time
          description: >
            Soft-delete (withdraw) tombstone (ADR-030): ISO-8601 when the master
            is withdrawn, `null` when active. A withdrawn master stays GET-able so
            lineage/history resolves; only listings/resolution hide it. Only
            present on GET /specs/{id}.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'
        hiddenTables:
          type: array
          items:
            $ref: '#/components/schemas/RetainedTable'
          description: >
            Hidden DOCX tables (all evidence-bearing cell paragraphs vanish)
            retained out-of-band for future change-management (ADR-038).
            Absent when the source has no hidden tables.
        headerFooter:
          description: >
            Captured DOCX header/footer composition (ADR-040, #306), parsed
            straight from the source document. Parse-output only — not
            persisted; separate from the header/footer config CRUD surface
            (`GET/PUT/DELETE .../header-footer`, #476). Absent when the
            source has no headers or footers.
          allOf:
            - $ref: '#/components/schemas/HeaderFooterComposition'
        pageSize:
          description: >
            Captured DOCX page size (`w:pgSz`, #509, ADR-077), persisted and
            round-tripped so a regenerated document keeps the source geometry.
            Absent when no explicit page size was captured (a `.SEC` source, or
            a DOCX whose trailing `w:sectPr` lacks `w:pgSz`); the generator then
            defaults to US Letter.
          allOf:
            - $ref: '#/components/schemas/PageSize'

    PageSize:
      type: object
      required: [width, height]
      description: >
        DOCX page dimensions in twips (twentieths of a point), mirroring
        `w:pgSz/@w:w` and `@w:h` (#509, ADR-077). All-or-nothing: width and
        height are both present or the whole object is absent — never a partial
        shape. US Letter is `{ width: 12240, height: 15840 }`.
      properties:
        width:
          type: integer
          minimum: 1
          description: Page width in twips (`w:pgSz/@w:w`).
        height:
          type: integer
          minimum: 1
          description: Page height in twips (`w:pgSz/@w:h`).
        orientation:
          type: string
          enum: [portrait, landscape]
          description: >
            Page orientation (`w:pgSz/@w:orient`). Absent unless the source
            declared exactly one of the two known values.

    StyleSource:
      type: object
      required: [templateId, templateName]
      properties:
        templateId:
          type: string
          format: uuid
        templateName:
          type: string

    RetainedTable:
      type: object
      required: [rows]
      description: >
        A DOCX table classified as hidden and retained out-of-band for future
        change-management (ADR-038). Rows are preserved as plain-text grids —
        no per-cell structure inference.
      properties:
        rows:
          type: array
          items:
            type: array
            items:
              type: string

    SpecSummary:
      type: object
      required: [specId, title, section]
      properties:
        specId:
          type: string
          format: uuid
        title:
          type: string
        section:
          type: string

    ParagraphDiff:
      type: object
      required: [uuid, text, index]
      properties:
        uuid:
          type: string
          format: uuid
          description: Synthesized UUID for a paragraph added outside known controls
        text:
          type: string
        index:
          type: integer
          minimum: 0
          description: Document-order index in the returned DOCX
        afterUuid:
          type: string
          format: uuid
          description: >
            Nearest preceding controlled-paragraph UUID in document order,
            omitted when the addition precedes every known control or sits in a
            table cell (which never anchors). Anchors where `/specs/{id}/merge`
            inserts this paragraph if the UUID is accepted; an addition with no
            anchor, or one whose anchor is a structural part/article/note node,
            cannot be applied (400).

    ModifiedDiff:
      type: object
      required: [uuid, base, theirs, ours]
      properties:
        uuid:
          type: string
          format: uuid
        base:
          type: string
          description: Base snapshot text
        theirs:
          type: string
          description: Returned DOCX text
        ours:
          type: string
          description: Current DB text

    DeleteConflictDiff:
      type: object
      required: [uuid, base, ours]
      description: >
        One base paragraph theirs deleted (#465) while ours also diverged
        from base since the snapshot was taken — a git-style delete/modify
        conflict (ADR-005) that would silently vanish the writer's edit if
        folded into a plain `deleted` uuid. Reported separately so the
        divergent edit is never lost without the caller knowing.


        Carries NO `theirs` key at all — not an empty-string sentinel, an
        outright omission — because there is nothing to fingerprint or carry:
        the paragraph is gone from the returned DOCX. Accepting a
        `deleteConflicts` entry via `/specs/{id}/merge` discards `ours` and
        applies the deletion, mirroring `diff.deleted`; omitting it keeps the
        divergent edit untouched.
      properties:
        uuid:
          type: string
          format: uuid
        base:
          type: string
          description: Base snapshot text
        ours:
          type: string
          description: Current DB text, diverged from base

    ObjectStructureFingerprint:
      type: object
      required: [kind, hash]
      description: >
        A text-blind, structure-sensitive summary of one body-level table/text
        box's OOXML shape (#520) — editing cell/paragraph text never changes
        it, but adding/removing a row, column, or nested element does.
      properties:
        kind:
          type: string
          enum: [table, textBox]
        rows:
          type: integer
          minimum: 0
          description: Table-only grid row count; absent for a textBox kind.
        columns:
          type: integer
          minimum: 0
          description: Table-only grid column count; absent for a textBox kind.
        hash:
          type: string
          description: Digest of the object's structural shape, opaque to clients.

    ObjectConflictDiff:
      type: object
      required: [objectId, affectedUuids, base]
      description: >
        One atomic structural conflict on a body-level table/text box —
        either a structural divergence (#520) or a whole-object deletion
        (#525). Reported once per object rather than leaking into
        per-child-paragraph noise; `affectedUuids` (the object's base-side
        interior child anchors) never also appear in
        `modified`/`deleted`/`conflicts` above. Detection-only — accepting
        `objectId` or any `affectedUuids` entry is always rejected 400; the
        table/text box must be resolved by hand.


        `theirs` PRESENT: the base-side object's structure diverges from the
        matching object in the returned DOCX — a row/column added or
        removed, a table/text-box kind change, etc (#520).


        `theirs` ABSENT: every one of the object's interior child anchors is
        missing from the returned DOCX entirely — the editor deleted the
        whole table/text box in Word, so there is no matching object left to
        fingerprint (#525). See
        docs/adr/089-whole-object-delete-detection.md.
      properties:
        objectId:
          type: string
          format: uuid
          description: The base-side object row's own id.
        affectedUuids:
          type: array
          items:
            type: string
            format: uuid
          description: The object's base-side interior child paragraph anchors.
        base:
          $ref: '#/components/schemas/ObjectStructureFingerprint'
        theirs:
          $ref: '#/components/schemas/ObjectStructureFingerprint'
          description: >
            Absent when the object was deleted whole in the returned DOCX
            (#525) — there is no matching object to fingerprint.

    DiffResult:
      type: object
      required:
        [added, modified, deleted, deleteConflicts, conflicts, objectConflicts, warnings]
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/ParagraphDiff'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/ModifiedDiff'
        deleted:
          type: array
          items:
            type: string
            format: uuid
        deleteConflicts:
          type: array
          description: >
            uuids present in base and absent from the returned DOCX (the same
            "missing from theirs" origin as `deleted` above — these are
            siblings), but where the current DB text also diverged from base
            since the snapshot was taken (#465): a delete/modify conflict,
            not a clean delete.
          items:
            $ref: '#/components/schemas/DeleteConflictDiff'
        conflicts:
          type: array
          description: Same shape as modified; present when ours and theirs both changed
          items:
            $ref: '#/components/schemas/ModifiedDiff'
        objectConflicts:
          type: array
          description: >
            Atomic structural conflicts on body-level tables/text boxes,
            including whole-object deletions (#520, #525). Never
            auto-mergeable — see ObjectConflictDiff.
          items:
            $ref: '#/components/schemas/ObjectConflictDiff'
        warnings:
          type: array
          items:
            type: string

    MergeRequest:
      type: object
      required: [accept, diff]
      additionalProperties: false
      properties:
        accept:
          type: array
          items:
            type: string
            format: uuid
          description: >
            UUIDs from `diff.modified`, `diff.conflicts`, `diff.added`,
            `diff.deleted`, or `diff.deleteConflicts` to apply.
        diff:
          $ref: '#/components/schemas/DiffResult'
        expectedVersion:
          type: integer
          minimum: 1
          description: >
            Optional optimistic-concurrency precondition (ADR-018) — the spec
            `contentVersion` the redline was diffed against. Stale → 409.
        actorLabel:
          $ref: '#/components/schemas/ActorLabel'

    LockState:
      type: object
      required: [holder, acquiredAt, expiresAt]
      description: An advisory soft lock on a spec (ADR-018 D2).
      properties:
        holder:
          type: string
          description: Caller identity label holding the lock.
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    MergeResult:
      type: object
      required: [applied, rejected]
      properties:
        applied:
          type: integer
          minimum: 0
          description: Number of paragraph rows changed
        rejected:
          type: integer
          minimum: 0
          description: Number of diff entries omitted from `accept`

    HistoryAnchor:
      description: >
        A spec content version, immutable package revision UUID, origin,
        current, or a `checkpoint:<uuid>`-prefixed checkpoint anchor
        (ADR-052 D3/D9, #380) — the prefix disambiguates it from an
        otherwise-identical bare revision UUID.
      oneOf:
        - type: integer
          minimum: 1
        - type: string
          enum: [origin, current]
        # Both string branches carry an explicit `pattern`: `format` is
        # annotation-only in many validators, so without one a bare
        # `format: uuid` branch matches every string — including `origin`
        # and `checkpoint:<uuid>` — and `oneOf` would reject them for
        # matching two branches at once.
        - type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        - type: string
          pattern: '^checkpoint:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

    ParagraphHistoryEntry:
      type: object
      required:
        [
          specId,
          custody,
          version,
          text,
          nodeType,
          op,
          contentVersion,
          snapshotAt,
          userId,
          actorLabel,
        ]
      properties:
        specId:
          type: string
          format: uuid
        custody:
          type: string
          enum: [origin, spec]
          description: '`origin` is a pre-derive master iteration; `spec` is the requested branch'
        version:
          type: integer
          minimum: 1
        text:
          type: string
        nodeType:
          type: string
          enum:
            [
              spec,
              part,
              article,
              pr1,
              pr2,
              pr3,
              pr4,
              pr5,
              pr6,
              pr7,
              note,
              continuation,
              object,
              objectText,
            ]
        op:
          type: string
          description: >
            Mirrors the `paragraph_versions.op` enum exactly (migrations
            046/055). `acknowledge`/`unacknowledge` and
            `close-comment`/`reopen-comment` are the ADR-079 follow-on
            readiness-clearance ops (#545) — each writes a history row, so a
            real history response can carry them.
          enum:
            [
              edit,
              insert,
              remove,
              restore,
              merge,
              accept-note,
              restructure,
              acknowledge,
              unacknowledge,
              close-comment,
              reopen-comment,
            ]
        contentVersion:
          type: [integer, 'null']
          minimum: 1
          description: Null only for legacy rows that predate complete capture
        snapshotAt:
          type: string
          format: date-time
        userId:
          type: [string, 'null']
          format: uuid
          description: >
            Actor who produced this row (ADR-052 D1/D6); null for a synthetic
            tip/derive-point entry or a pre-046 row with no attributed actor.
        actorLabel:
          type: [string, 'null']
          description: '`users.label` for `userId` — null exactly when userId is null.'

    ParagraphHistorySession:
      type: object
      required:
        [
          userId,
          firstVersion,
          lastVersion,
          beforeText,
          beforeNodeType,
          afterText,
          afterNodeType,
          startedAt,
          endedAt,
          sealedContentVersion,
          sealedByCheckpointId,
          entries,
        ]
      description: >
        A tier-1 coalesced read-time session (ADR-052 D3): consecutive tier-0
        edits by one actor, with no intervening foreign-actor entry, no gap
        exceeding the server's session window, and no crossed checkpoint
        boundary, folded into one session with a net before/after diff. A
        null-userId entry is always its own singleton session.
      properties:
        userId:
          type: [string, 'null']
          format: uuid
        firstVersion:
          type: integer
          minimum: 1
          description: Paragraph-local version of the session's first entry — display/ordering only.
        lastVersion:
          type: integer
          minimum: 1
          description: Paragraph-local version of the session's last entry — display/ordering only.
        beforeText:
          type: [string, 'null']
          description: Null iff the session's first entry is the paragraph's creation (op insert).
        beforeNodeType:
          type: [string, 'null']
        afterText:
          type: string
        afterNodeType:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        sealedContentVersion:
          type: [integer, 'null']
          minimum: 1
          description: >
            The session's last entry's contentVersion — the checkpoint join
            key. Null when that entry predates migration 046 ("never sealed").
        sealedByCheckpointId:
          type: [string, 'null']
          format: uuid
          description: >
            The checkpoint that sealed this session, or null when still
            pending or sealedContentVersion is null.
        entries:
          type: array
          description: The raw tier-0 span this session coalesces, oldest first.
          items:
            $ref: '#/components/schemas/ParagraphHistoryEntry'

    HistoryOperationCounts:
      type: object
      required: [edited, inserted, removed]
      properties:
        edited: { type: integer, minimum: 0 }
        inserted: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }

    SpecHistoryStep:
      type: object
      required: [contentVersion, at, ops]
      properties:
        contentVersion:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
        ops:
          $ref: '#/components/schemas/HistoryOperationCounts'

    SpecHistoryMilestone:
      oneOf:
        - type: object
          required: [kind, at, parentSpecId, originVersion]
          properties:
            kind: { type: string, const: origin }
            at: { type: string, format: date-time }
            parentSpecId: { type: [string, 'null'], format: uuid }
            originVersion: { type: integer, minimum: 1 }
        - type: object
          required: [kind, at, revisionId, packageId, label]
          properties:
            kind: { type: string, const: revision }
            at: { type: string, format: date-time }
            revisionId: { type: string, format: uuid }
            packageId: { type: string, format: uuid }
            label: { type: string }
        - type: object
          required: [kind, at, checkpointId, name, contentVersion]
          properties:
            kind: { type: string, const: checkpoint }
            at: { type: string, format: date-time }
            checkpointId: { type: string, format: uuid }
            name: { type: string }
            contentVersion: { type: integer, minimum: 1 }

    SpecHistory:
      type: object
      required: [specId, currentContentVersion, steps, milestones]
      properties:
        specId: { type: string, format: uuid }
        currentContentVersion: { type: integer, minimum: 1 }
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SpecHistoryStep'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/SpecHistoryMilestone'

    HistoryDiffEntry:
      type: object
      required: [nodeId, nodeType, beforeText, afterText]
      properties:
        nodeId: { type: string, format: uuid }
        nodeType: { type: string }
        beforeText: { type: [string, 'null'] }
        afterText: { type: [string, 'null'] }

    SpecHistoryDiff:
      type: object
      required: [specId, from, to, added, removed, modified]
      properties:
        specId: { type: string, format: uuid }
        from:
          $ref: '#/components/schemas/HistoryAnchor'
        to:
          $ref: '#/components/schemas/HistoryAnchor'
        added:
          type: array
          items:
            $ref: '#/components/schemas/HistoryDiffEntry'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/HistoryDiffEntry'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/HistoryDiffEntry'

    ContentVersionMap:
      type: object
      description: >
        `{ [specId]: contentVersion }`, snapshotted once at checkpoint
        creation (ADR-052 D3/D4) — a spec-scoped checkpoint's map has exactly
        one key; a project-scoped checkpoint's map has one key per spec that
        was in-scope at seal time.
      additionalProperties:
        type: integer
        minimum: 1

    Checkpoint:
      type: object
      required: [id, name, scope, scopeId, userId, contentVersionMap, createdAt]
      description: >
        A stored named marker sealing a spec (or every spec in a project) at
        its current content_version(s) — the Word "accept changes" moment
        (ADR-052 D3/D4). Never mutated after creation.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [spec, project] }
        scopeId:
          type: string
          format: uuid
          description: The sealed spec's or project's UUID, matching `scope`.
        userId:
          type: string
          format: uuid
          description: The sealing actor (ADR-052 D6) — always attributed, never null.
        contentVersionMap:
          $ref: '#/components/schemas/ContentVersionMap'
        createdAt:
          type: string
          format: date-time

    PendingActorRollup:
      type: object
      required: [userId, actorLabel, changedParagraphCount]
      description: One actor's share of a pending set — DISTINCT changed paragraphs, never raw op count.
      properties:
        userId:
          type: [string, 'null']
          format: uuid
          description: Null covers a legacy pre-046 row with no attributed user.
        actorLabel:
          type: string
        changedParagraphCount:
          type: integer
          minimum: 0

    SpecPendingSummary:
      type: object
      required:
        [
          specId,
          sealedByCheckpointId,
          sealedContentVersion,
          currentContentVersion,
          changedParagraphCount,
          actorRollup,
        ]
      description: >
        Everything a spec has accumulated since its last checkpoint — or its
        whole recorded history, if never checkpointed (ADR-052 D9).
      properties:
        specId: { type: string, format: uuid }
        sealedByCheckpointId: { type: [string, 'null'], format: uuid }
        sealedContentVersion: { type: [integer, 'null'], minimum: 1 }
        currentContentVersion: { type: integer, minimum: 1 }
        changedParagraphCount: { type: integer, minimum: 0 }
        actorRollup:
          type: array
          items:
            $ref: '#/components/schemas/PendingActorRollup'

    ProjectPendingSummary:
      type: object
      required:
        [projectId, packageId, changedSpecCount, changedParagraphCount, actorRollup, perSpec]
      description: >
        Everything every spec directly owned by a project (ADR-015 branch
        membership) has accumulated since ITS OWN last checkpoint (ADR-052 D9).
      properties:
        projectId: { type: string, format: uuid }
        packageId:
          type: [string, 'null']
          format: uuid
          description: Echoed back for the caller's own issuance-deadline framing — never scopes the query.
        changedSpecCount:
          type: integer
          minimum: 0
          description: Specs with at least one pending paragraph — not the project's total spec count.
        changedParagraphCount: { type: integer, minimum: 0 }
        actorRollup:
          type: array
          items:
            $ref: '#/components/schemas/PendingActorRollup'
        perSpec:
          type: array
          items:
            $ref: '#/components/schemas/SpecPendingSummary'

    LineageHop:
      type: object
      required: [specId, scope, name, contentVersion, originVersion, behindBy]
      description: >
        One node in the derivation chain. `originVersion` and `behindBy` are null
        on the root (it has no parent to drift behind).
      properties:
        specId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [library, project]
          description: Whether this spec lives in a library or a project
        name:
          type: string
          description: Library or project name that owns this spec
        contentVersion:
          type: integer
          description: Current edit generation of this spec
        originVersion:
          type: [integer, 'null']
          description: Content version of the parent this spec was cloned from; null on root
        behindBy:
          type: [integer, 'null']
          description: >
            Parent's current contentVersion minus this copy's originVersion —
            how many parent edits this copy has not yet seen; null on root

    SpecLineage:
      type: object
      required: [chain, originMeta]
      properties:
        chain:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineageHop'
          description: >
            Derivation chain, leaf-first. `chain[0]` is the requested spec;
            the last entry is the root library master.
        originMeta:
          description: >
            Ingest provenance of the chain root (filename, sha256, loader);
            null when the root was not file-ingested.
          oneOf:
            - type: object
              required: [filename, sha256, loader]
              properties:
                filename:
                  type: string
                # Fixed-length, server-generated hex digest, response-only —
                # excluded from the ADR-091 code-point-length convention on
                # reachability, not alphabet (see UNDOCUMENTED_BOUND_EXEMPTIONS,
                # src/api/length-limit-unit-convention.test.ts).
                sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                loader:
                  type: string
            - type: 'null'

    DivisionGeneralSpecRef:
      type: object
      required: [specId, section, title]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
        title:
          type: string

    DivisionGeneralCandidate:
      allOf:
        - $ref: '#/components/schemas/DivisionGeneralSpecRef'
        - type: object
          required: [rank, reason, confidence]
          properties:
            rank:
              type: integer
              minimum: 1
            reason:
              type: string
              enum: [title_keyword, first_in_division]
              description: Why this spec is listed as an advisory fallback candidate
            confidence:
              type: string
              enum: [medium, low]

    DivisionGeneralSpecResult:
      type: object
      required:
        - scope
        - ownerId
        - division
        - expectedSection
        - status
        - generalSpec
        - detectionMethod
        - notes
        - message
        - candidates
      properties:
        scope:
          type: string
          enum: [library, project]
        ownerId:
          type: string
          format: uuid
        division:
          type: string
          pattern: '^\d{2}$'
        expectedSection:
          type: string
          description: Exact section number that would be assigned automatically, e.g. "27 00 00"
        status:
          type: string
          enum: [resolved, missing, not_applicable]
        generalSpec:
          oneOf:
            - $ref: '#/components/schemas/DivisionGeneralSpecRef'
            - type: 'null'
        detectionMethod:
          type: [string, 'null']
          enum: [exact_section, manual, null]
        notes:
          type: [string, 'null']
        message:
          type: string
        candidates:
          type: array
          description: Advisory only; never treated as inherited until manually selected
          items:
            $ref: '#/components/schemas/DivisionGeneralCandidate'

    SetDivisionGeneralSpecBody:
      description: 'Provide exactly one of `generalSpecId` or `status: not_applicable`.'
      oneOf:
        - type: object
          required: [generalSpecId]
          additionalProperties: false
          properties:
            generalSpecId:
              type: string
              format: uuid
              description: Same-scope spec in the requested division to use as the general spec
            notes:
              type: string
              minLength: 1
        - type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [not_applicable]
              description: Records that no in-scope general requirements spec is issued here
            notes:
              type: string
              minLength: 1

    # ── Projects ───────────────────────────────────────────────────────────────

    ProjectListItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ClientSummary:
      type: object
      required: [id, name, libraryId, sectionNumberFormat, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        libraryId:
          type: [string, 'null']
          format: uuid
          description: The client's client-tier master library (a link, not a merge), or null
        sectionNumberFormat:
          type: string
          enum: [canonical, dots, compact, spaced-compact]
          description: Firm-tier default used when an associated project has no override
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, label, createdAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Case-sensitive, exact-match actor identity (ADR-052 D6)
        createdAt:
          type: string
          format: date-time

    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/ClientSummary'
        - type: object
          required: [projects]
          properties:
            projects:
              type: array
              description: The client's associated active projects
              items:
                $ref: '#/components/schemas/ProjectSummary'

    ProjectSummary:
      type: object
      required: [projectId, name, description, clientId, clientName, sources]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        clientId:
          type: [string, 'null']
          format: uuid
          description: Associated client (ADR-054), or null when the project has no client
        clientName:
          type: [string, 'null']
          description: Associated client's name (denormalized for lists), or null
        sources:
          type: array
          description: Ordered source libraries (priority ascending)
          items:
            type: object
            required: [libraryId, name, tier, priority]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string
              tier:
                type: string
                enum: [company, client]
              priority:
                type: integer
                minimum: 1

    ProjectWithToc:
      type: object
      required:
        [projectId, name, description, sources, toc, deletedAt, deletedBy, sectionNumberFormat]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        sources:
          type: array
          description: Ordered source libraries (priority ascending)
          items:
            type: object
            required: [libraryId, name, tier, priority]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string
              tier:
                type: string
                enum: [company, client]
              priority:
                type: integer
                minimum: 1
        toc:
          type: array
          items:
            type: object
            required: [specId, section, title, position]
            properties:
              specId:
                type: string
                format: uuid
              section:
                type: string
              title:
                type: string
              position:
                type: integer
                description: 1-based TOC ordering
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: >
            Soft-delete tombstone (ADR-031). `null` on an active project; an
            ISO-8601 timestamp once soft-deleted.
        deletedBy:
          type: [string, 'null']
          description: >
            Caller-supplied actor that soft-deleted the project (ADR-031). `null`
            while active.
        sectionNumberFormat:
          type: string
          enum: [canonical, dots, compact, spaced-compact]
          description: >
            Effective section-number display format for generate requests: the
            project override, then its client's firm default, then `canonical`
            ("09 91 00").

    BrokenRef:
      type: object
      required:
        [
          refId,
          sourceSpecId,
          sourceSpecSection,
          sourceParagraphId,
          snippet,
          targetSpecSection,
          referenceText,
          availableFrom,
        ]
      properties:
        refId:
          type: string
          format: uuid
        sourceSpecId:
          type: string
          format: uuid
        sourceSpecSection:
          type: string
          description: CSI section number of the spec containing the reference
        sourceParagraphId:
          type: string
          format: uuid
          description: Paragraph the reference sits in — the paragraph-level locator
        snippet:
          type: string
          description: Short excerpt of that paragraph, centred on the matched reference
        targetSpecSection:
          type: [string, 'null']
          description: Section number the reference points at (as written in the source document)
        referenceText:
          type: string
        availableFrom:
          type: array
          description: >
            Project source libraries that hold the missing target section — an
            actionable "add this section" advisory. Priority order.
          items:
            type: object
            required: [libraryId, name]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string

    OutboundReference:
      type: object
      required:
        [
          sourceSpecId,
          sourceParagraphId,
          referenceText,
          targetSection,
          targetSpecId,
          isResolved,
          isBroken,
        ]
      properties:
        sourceSpecId:
          type: string
          format: uuid
        sourceParagraphId:
          type: string
          format: uuid
          description: Paragraph the reference sits in — the paragraph-level locator
        referenceText:
          type: string
        targetSection:
          type: [string, 'null']
          description: Section number this reference points at, if the reference targets a section
        targetSpecId:
          type: [string, 'null']
          format: uuid
        isResolved:
          type: boolean
        isBroken:
          type: boolean

    InboundReference:
      type: object
      required:
        [
          sourceSpecId,
          sourceSection,
          sourceTitle,
          sourceParagraphId,
          referenceText,
          isResolved,
          isBroken,
        ]
      properties:
        sourceSpecId:
          type: string
          format: uuid
        sourceSection:
          type: string
          description: CSI section number of the spec containing the reference
        sourceTitle:
          type: string
        sourceParagraphId:
          type: string
          format: uuid
        referenceText:
          type: string
        isResolved:
          type: boolean
        isBroken:
          type: boolean

    # ── Packages ───────────────────────────────────────────────────────────────

    PackageSummary:
      type: object
      required: [packageId, projectId, name, position]
      properties:
        packageId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          description: 1-based order of the package within its project

    PackageSpecEntry:
      type: object
      required: [specId, section, title, position]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
        title:
          type: string
        position:
          type: integer
          description: 1-based order of the spec within the package

    PackageWithSpecs:
      allOf:
        - $ref: '#/components/schemas/PackageSummary'
        - type: object
          required: [specs]
          properties:
            specs:
              type: array
              items:
                $ref: '#/components/schemas/PackageSpecEntry'

    RevisionAttributes:
      type: object
      description: >
        Open JSONB attributes for a profile-defined revision type. Known common
        keys include `number`, `title`, and `phase`; unknown keys are preserved.
      additionalProperties: true
      properties:
        number:
          oneOf:
            - type: string
            - type: number
        title:
          type: string
        phase:
          type: string

    CreateRevisionLegacyBody:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          description: Legacy freeform label; still accepted for backward compatibility

    CreateRevisionStructuredBody:
      type: object
      required: [type]
      properties:
        type:
          type: string
          minLength: 1
          description: String key defined by the resolved revision nomenclature profile
        date:
          type: string
          format: date
        sortOrder:
          type: integer
          minimum: 1
        attributes:
          $ref: '#/components/schemas/RevisionAttributes'
        parentRevisionId:
          type: string
          format: uuid
          description: >
            UUID of the revision this one was issued from (ADR-066 custody).
            Must belong to the same package and itself be a root revision —
            nesting depth cannot exceed 1. Omit for a root revision.
        baseRevisionId:
          type: string
          format: uuid
          description: >
            UUID of the revision used as the immutable addendum comparison
            base (ADR-066). Must belong to the same package. Omit when this
            issuance has no stored comparison lineage.
        mode:
          $ref: '#/components/schemas/IssuanceMode'
        overrideReadinessGate:
          type: boolean
          description: >
            Unaudited escape hatch (ADR-079 decision 8, #406): `true` lets a
            `mode: 'final'` issuance through even with outstanding
            ReadinessFinding entries. Ignored unless `mode` is `final`. Only
            the structured body accepts this — the legacy `{ label }` body
            stays `.strict()`, so a stray `mode`/`overrideReadinessGate` on it
            fails closed with a 422 (unrecognized-key validation failure),
            never a silently-ignored field.

    RevisionSummary:
      type: object
      required:
        [
          revisionId,
          packageId,
          label,
          displayName,
          type,
          date,
          sortOrder,
          number,
          attributes,
          issuedAt,
          specCount,
          parentRevisionId,
          baseRevisionId,
        ]
      properties:
        revisionId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        label:
          type: string
          description: Backward-compatible display label, unique per package
        displayName:
          type: string
          description: Profile-rendered display name; #102 consumes this directly
        type:
          type: string
          description: Profile-defined revision type key
        date:
          type: string
          format: date
        sortOrder:
          type: integer
          minimum: 1
          description: Queryable ordering key within the package
        number:
          type: [string, 'null']
          description: Profile-rendered revision number, or null when not applicable
        attributes:
          $ref: '#/components/schemas/RevisionAttributes'
        issuedAt:
          type: string
          format: date-time
        specCount:
          type: integer
          description: Number of member sections frozen in this revision
        parentRevisionId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the revision this one was issued from (ADR-066 custody),
            or null for a root revision.
        baseRevisionId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the revision this issuance is compared against for
            addendum generation (ADR-066), or null when no base was recorded.

    RevisionSpecEntry:
      type: object
      required: [specId, position, tree]
      properties:
        specId:
          type: string
          format: uuid
        position:
          type: integer
          description: 1-based membership order at issuance
        tree:
          $ref: '#/components/schemas/SpecTree'

    RevisionWithTrees:
      type: object
      required:
        [
          revisionId,
          packageId,
          label,
          displayName,
          type,
          date,
          sortOrder,
          number,
          attributes,
          issuedAt,
          specs,
          parentRevisionId,
          baseRevisionId,
        ]
      properties:
        revisionId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        label:
          type: string
        displayName:
          type: string
        type:
          type: string
        date:
          type: string
          format: date
        sortOrder:
          type: integer
          minimum: 1
        number:
          type: [string, 'null']
        attributes:
          $ref: '#/components/schemas/RevisionAttributes'
        issuedAt:
          type: string
          format: date-time
        specs:
          type: array
          items:
            $ref: '#/components/schemas/RevisionSpecEntry'
        parentRevisionId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the revision this one was issued from (ADR-066 custody),
            or null for a root revision.
        baseRevisionId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the revision this issuance is compared against for
            addendum generation (ADR-066), or null when no base was recorded.

    # ── Templates ──────────────────────────────────────────────────────────────

    StyleNodeType:
      type: string
      enum: [part, article, pr1, pr2, pr3, pr4, pr5, pr6, pr7]
      description: >
        CSI paragraph role. Maps to the nine generator levels: `part` (PART 1 –
        GENERAL), `article` (1.1 REFERENCES), `pr1`–`pr7` (A. / 1. / a. / 1) /
        a), then repeated 1) / a) paragraph tiers).

    StyleRule:
      type: object
      required: [nodeType, properties]
      properties:
        nodeType:
          $ref: '#/components/schemas/StyleNodeType'
        properties:
          $ref: '#/components/schemas/StyleProperties'

    StyleProperties:
      type: object
      description: >
        OOXML-derived style properties for a CSI paragraph role. Recognized keys
        are documented below; **unknown OOXML keys are preserved** via the JSONB
        catchall schema. All sub-objects also accept additional OOXML properties.
      properties:
        rPr:
          type: object
          description: Run (character) properties
          properties:
            rFonts:
              type: object
              description: Font references
              properties:
                ascii:
                  type: string
                hAnsi:
                  type: string
                cs:
                  type: string
                eastAsia:
                  type: string
              additionalProperties: true
            sz:
              type: integer
              description: Font size in half-points (e.g. 20 = 10 pt)
            b:
              type: boolean
              description: Bold
            i:
              type: boolean
              description: Italic
            caps:
              type: boolean
              description: All-caps
            smallCaps:
              type: boolean
            u:
              type: string
              description: Underline type (e.g. "single")
            strike:
              type: boolean
            color:
              type: string
              description: 'RRGGBB hex or "auto" (e.g. "FF0000")'
            highlight:
              type: string
          additionalProperties: true
        pPr:
          type: object
          description: Paragraph properties
          properties:
            spacing:
              type: object
              properties:
                before:
                  type: integer
                  description: Space before in twips
                after:
                  type: integer
                  description: Space after in twips
                line:
                  type: integer
                  description: Line spacing value in twips
                lineRule:
                  type: string
                  enum: [auto, exact, atLeast]
                contextualSpacing:
                  type: boolean
              additionalProperties: true
            ind:
              type: object
              description: Indentation (twips)
              properties:
                left:
                  type: integer
                right:
                  type: integer
                firstLine:
                  type: integer
                hanging:
                  type: integer
              additionalProperties: true
            jc:
              type: string
              enum: [left, center, right, both, distribute, start, end]
          additionalProperties: true
        numbering:
          type: object
          description: Numbering definition (from `numbering.xml` level)
          properties:
            ilvl:
              type: integer
            numFmt:
              type: string
            lvlText:
              type: string
            start:
              type: integer
          additionalProperties: true
      additionalProperties: true

    TemplateMeta:
      type: object
      required: [id, name, owner, libraryId, createdAt]
      description: Template identity and metadata without style rules
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique template name
        owner:
          type: [string, 'null']
          description: Firm / owner label, or null if not provided
        libraryId:
          type: [string, 'null']
          format: uuid
          description: >
            Owning library (#318). `null` = a built-in / global template (the
            seeded default, plus templates that predate library scoping).
            Onboarded templates are created with the spec's own `library_id`,
            not `null`. A library-scoped template can only be assigned to a spec
            in that same library.
        createdAt:
          type: string
          format: date-time

    Template:
      allOf:
        - $ref: '#/components/schemas/TemplateMeta'
        - type: object
          required: [rules]
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/StyleRule'
              description: One rule per styleable NodeType (9 max)

    DerivationReport:
      type: object
      required: [nodeTypes, skippedNodeTypes, vanishSkipped]
      description: >
        Per-NodeType derivation audit trail returned alongside the template. Use
        this to review confidence levels, intent disagreements, and rejected
        outlier values before accepting the template as authoritative.
      properties:
        nodeTypes:
          type: array
          items:
            $ref: '#/components/schemas/NodeTypeReport'
          description: Report for each NodeType that had at least one paragraph
        skippedNodeTypes:
          type: array
          items:
            $ref: '#/components/schemas/StyleNodeType'
          description: NodeTypes with zero paragraphs in the source document
        vanishSkipped:
          type: integer
          description: >
            Count of `w:vanish` (hidden) paragraphs excluded from derivation.
            Hidden paragraphs are editorial instructions, not layout specimens.

    NodeTypeReport:
      type: object
      required: [nodeType, paragraphCount, styledCount, modalStyleId, decisions]
      properties:
        nodeType:
          $ref: '#/components/schemas/StyleNodeType'
        paragraphCount:
          type: integer
          description: Total non-vanish paragraphs for this NodeType
        styledCount:
          type: integer
          description: Paragraphs that carried a recognised Word style ID
        modalStyleId:
          type: [string, 'null']
          description: >
            Most-common Word style ID among voters. Used as the **intent**
            reference in §5 consensus derivation: when no majority exists,
            the modal style's own property value is preferred over the median.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/PropertyDecision'
          description: One decision per derived OOXML property path

    PropertyDecision:
      type: object
      required: [path, value, source, confidence, disagreesWithIntent, rejected]
      description: >
        Decision record for a single OOXML property (e.g. `rPr.sz`, `pPr.ind.left`).
      properties:
        path:
          type: string
          description: Dotted OOXML leaf path (e.g. "rPr.b", "pPr.ind.left")
        value:
          description: Chosen property value
        source:
          type: string
          enum: [consensus, intent, median, single, mode]
          description: >
            Algorithm branch that produced this value.
            `consensus` — strict majority (>50%) agreed.
            `intent` — no majority; modal style's own value used as tie-breaker.
            `median` — no majority, no intent, numeric values; lower-middle median chosen.
            `single` — only one styled paragraph for this NodeType.
            `mode` — low-plurality non-numeric fallback (first-seen tie-break).
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of styled voters that agreed on the chosen value
        disagreesWithIntent:
          type: boolean
          description: >
            True when `source` is not `intent` but the modal style's value differs
            from the chosen value. Flag for human review.
        rejected:
          type: array
          description: Alternate values that were not chosen
          items:
            type: object
            required: [value, count]
            properties:
              value:
                description: The rejected property value
              count:
                type: integer
                description: Number of voters that carried this value

    # ── Editability classification (ADR-022) ────────────────────────────────────

    SpecNodeEditability:
      type: object
      required: [value, confidence, evidence]
      properties:
        value:
          type: string
          enum: [locked, editable, choice, note]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
        override:
          type: string
          enum: [locked, editable, choice, note]

    ReclassifyReport:
      type: object
      required: [specId, persisted, total, changed, entries]
      properties:
        specId:
          type: string
          format: uuid
        persisted:
          type: boolean
          description: false on a preview pass (diff computed, nothing written).
        total:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
          description: Entries whose machine value changed from before to after.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EditabilityDiffEntry'

    EditabilityDiffEntry:
      type: object
      required: [nodeId, before, after, overrideDisagrees]
      properties:
        nodeId:
          type: string
          format: uuid
        before:
          oneOf:
            - type: string
              enum: [locked, editable, choice, note]
            - type: 'null'
          description: Machine classification before this pass (null = was unclassified).
        after:
          type: string
          enum: [locked, editable, choice, note]
        overrideDisagrees:
          type: boolean
          description: A standing human override now differs from the fresh machine verdict.

    # ── Editing conventions (ADR-022 O-10) ──────────────────────────────────────

    ConventionRules:
      type: object
      description: >
        Open editing-convention ruleset. The named keys below are recognised;
        unknown keys are preserved verbatim (round-trip). `noteBanners` are
        user-supplied regex SOURCES bounded for safety at the write boundary.
      additionalProperties: true
      properties:
        colorMeanings:
          type: array
          items:
            type: object
            additionalProperties: true
        highlightMeanings:
          type: array
          description: >-
            Per-highlight-color editability meanings. Matching is case-insensitive;
            the built-in profile maps yellow to choice.
          items:
            type: object
            required: [color, meaning]
            additionalProperties: true
            properties:
              color: { type: string }
              meaning: { $ref: '#/components/schemas/EditabilityValue' }
        choiceTokens:
