openapi: 3.1.0
info:
  title: SpecR API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Headless REST API for CSI® MasterFormat®-compatible specification document
    automation with round-trip DOCX support. Independent project; not affiliated
    with CSI.

# No authentication yet — auth lands with Phase 5f (#43). The explicit empty
# security array documents that every endpoint is currently unauthenticated.
security: []

servers:
  - url: http://localhost:3000
    description: Local development server

# ─── Paths ────────────────────────────────────────────────────────────────────

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [system]
      responses:
        '200':
          description: Server is alive and the database is reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [db, uptime]
                        properties:
                          db:
                            type: string
                            description: Database connectivity state ("connected")
                          uptime:
                            type: integer
                            description: Process uptime in whole seconds
        '503':
          description: 'Database unavailable — `{success: false, error: "database unavailable"}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /parse:
    post:
      operationId: parseDocument
      summary: Upload and parse a spec document (async)
      description: >
        Upload a `.docx`, `.sec`, or `.txt` file. Returns 202 immediately with a
        `jobId`; poll `/parse/jobs/{jobId}` for progress and result. Rate-limited
        to 10 requests per IP per minute.
      tags: [parse]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Spec document (.docx, .sec, or .txt). Max 10 MB.
                section:
                  type: string
                  description: Override the detected CSI section number (e.g. "09 91 26").
                title:
                  type: string
                  description: Override the detected section title.
      responses:
        '202':
          description: Parse job accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [jobId]
                        properties:
                          jobId:
                            type: string
                            format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /parse/jobs/{jobId}:
    get:
      operationId: getParseJob
      summary: Poll parse job progress
      tags: [parse]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ParseJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}:
    get:
      operationId: getSpec
      summary: Retrieve a spec with its full paragraph tree
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Spec with paragraph tree
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecTree'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateSpec
      summary: Update spec metadata
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                section:
                  type: string
                  description: CSI section number (e.g. "09 91 26").
                title:
                  type: string
      responses:
        '200':
          description: Updated spec summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/lineage:
    get:
      operationId: getSpecLineage
      summary: Chain of custody for a spec
      description: >
        Walks `parent_spec_id` from the requested spec to the root library master,
        returning every hop in leaf-first order (`chain[0]` = the requested spec,
        last entry = the root).


        `behindBy` for each hop = the parent's current `contentVersion` minus this
        copy's `originVersion` (the version it was cloned from); null on the root
        because the root has no parent to drift behind.


        `originMeta` is the root's ingest provenance (`filename`, `sha256`, `loader`)
        when the root was file-ingested; null otherwise.
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      responses:
        '200':
          description: Custody chain from requested spec to root
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SpecLineage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /specs/{id}/generate:
    post:
      operationId: generateDocx
      summary: Generate a DOCX from a stored spec AST
      tags: [specs]
      parameters:
        - $ref: '#/components/parameters/SpecId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  format: uuid
                  description: >
                    Style template to apply (font, spacing, indent, numbering format).
                    Omitted → the seeded UFGS-Default template is applied; if that template
                    is absent (un-migrated database) the response is still 200 with an
                    unstyled DOCX. Unknown id → 404.
                sectionNumberFormat:
                  type: string
                  enum: [canonical, dots, compact]
                  default: canonical
                  description: >
                    Presentation format for generated section numbers in the synthetic
                    DOCX title and confidently identified Section references in paragraph
                    text. Canonical emits "09 91 00", dots emits "09.91.00", and compact
                    emits "099100". Stored AST and database values remain canonical.
            examples:
              dotted-section-numbers:
                value:
                  sectionNumberFormat: dots
      responses:
        '200':
          description: DOCX file stream
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects:
    get:
      operationId: listProjects
      summary: List projects
      tags: [projects]
      responses:
        '200':
          description: Projects ordered by name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectListItem'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sourceLibraryIds]
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  minLength: 1
                sourceLibraryIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                  description: >
                    Ordered source list — priority = array order (1-based). Each must be a
                    company- or client-tier library (ADR-015 D3); no duplicates. Section
                    resolution for POST /projects/{id}/specs walks this list.
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 'Validation failed, unknown library, or reference-tier source'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}:
    get:
      operationId: getProject
      summary: Retrieve a project with its TOC
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project with TOC
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectWithToc'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      operationId: patchProject
      summary: Update project settings
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                sectionNumberFormat:
                  type: string
                  enum: [canonical, dots, compact]
                  description: Project default presentation format for section numbers
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /libraries/{libraryId}/divisions/{division}/general-spec:
    get:
      operationId: getLibraryDivisionGeneralSpec
      summary: Get division general-spec status for a library
      description: >
        Returns the confirmed division-general spec when one exists. Only an exact
        `NN 00 00` section is assigned automatically. If no exact section exists,
        the response is `status: missing` and fallback matches are returned as
        advisory candidates only.
      tags: [libraries]
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Division'
      responses:
        '200':
          description: Division general-spec status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DivisionGeneralSpecResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: setLibraryDivisionGeneralSpec
      summary: Manually set a library division general spec
      description: >
        Assigns a same-library spec in the requested division as the division
        general spec, or records that this division has no in-scope general
        requirements spec.
      tags: [libraries]
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Division'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDivisionGeneralSpecBody'
      responses:
        '200':
          description: Manual division-general decision stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DivisionGeneralSpecResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/divisions/{division}/general-spec:
    get:
      operationId: getProjectDivisionGeneralSpec
      summary: Get division general-spec status for a project
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Division'
      responses:
        '200':
          description: Division general-spec status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DivisionGeneralSpecResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: setProjectDivisionGeneralSpec
      summary: Manually set a project division general spec
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Division'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDivisionGeneralSpecBody'
      responses:
        '200':
          description: Manual division-general decision stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DivisionGeneralSpecResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/specs:
    post:
      operationId: addSectionToProject
      summary: Add a section to a project TOC (copy-on-derive clone)
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section]
              properties:
                section:
                  type: string
                  pattern: '^\d{2} \d{2} \d{2}(\.\d{2}( \d{2})?)?$'
                  description: CSI section number (expanded shape, ADR-020)
      responses:
        '201':
          description: Section cloned into project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [specId, section, position, source]
                        properties:
                          specId:
                            type: string
                            format: uuid
                            description: The project-owned clone's id (not the master's)
                          section:
                            type: string
                          position:
                            type: integer
                            description: 1-based TOC position assigned to the section
                          source:
                            type: object
                            required: [libraryId, name]
                            properties:
                              libraryId:
                                type: string
                                format: uuid
                              name:
                                type: string
                          shadowed:
                            type: array
                            description: Lower-priority sources that also hold this section
                            items:
                              type: object
                              required: [libraryId, name]
                              properties:
                                libraryId:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Section already in project'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Malformed section number, or no source library holds the section'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/specs/{specId}:
    delete:
      operationId: removeSectionFromProject
      summary: Remove a project-owned section copy (blocked if edited, unless force)
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: specId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Delete the copy even if it has project edits (content_version > 1)
      responses:
        '200':
          description: Section copy removed (dangling cross-references marked broken)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [projectId, specId]
                        properties:
                          projectId:
                            type: string
                            format: uuid
                          specId:
                            type: string
                            format: uuid
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Section has project edits (repeat with ?force=true) or belongs to a design package'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/specs/{specId}/references:
    get:
      operationId: getOutboundReferences
      summary: List cross-references emitted by a project spec
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: specId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project-scoped outbound reference list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [projectId, specId, references]
                        properties:
                          projectId:
                            type: string
                            format: uuid
                          specId:
                            type: string
                            format: uuid
                          references:
                            type: array
                            items:
                              $ref: '#/components/schemas/OutboundReference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/references/broken:
    get:
      operationId: getBrokenRefs
      summary: List broken cross-references in a project
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Broken cross-reference list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BrokenRef'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/references/inbound:
    get:
      operationId: getInboundReferences
      summary: List project specs that reference a section
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: section
          in: query
          required: true
          schema:
            type: string
          description: CSI section number, URL-encoded when it contains spaces
      responses:
        '200':
          description: Project-scoped inbound reference list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [projectId, section, references]
                        properties:
                          projectId:
                            type: string
                            format: uuid
                          section:
                            type: string
                          references:
                            type: array
                            items:
                              $ref: '#/components/schemas/InboundReference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}/packages:
    post:
      operationId: createPackage
      summary: Create a design package (named, ordered subset of the project TOC)
      tags: [packages]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Package created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/PackageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Package name already exists in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listPackages
      summary: List a project's design packages with ordered membership
      tags: [packages]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Package list with spec membership
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PackageWithSpecs'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{id}/specs:
    put:
      operationId: setPackageSpecs
      summary: Replace a package's ordered spec membership
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Package UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specIds]
              properties:
                specIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                  description: >
                    Ordered list of spec UUIDs to assign to this package. Position
                    within the package equals array order (1-based). An empty array
                    clears the package. All specs must belong to the package's own
                    project TOC (ADR-015 D4).
      responses:
        '200':
          description: Package membership replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [packageId, specs]
                        properties:
                          packageId:
                            type: string
                            format: uuid
                          specs:
                            type: array
                            items:
                              $ref: '#/components/schemas/PackageSpecEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: "Validation failed, or a spec is not in the package's project TOC"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{id}:
    delete:
      operationId: deletePackage
      summary: Delete a design package (membership rows cascade; specs survive)
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Package UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Package deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [packageId]
                        properties:
                          packageId:
                            type: string
                            format: uuid
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{id}/revisions:
    post:
      operationId: createPackageRevision
      summary: Issue an immutable revision snapshot of a package (ADR-015 D5)
      description: >
        Freezes the full SpecTree of every member section as JSONB inside one
        transaction — a reproducible point-in-time record of exactly what was
        issued. Post-issuance edits never alter the stored trees.
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Package UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  minLength: 1
                  description: Issuance label, unique per package
      responses:
        '201':
          description: Revision issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RevisionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision label already exists for this package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed, or a member tree cannot be snapshotted losslessly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /revisions/{id}:
    get:
      operationId: getRevision
      summary: Read an issued revision's frozen trees (validated on read)
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Revision UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Frozen trees in membership order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RevisionWithTrees'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates:
    post:
      operationId: createTemplate
      summary: Create a style template (no rules)
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Unique template name
                owner:
                  type: string
                  minLength: 1
                  description: Optional firm / owner label
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TemplateMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listTemplates
      summary: List all style templates (metadata only, no rules)
      tags: [templates]
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemplateMeta'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}:
    get:
      operationId: getTemplate
      summary: Retrieve a style template with its rules
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template with rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: patchTemplate
      summary: Update template metadata (name and/or owner)
      description: >
        At least one of `name` or `owner` must be present. Pass `owner: null`
        to clear the owner field.
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                owner:
                  type: [string, 'null']
                  minLength: 1
                  description: Pass null to clear the owner
      responses:
        '200':
          description: Updated template metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TemplateMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteTemplate
      summary: Delete a style template and all its rules
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Template deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}/rules:
    post:
      operationId: upsertTemplateRules
      summary: Bulk-upsert style rules for a template (transactional)
      description: >
        Replace (or add) rules for the given NodeTypes atomically. Existing rules
        for NodeTypes not in the request are left unchanged. All rules are
        validated before any write — one invalid rule rolls back all changes.
        Unknown OOXML property keys are preserved in `properties` (JSONB catchall).
      tags: [templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/StyleRule'
      responses:
        '200':
          description: Template with updated rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/import:
    post:
      operationId: importTemplate
      summary: Derive a firm style template from a source-of-truth DOCX
      description: >
        Upload a `.docx` file to derive a reusable firm style template via
        per-NodeType consensus derivation (mode/median, consistency-wins-else-intent
        per §5 of the style fidelity program). Returns the persisted template and
        a `DerivationReport` for review.


        The raw DOCX is never stored — only the derived JSONB style definition is
        persisted (ADR-021). Unknown OOXML property keys are preserved in the
        `properties` object.


        **Theme-font caveat:** `asciiTheme` references are not yet resolved
        (issue #149). Documents that use theme fonts will derive without a
        concrete font family until theme-font support lands.


        Rate-limited to 10 requests per IP per minute (shared with `POST /parse`).
      tags: [templates]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                  description: Source-of-truth `.docx` file. Max 10 MB.
                name:
                  type: string
                  minLength: 1
                  description: Unique template name (used as the lookup key).
                owner:
                  type: string
                  minLength: 1
                  description: >
                    Optional firm / owner label (e.g. "ACME Architects"). Stored
                    as metadata only; has no effect on derivation.
      responses:
        '201':
          description: Template derived and persisted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [template, report]
                        properties:
                          template:
                            $ref: '#/components/schemas/Template'
                          report:
                            $ref: '#/components/schemas/DerivationReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ─── Components ───────────────────────────────────────────────────────────────

components:
  parameters:
    SpecId:
      name: id
      in: path
      required: true
      description: Spec UUID
      schema:
        type: string
        format: uuid
    ProjectId:
      name: id
      in: path
      required: true
      description: Project UUID
      schema:
        type: string
        format: uuid
    LibraryId:
      name: libraryId
      in: path
      required: true
      description: Library UUID
      schema:
        type: string
        format: uuid
    Division:
      name: division
      in: path
      required: true
      description: Two-digit division number
      schema:
        type: string
        pattern: '^\d{2}$'
    TemplateId:
      name: id
      in: path
      required: true
      description: Template UUID
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request — validation error or unsupported file type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict — a resource with that identity already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Unprocessable — file parsed but semantically unusable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: >
        Rate limit exceeded (10 uploads per IP per minute) —
        `{success: false, error: "too many requests — please wait before uploading again"}`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── Envelope shapes ────────────────────────────────────────────────────────

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

    # ── Parse ──────────────────────────────────────────────────────────────────

    ParseStage:
      type: string
      enum:
        - queued
        - running
        - extracting
        - numbering
        - styles
        - document
        - classifying
        - persisting
        - complete
        - failed

    ParseJob:
      type: object
      required: [jobId, status, progress, expiresAt]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ParseStage'
          description: >
            Overall job state. In practice takes `queued`, `running`, `complete`,
            or `failed`; the fine-grained pipeline step lives in `progress.stage`.
        progress:
          type: object
          required: [stage, pct]
          properties:
            stage:
              $ref: '#/components/schemas/ParseStage'
              description: Current pipeline step
            pct:
              type: number
              minimum: 0
              maximum: 100
        result:
          $ref: '#/components/schemas/ParseJobResult'
          description: Present once status is `complete`
        error:
          type: string
          description: Present once status is `failed`
        expiresAt:
          type: integer
          description: Job record expiry as a Unix epoch timestamp in milliseconds

    ParseJobResult:
      type: object
      required: [specId, section, title, nodeCount]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
          description: CSI section number, or "unknown" if not detected
        title:
          type: string
        nodeCount:
          type: integer
          description: Total nodes in the persisted paragraph tree
        capabilities:
          type: array
          items:
            type: string
          description: 'Parser capability flags (e.g. "read-only", "parse-warnings")'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'

    ParseWarning:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [root-continuation, empty-part, no-structure-found, unusual-part-count]
        lineHint:
          type: string
          description: 'Source location hint (e.g. "line 12: <text>")'
        suggestion:
          type: string

    # ── Specs ──────────────────────────────────────────────────────────────────

    SignalConflict:
      type: object
      required: [signal, reportedIlvl, reportedNodeType]
      properties:
        signal:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: The losing inference signal that disagreed with the winner
        reportedIlvl:
          type: integer
          description: Normalized ilvl the losing signal reported (part=0 … pr5=6)
        reportedNodeType:
          type: string
          enum: [spec, part, article, pr1, pr2, pr3, pr4, pr5, note, continuation]

    SpecNode:
      type: object
      required: [id, type, text, children, meta]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [spec, part, article, pr1, pr2, pr3, pr4, pr5, note, continuation]
        text:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpecNode'
        meta:
          type: object
          properties:
            vanish:
              type: boolean
              description: Hidden (w:vanish) paragraph — editorial note, not owner-facing
            source:
              type: string
              enum: [ufgs, arcat, cpi, unknown]
            revitParam:
              type: string
            baseVersion:
              type: integer
              minimum: 0
            conflicts:
              type: array
              description: >-
                DOCX inference signal disagreements for this paragraph. Present
                only when non-empty — the hierarchy level was ambiguous and the
                engine picked the highest-priority signal.
              items:
                $ref: '#/components/schemas/SignalConflict'

    SpecTree:
      type: object
      required: [id, section, title, parts]
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
          description: 'CSI section number (e.g. "09 91 26"), or "unknown" if not detected'
        title:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/SpecNode'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'

    SpecSummary:
      type: object
      required: [specId, title, section]
      properties:
        specId:
          type: string
          format: uuid
        title:
          type: string
        section:
          type: string

    LineageHop:
      type: object
      required: [specId, scope, name, contentVersion, originVersion, behindBy]
      description: >
        One node in the derivation chain. `originVersion` and `behindBy` are null
        on the root (it has no parent to drift behind).
      properties:
        specId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [library, project]
          description: Whether this spec lives in a library or a project
        name:
          type: string
          description: Library or project name that owns this spec
        contentVersion:
          type: integer
          description: Current edit generation of this spec
        originVersion:
          type: [integer, 'null']
          description: Content version of the parent this spec was cloned from; null on root
        behindBy:
          type: [integer, 'null']
          description: >
            Parent's current contentVersion minus this copy's originVersion —
            how many parent edits this copy has not yet seen; null on root

    SpecLineage:
      type: object
      required: [chain, originMeta]
      properties:
        chain:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineageHop'
          description: >
            Derivation chain, leaf-first. `chain[0]` is the requested spec;
            the last entry is the root library master.
        originMeta:
          description: >
            Ingest provenance of the chain root (filename, sha256, loader);
            null when the root was not file-ingested.
          oneOf:
            - type: object
              required: [filename, sha256, loader]
              properties:
                filename:
                  type: string
                sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                loader:
                  type: string
            - type: 'null'

    DivisionGeneralSpecRef:
      type: object
      required: [specId, section, title]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
        title:
          type: string

    DivisionGeneralCandidate:
      allOf:
        - $ref: '#/components/schemas/DivisionGeneralSpecRef'
        - type: object
          required: [rank, reason, confidence]
          properties:
            rank:
              type: integer
              minimum: 1
            reason:
              type: string
              enum: [title_keyword, first_in_division]
              description: Why this spec is listed as an advisory fallback candidate
            confidence:
              type: string
              enum: [medium, low]

    DivisionGeneralSpecResult:
      type: object
      required:
        - scope
        - ownerId
        - division
        - expectedSection
        - status
        - generalSpec
        - detectionMethod
        - notes
        - message
        - candidates
      properties:
        scope:
          type: string
          enum: [library, project]
        ownerId:
          type: string
          format: uuid
        division:
          type: string
          pattern: '^\d{2}$'
        expectedSection:
          type: string
          description: Exact section number that would be assigned automatically, e.g. "27 00 00"
        status:
          type: string
          enum: [resolved, missing, not_applicable]
        generalSpec:
          oneOf:
            - $ref: '#/components/schemas/DivisionGeneralSpecRef'
            - type: 'null'
        detectionMethod:
          type: [string, 'null']
          enum: [exact_section, manual, null]
        notes:
          type: [string, 'null']
        message:
          type: string
        candidates:
          type: array
          description: Advisory only; never treated as inherited until manually selected
          items:
            $ref: '#/components/schemas/DivisionGeneralCandidate'

    SetDivisionGeneralSpecBody:
      description: 'Provide exactly one of `generalSpecId` or `status: not_applicable`.'
      oneOf:
        - type: object
          required: [generalSpecId]
          additionalProperties: false
          properties:
            generalSpecId:
              type: string
              format: uuid
              description: Same-scope spec in the requested division to use as the general spec
            notes:
              type: string
              minLength: 1
        - type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [not_applicable]
              description: Records that no in-scope general requirements spec is issued here
            notes:
              type: string
              minLength: 1

    # ── Projects ───────────────────────────────────────────────────────────────

    ProjectListItem:
      type: object
      required: [id, name, sectionNumberFormat]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sectionNumberFormat:
          type: string
          enum: [canonical, dots, compact]

    ProjectSummary:
      type: object
      required: [projectId, name, description, sectionNumberFormat, sources]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        sectionNumberFormat:
          type: string
          enum: [canonical, dots, compact]
        sources:
          type: array
          description: Ordered source libraries (priority ascending)
          items:
            type: object
            required: [libraryId, name, tier, priority]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string
              tier:
                type: string
                enum: [company, client]
              priority:
                type: integer
                minimum: 1

    ProjectWithToc:
      type: object
      required: [projectId, name, description, sectionNumberFormat, sources, toc]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        sectionNumberFormat:
          type: string
          enum: [canonical, dots, compact]
        sources:
          type: array
          description: Ordered source libraries (priority ascending)
          items:
            type: object
            required: [libraryId, name, tier, priority]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string
              tier:
                type: string
                enum: [company, client]
              priority:
                type: integer
                minimum: 1
        toc:
          type: array
          items:
            type: object
            required: [specId, section, title, position]
            properties:
              specId:
                type: string
                format: uuid
              section:
                type: string
              title:
                type: string
              position:
                type: integer
                description: 1-based TOC ordering

    BrokenRef:
      type: object
      required:
        [refId, sourceSpecId, sourceSpecSection, targetSpecSection, referenceText, availableFrom]
      properties:
        refId:
          type: string
          format: uuid
        sourceSpecId:
          type: string
          format: uuid
        sourceSpecSection:
          type: string
          description: CSI section number of the spec containing the reference
        targetSpecSection:
          type: [string, 'null']
          description: Section number the reference points at (as written in the source document)
        referenceText:
          type: string
        availableFrom:
          type: array
          description: >
            Project source libraries that hold the missing target section — an
            actionable "add this section" advisory. Priority order.
          items:
            type: object
            required: [libraryId, name]
            properties:
              libraryId:
                type: string
                format: uuid
              name:
                type: string

    OutboundReference:
      type: object
      required: [sourceSpecId, referenceText, targetSection, targetSpecId, isResolved, isBroken]
      properties:
        sourceSpecId:
          type: string
          format: uuid
        referenceText:
          type: string
        targetSection:
          type: [string, 'null']
          description: Section number this reference points at, if the reference targets a section
        targetSpecId:
          type: [string, 'null']
          format: uuid
        isResolved:
          type: boolean
        isBroken:
          type: boolean

    InboundReference:
      type: object
      required:
        [
          sourceSpecId,
          sourceSection,
          sourceTitle,
          sourceParagraphId,
          referenceText,
          isResolved,
          isBroken,
        ]
      properties:
        sourceSpecId:
          type: string
          format: uuid
        sourceSection:
          type: string
          description: CSI section number of the spec containing the reference
        sourceTitle:
          type: string
        sourceParagraphId:
          type: string
          format: uuid
        referenceText:
          type: string
        isResolved:
          type: boolean
        isBroken:
          type: boolean

    # ── Packages ───────────────────────────────────────────────────────────────

    PackageSummary:
      type: object
      required: [packageId, projectId, name, position]
      properties:
        packageId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          description: 1-based order of the package within its project

    PackageSpecEntry:
      type: object
      required: [specId, section, title, position]
      properties:
        specId:
          type: string
          format: uuid
        section:
          type: string
        title:
          type: string
        position:
          type: integer
          description: 1-based order of the spec within the package

    PackageWithSpecs:
      allOf:
        - $ref: '#/components/schemas/PackageSummary'
        - type: object
          required: [specs]
          properties:
            specs:
              type: array
              items:
                $ref: '#/components/schemas/PackageSpecEntry'

    RevisionSummary:
      type: object
      required: [revisionId, packageId, label, issuedAt, specCount]
      properties:
        revisionId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        label:
          type: string
          description: Issuance label, unique per package ('50% DD', '100% CD', 'Addendum 2')
        issuedAt:
          type: string
          format: date-time
        specCount:
          type: integer
          description: Number of member sections frozen in this revision

    RevisionSpecEntry:
      type: object
      required: [specId, position, tree]
      properties:
        specId:
          type: string
          format: uuid
        position:
          type: integer
          description: 1-based membership order at issuance
        tree:
          $ref: '#/components/schemas/SpecTree'

    RevisionWithTrees:
      type: object
      required: [revisionId, packageId, label, issuedAt, specs]
      properties:
        revisionId:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        label:
          type: string
        issuedAt:
          type: string
          format: date-time
        specs:
          type: array
          items:
            $ref: '#/components/schemas/RevisionSpecEntry'

    # ── Templates ──────────────────────────────────────────────────────────────

    StyleNodeType:
      type: string
      enum: [part, article, pr1, pr2, pr3, pr4, pr5]
      description: >
        CSI paragraph role. Maps to the seven structural levels: `part` (PART 1 –
        GENERAL), `article` (1.1 REFERENCES), `pr1`–`pr5` (A. / 1. / a. / 1) / a)
        paragraph tiers).

    StyleRule:
      type: object
      required: [nodeType, properties]
      properties:
        nodeType:
          $ref: '#/components/schemas/StyleNodeType'
        properties:
          $ref: '#/components/schemas/StyleProperties'

    StyleProperties:
      type: object
      description: >
        OOXML-derived style properties for a CSI paragraph role. Recognized keys
        are documented below; **unknown OOXML keys are preserved** via the JSONB
        catchall schema. All sub-objects also accept additional OOXML properties.
      properties:
        rPr:
          type: object
          description: Run (character) properties
          properties:
            rFonts:
              type: object
              description: Font references
              properties:
                ascii:
                  type: string
                hAnsi:
                  type: string
                cs:
                  type: string
                eastAsia:
                  type: string
              additionalProperties: true
            sz:
              type: integer
              description: Font size in half-points (e.g. 20 = 10 pt)
            b:
              type: boolean
              description: Bold
            i:
              type: boolean
              description: Italic
            caps:
              type: boolean
              description: All-caps
            smallCaps:
              type: boolean
            u:
              type: string
              description: Underline type (e.g. "single")
            strike:
              type: boolean
            color:
              type: string
              description: 'RRGGBB hex or "auto" (e.g. "FF0000")'
            highlight:
              type: string
          additionalProperties: true
        pPr:
          type: object
          description: Paragraph properties
          properties:
            spacing:
              type: object
              properties:
                before:
                  type: integer
                  description: Space before in twips
                after:
                  type: integer
                  description: Space after in twips
                line:
                  type: integer
                  description: Line spacing value in twips
                lineRule:
                  type: string
                  enum: [auto, exact, atLeast]
                contextualSpacing:
                  type: boolean
              additionalProperties: true
            ind:
              type: object
              description: Indentation (twips)
              properties:
                left:
                  type: integer
                right:
                  type: integer
                firstLine:
                  type: integer
                hanging:
                  type: integer
              additionalProperties: true
            jc:
              type: string
              enum: [left, center, right, both, distribute, start, end]
          additionalProperties: true
        numbering:
          type: object
          description: Numbering definition (from `numbering.xml` level)
          properties:
            ilvl:
              type: integer
            numFmt:
              type: string
            lvlText:
              type: string
            start:
              type: integer
          additionalProperties: true
      additionalProperties: true

    TemplateMeta:
      type: object
      required: [id, name, owner, createdAt]
      description: Template identity and metadata without style rules
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique template name
        owner:
          type: [string, 'null']
          description: Firm / owner label, or null if not provided
        createdAt:
          type: string
          format: date-time

    Template:
      allOf:
        - $ref: '#/components/schemas/TemplateMeta'
        - type: object
          required: [rules]
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/StyleRule'
              description: One rule per NodeType (7 max)

    DerivationReport:
      type: object
      required: [nodeTypes, skippedNodeTypes, vanishSkipped]
      description: >
        Per-NodeType derivation audit trail returned alongside the template. Use
        this to review confidence levels, intent disagreements, and rejected
        outlier values before accepting the template as authoritative.
      properties:
        nodeTypes:
          type: array
          items:
            $ref: '#/components/schemas/NodeTypeReport'
          description: Report for each NodeType that had at least one paragraph
        skippedNodeTypes:
          type: array
          items:
            $ref: '#/components/schemas/StyleNodeType'
          description: NodeTypes with zero paragraphs in the source document
        vanishSkipped:
          type: integer
          description: >
            Count of `w:vanish` (hidden) paragraphs excluded from derivation.
            Hidden paragraphs are editorial instructions, not layout specimens.

    NodeTypeReport:
      type: object
      required: [nodeType, paragraphCount, styledCount, modalStyleId, decisions]
      properties:
        nodeType:
          $ref: '#/components/schemas/StyleNodeType'
        paragraphCount:
          type: integer
          description: Total non-vanish paragraphs for this NodeType
        styledCount:
          type: integer
          description: Paragraphs that carried a recognised Word style ID
        modalStyleId:
          type: [string, 'null']
          description: >
            Most-common Word style ID among voters. Used as the **intent**
            reference in §5 consensus derivation: when no majority exists,
            the modal style's own property value is preferred over the median.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/PropertyDecision'
          description: One decision per derived OOXML property path

    PropertyDecision:
      type: object
      required: [path, value, source, confidence, disagreesWithIntent, rejected]
      description: >
        Decision record for a single OOXML property (e.g. `rPr.sz`, `pPr.ind.left`).
      properties:
        path:
          type: string
          description: Dotted OOXML leaf path (e.g. "rPr.b", "pPr.ind.left")
        value:
          description: Chosen property value
        source:
          type: string
          enum: [consensus, intent, median, single, mode]
          description: >
            Algorithm branch that produced this value.
            `consensus` — strict majority (>50%) agreed.
            `intent` — no majority; modal style's own value used as tie-breaker.
            `median` — no majority, no intent, numeric values; lower-middle median chosen.
            `single` — only one styled paragraph for this NodeType.
            `mode` — low-plurality non-numeric fallback (first-seen tie-break).
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of styled voters that agreed on the chosen value
        disagreesWithIntent:
          type: boolean
          description: >
            True when `source` is not `intent` but the modal style's value differs
            from the chosen value. Flag for human review.
        rejected:
          type: array
          description: Alternate values that were not chosen
          items:
            type: object
            required: [value, count]
            properties:
              value:
                description: The rejected property value
              count:
                type: integer
                description: Number of voters that carried this value
