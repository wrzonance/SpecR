      summary: Replace a project's source libraries
      description: >
        Replaces the project's ordered source-library list (priority = array
        order). Each must be a company- or client-tier library (ADR-015 D3); no
        duplicates. Re-ordering does not re-resolve already-derived specs.
      tags: [projects]
