        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sourceLibraryIds]
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  minLength: 1
                sourceLibraryIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                  description: >
                    Ordered source list — priority = array order (1-based). Each must be a
                    company- or client-tier library (ADR-015 D3); no duplicates. Section
                    resolution for POST /projects/{id}/specs walks this list.
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 'Validation failed, unknown library, or reference-tier source'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

