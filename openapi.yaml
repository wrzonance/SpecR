          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 200
                  pattern: '[\s\S]*\S[\s\S]*'
                  description: >
                    Leading/trailing whitespace is trimmed before resolution, and
                    whitespace-only values are rejected; the 1-200 length bounds
                    (Unicode code points) apply to the trimmed value.
      responses:
        '200':
          description: User resolved (existing or newly created)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
