                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [specId, section, position, source]
                        properties:
                          specId:
                            type: string
                            format: uuid
                            description: The project-owned clone's id (not the master's)
                          section:
                            type: string
                          position:
                            type: integer
                            description: 1-based TOC position assigned to the section
                          source:
                            type: object
                            required: [libraryId, name]
                            properties:
                              libraryId:
                                type: string
                                format: uuid
                              name:
                                type: string
                          shadowed:
                            type: array
                            description: Lower-priority sources that also hold this section
                            items:
                              type: object
                              required: [libraryId, name]
                              properties:
                                libraryId:
