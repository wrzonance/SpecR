                            type: array
                            items:
                              type: object
                              required: [libraryId, name, tier, priority]
                              properties:
                                libraryId:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                tier:
                                  type: string
                                  enum: [company, client]
                                priority:
                                  type: integer
