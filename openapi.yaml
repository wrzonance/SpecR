    StandardRollupRow:
      type: object
      required:
        [
          orgCode,
          standardCode,
          citationCount,
          citingSpecs,
          anchors,
          anchorsTruncated,
          registered,
          status,
          currentVersion,
          sourceUrl,
          title,
          lastVerifiedAt,
          notes,
        ]
      properties:
        orgCode: { type: string }
        standardCode: { type: string }
        citationCount: { type: integer }
        citingSpecs:
          type: array
          items: { $ref: '#/components/schemas/StandardCitingSpec' }
        anchors:
          type: array
          description: Paragraph UUIDs citing the standard, capped at anchorCap.
          items: { type: string, format: uuid }
        anchorsTruncated:
          type: boolean
          description: True when citationCount exceeded anchorCap.
        registered:
          type: boolean
          description: True when a registry verdict exists for this standard.
        status: { $ref: '#/components/schemas/StandardStatus' }
        currentVersion: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
    StandardFinding:
      type: object
      description: A cited standard the registry marks superseded or withdrawn.
      required: [type, orgCode, standardCode, status, citingSpecs, anchors]
      properties:
        type: { type: string, enum: [standard_superseded, standard_withdrawn] }
        orgCode: { type: string }
        standardCode: { type: string }
        status: { $ref: '#/components/schemas/StandardStatus' }
        citingSpecs:
          type: array
          items: { $ref: '#/components/schemas/StandardCitingSpec' }
        anchors:
          type: array
          items: { type: string, format: uuid }
    StandardsSummary:
      type: object
      required: [standards, registered, superseded, withdrawn, unverified, findings]
      properties:
        standards: { type: integer, description: Distinct cited standards. }
        registered: { type: integer, description: Cited standards with a registry verdict. }
        superseded: { type: integer }
        withdrawn: { type: integer }
        unverified: { type: integer, description: Cited standards with no last-verified timestamp. }
        findings: { type: integer }
    StandardRecord:
      type: object
      description: A registry record (the PUT verdict response).
      required:
        [
          id,
          orgCode,
          standardCode,
          title,
          currentVersion,
          sourceUrl,
          status,
          lastVerifiedAt,
          notes,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        orgCode: { type: string }
        standardCode: { type: string }
        title: { type: [string, 'null'] }
        currentVersion: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/StandardStatus' }
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StandardVerificationBody:
      type: object
      description: >
        A standards verdict (PUT-replace, ADR-064 §3). Omitted optional fields
        reset to null; status defaults to 'unknown'. The server stamps
        last_verified_at on every write.
      properties:
        status: { $ref: '#/components/schemas/StandardStatus' }
        currentVersion:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: >
            Bounded in Unicode code points. Leading/trailing whitespace is
            trimmed before validation, so the bound applies to the trimmed
            value (same contract as ActorLabel).
        sourceUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2000
          description: 'Bounded in Unicode code points.'
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: >
            Bounded in Unicode code points. Leading/trailing whitespace is
            trimmed before validation, so the bound applies to the trimmed
            value (same contract as ActorLabel).
        notes:
          type: [string, 'null']
          maxLength: 5000
          description: 'Bounded in Unicode code points.'

    # ── Header/footer config (#476, ADR-040) ─────────────────────────────────────

    HeaderFooterScope:
      description: >
        Which scope a header/footer config row is anchored to — exactly one
        of a client library, a project, a design package, or an issued
        revision.
      oneOf:
        - type: object
          required: [kind, clientLibraryId]
          properties:
            kind: { type: string, enum: [client] }
            clientLibraryId: { type: string, format: uuid }
        - type: object
          required: [kind, projectId]
          properties:
            kind: { type: string, enum: [project] }
            projectId: { type: string, format: uuid }
        - type: object
          required: [kind, packageId]
          properties:
            kind: { type: string, enum: [package] }
            packageId: { type: string, format: uuid }
        - type: object
          required: [kind, revisionId]
          properties:
            kind: { type: string, enum: [revision] }
            revisionId: { type: string, format: uuid }
      discriminator:
        propertyName: kind

    HeaderFooterComposition:
      type: object
      description: >
        JSONB-backed header/footer composition (ADR-040). v1 (#208) top-level
        `header`/`footer`/`style` describe a single page variant and are read
        as the `default` variant unless an explicit `variants.default` is
        also present, in which case `variants.default` wins. v2 (#302) adds
        `variants.first`/`variants.even` (Word title-page and even/odd
        headers), `pageNumbering`, and an open `raw` sidecar for
        captured-but-unmodeled OOXML markup plus parser warnings (#306).
        Every nested object is open (`additionalProperties: true`, ADR-021)
        — unknown JSON-safe keys, including at the top level, are preserved
        verbatim on write and round-tripped on read.
      additionalProperties: true
      properties:
        header:
          type: object
          additionalProperties: true
          description: A header region (left/center/right cells, region style, rule line).
          properties:
            left: &headerFooterCell
              type: object
              additionalProperties: true
              properties:
                content:
                  type: array
                  items: &headerFooterField
                    type: object
                    additionalProperties: true
                    required: [kind]
                    properties:
                      kind:
                        type: string
                        enum:
                          [
                            date,
                            sectionTitle,
                            sectionNumber,
                            pageNumber,
                            packageName,
                            revisionName,
                            revisionLabel,
                            projectName,
                            projectNumber,
                            clientName,
                            clientNumber,
                            literal,
                            image,
                          ]
                      source: { type: string, enum: [issuance, current] }
                      text: { type: string }
                      label: { type: string }
                      format: { type: string }
                      prefix: { type: string }
                      suffix: { type: string }
                      imageData:
                        type: string
                        maxLength: 6990508
                        description: >
                          Base64-encoded image bytes for a `kind: "image"`
                          field (#308, ADR-069). The generator never trusts
                          `imageMediaType` — it re-sniffs the actual bytes'
                          magic-byte signature and renders using that result,
                          so a stale/unsupported `imageMediaType` still
                          round-trips here; it just will not render. The
                          `maxLength` is the base64-string cap corresponding
                          to the 5 MB decoded-byte limit
                          (`MAX_IMAGE_BASE64_LENGTH`,
                          `src/lib/image-media-type.ts`), bounded in Unicode
                          code points, enforced by the paired Zod schema
                          (`src/ast/header-footer-schemas.ts`). That cap is a
                          plain string length with no base64 pattern behind
                          it, so the alphabet is not actually constrained to
                          ASCII.
                      imageMediaType: { type: string }
                      widthEmu: { type: integer, minimum: 1 }
                      heightEmu: { type: integer, minimum: 1 }
                      altText: { type: string }
                separator: { type: string }
                style: &headerFooterVisualStyle
                  type: object
                  additionalProperties: true
                  properties:
                    fontFamily: { type: string }
                    fontSizeHalfPt: { type: integer }
                    bold: { type: boolean }
                    italic: { type: boolean }
                    caps: { type: boolean }
                    color: { type: string }
            center: *headerFooterCell
            right: *headerFooterCell
            style: *headerFooterVisualStyle
            ruleLine: &headerFooterRuleLine
              type: object
              additionalProperties: true
              properties:
                enabled: { type: boolean }
                widthTwips: { type: integer }
                color: { type: string }
                style: { type: string }
            table: &headerFooterTable
              type: object
              additionalProperties: true
              description: >
                A table/grid layout for header/footer content (#309,
                ADR-071) — a sibling slot to `left`/`center`/`right`, not a
                replacement; a region may render both a paragraph and a
                table, paragraph first. Cell content reuses the same field
                schema as `left`/`center`/`right`'s `content`; images are
                structurally excluded from table cells at render time, not
                by this schema (ADR-071 decision 3).
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: true
                    required: [cells]
                    properties:
                      cells:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                          properties:
                            content:
                              type: array
                              items: *headerFooterField
                            columnSpan: { type: integer, minimum: 1 }
                            separator: { type: string }
                            style: *headerFooterVisualStyle
                columnWidths:
                  type: array
                  items: { type: integer, minimum: 1 }
                borders: *headerFooterRuleLine
        footer:
          type: object
          additionalProperties: true
          description: A footer region — same shape as `header`.
          properties:
            left: *headerFooterCell
            center: *headerFooterCell
            right: *headerFooterCell
            style: *headerFooterVisualStyle
            ruleLine: *headerFooterRuleLine
            table: *headerFooterTable
        style: *headerFooterVisualStyle
        variants:
          type: object
          additionalProperties: true
          description: >
            Word-style page variants (ADR-040): `default` applies to every
            page unless a more specific variant overrides it; `first`
            overrides the title page (`w:titlePg`); `even` overrides even
            pages (`w:evenAndOddHeaders`).
          properties:
            default: &headerFooterVariant
              type: object
              additionalProperties: true
              properties:
                header:
                  type: object
                  additionalProperties: true
                  properties:
                    left: *headerFooterCell
                    center: *headerFooterCell
                    right: *headerFooterCell
                    style: *headerFooterVisualStyle
                    ruleLine: *headerFooterRuleLine
                    table: *headerFooterTable
                footer:
                  type: object
                  additionalProperties: true
                  properties:
                    left: *headerFooterCell
                    center: *headerFooterCell
                    right: *headerFooterCell
                    style: *headerFooterVisualStyle
                    ruleLine: *headerFooterRuleLine
                    table: *headerFooterTable
                style: *headerFooterVisualStyle
            first: *headerFooterVariant
            even: *headerFooterVariant
        pageNumbering:
          type: object
          additionalProperties: true
          required: [mode]
          description: >
            Page-numbering policy: continuous across the package, or
            restarting at each spec section. `startAt` seeds the first
            rendered number (`w:pgNumType@start`).
          properties:
            mode: { type: string, enum: [continuous, restartPerSpec] }
            startAt: { type: integer }
        raw:
          type: object
          additionalProperties: true
          description: >
            Open sidecar for captured-but-unmodeled header/footer OOXML plus
            parser warnings (#306) — never lost on round-trip.
          properties:
            warnings:
              type: array
              items: { type: string }

    HeaderFooterConfig:
      type: object
      description: A stored header/footer config row for exactly one scope.
      required: [id, scope, config, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/HeaderFooterScope' }
        config: { $ref: '#/components/schemas/HeaderFooterComposition' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HeaderFooterResolutionContext:
      type: object
      description: >
        The anchor chain resolved for a project/package/revision read —
        which client library (if any) feeds the top of the precedence chain,
        and how far down the package/revision chain the anchor reaches.
        `packageId`/`revisionId` are present only when the anchor is at or
        below that level.
      required: [clientLibraryId, projectId]
      properties:
        clientLibraryId: { type: [string, 'null'], format: uuid }
        projectId: { type: string, format: uuid }
        packageId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }

    ResolvedHeaderFooterConfig:
      type: object
      description: >
        The effective header/footer config for a project/package/revision
        anchor, merged client -> project -> package -> revision in that
        precedence order (later layers win per-key, ADR-040). `layers` lists
        every contributing config row low-to-high precedence — the winning
        scope for any given key is `layers[layers.length - 1].scope`,
        whichever layer last touched it; no separate winning-scope field is
        synthesized.
      required: [context, layers, config]
      properties:
        context: { $ref: '#/components/schemas/HeaderFooterResolutionContext' }
        layers:
          type: array
          items: { $ref: '#/components/schemas/HeaderFooterConfig' }
        config: { $ref: '#/components/schemas/HeaderFooterComposition' }
