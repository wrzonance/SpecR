  /packages/{id}/revisions:
    get:
      operationId: listPackageRevisions
      summary: List a package's issued revisions (metadata only, ordered by sortOrder)
      description: >
        The package's issuance timeline — every issued revision as a light
        summary in sortOrder (the per-package issuance clock: 50% DD … IFC,
        addenda, bulletins). Metadata only; the frozen trees are read per
        revision via GET /revisions/{id}. Returns an empty array for a package
        that has issued nothing yet, and 404 for an unknown package.
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Package UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Revision summaries in sortOrder
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RevisionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createPackageRevision
      summary: Issue an immutable revision snapshot of a package (ADR-015 D5)
      description: >
        Freezes the full SpecTree of every member section as JSONB inside one
        transaction — a reproducible point-in-time record of exactly what was
        issued. Post-issuance edits never alter the stored trees. Structured
        requests may persist an addendum comparison base via baseRevisionId.
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Package UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateRevisionLegacyBody'
                - $ref: '#/components/schemas/CreateRevisionStructuredBody'
      responses:
        '201':
          description: Revision issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RevisionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision label or sort order already exists for this package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Validation failed, a member tree cannot be snapshotted losslessly,
            parentRevisionId fails a custody rule (ADR-066): the parent
            revision does not exist, belongs to a different package, or
            already has a parent of its own (nesting depth cannot exceed 1);
            baseRevisionId does not exist or belongs to another package; or
            `mode: 'final'` is blocked by the ADR-079 (#406) issuance-readiness
            gate — one or more outstanding ReadinessFinding entries remain
            across the package's current member specs. Unlike the generate
            endpoints, this route returns `assertReadyForFinal`'s raw message
            (the finding count only) with no `findings` array and no
            readiness-report pointer: it is reached before any revision
            exists, so `GET /packages/{id}/readiness-report` is authoritative
            for the same member specs the gate just evaluated — call it for
            the full list. Pass `overrideReadinessGate: true` to issue anyway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /revisions/{id}:
    get:
      operationId: getRevision
      summary: Read an issued revision's frozen trees (validated on read)
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Revision UUID
          schema:
            type: string
            format: uuid
      responses:
