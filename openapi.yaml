                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/HeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      operationId: putProjectHeaderFooter
      summary: Create or replace a project's header/footer config override
      description: >
        Upsert (ADR-040). The body is the full `HeaderFooterComposition`; see
        `PUT /libraries/{id}/header-footer` for the shape contract.
      tags: [header-footer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeaderFooterComposition'
      responses:
        '200':
          description: Config created or replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/HeaderFooterConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
