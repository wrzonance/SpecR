    StandardCitingSpec:
      type: object
      required: [specId, section]
      properties:
        specId: { type: string, format: uuid }
        section: { type: string }
    StandardsRollup:
      type: object
      description: >
        One-call standards rollup for a project or library (#446). Compiles the
        distinct standards cited in scope, each joined to its global registry
        verdict, plus superseded/withdrawn findings and summary counts.
      required: [scope, standards, findings, summary, anchorCap, notes]
      properties:
        scope:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [project, library] }
            id: { type: string, format: uuid }
        standards:
          type: array
          items: { $ref: '#/components/schemas/StandardRollupRow' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/StandardFinding' }
        summary: { $ref: '#/components/schemas/StandardsSummary' }
        anchorCap:
          type: integer
