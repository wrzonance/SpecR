        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /specs/{id}/readiness-report:
    get:
      operationId: getSpecReadinessReport
      summary: Issuance-readiness dry-run for a single spec (ADR-079)
      description: >
        Every ReadinessFinding an unresolved choice token, a visible specifier
        note, an open Word comment, or a body-level text box currently in
        this spec, alongside the advisory-only highlight report (#406).
        `readyForFinal: true` is exactly the set the issuance-readiness gate
        would let through under `mode: 'final'`; a Draft issuance is never
        gated on these findings.
      tags: [specs]
