      summary: Get a library's convention profile (or inherited built-in)
      description: >
        Returns the library's own convention profile, or the inherited built-in
        industry default when the library has no profile of its own. The
        `meta.inherited` flag is `true` when the returned profile is the
        fallback built-in (`data.libraryId` is then `null`).
