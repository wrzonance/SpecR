          additionalProperties: true
          properties:
            displayName:
              type: string
              description: Template using `{attributeKey}` placeholders
            number:
              type: string
              description: Template for the rendered revision number
        fields:
          type: array
          items:
            type: object
            required: [key]
            additionalProperties: true
            properties:
              key:
                type: string
                minLength: 1
              kind:
                type: string
                enum: [string, integer, number, date, boolean, json]
              required:
                type: boolean
              sequence:
                type: string

    RevisionNomenclatureProfile:
      type: object
      required: [id, projectId, name, types, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
          description: Owning project, or null for a built-in default
        name:
          type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/RevisionNomenclatureType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PutRevisionNomenclatureBody:
      type: object
      required: [name, types]
      properties:
        name:
          type: string
          minLength: 1
        types:
          type: array
          items:
            $ref: '#/components/schemas/RevisionNomenclatureType'

    CloneRevisionNomenclatureBody:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
          format: uuid
          description: A built-in or another project's revision nomenclature profile id

    ParagraphAssociation:
      type: object
      required: [id, label, externalMetadata, createdAt]
      description: External content link associated with a paragraph node (#109).
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
        externalProvider:
          type: string
          description: DMS connector identity (ADR-014 D5). Present together with externalId or absent.
        externalId:
          type: string
          description: Document identifier within the DMS. Present together with externalProvider or absent.
        url:
          type: string
          format: uri
          description: Direct URL provenance for firms without a DMS connector.
        contentHash:
          type: string
          description: sha256 hex digest of the referenced bytes, when known.
        externalMetadata:
          type: object
          additionalProperties: true
          description: Arbitrary provider-specific metadata (empty object when none supplied).
        createdAt:
          type: string
          format: date-time

    CreateAssociation:
      type: object
      required: [label]
      description: >
        Request body for associating external content with a paragraph.
        Either a url, or both externalProvider and externalId, must be provided.
        externalProvider and externalId are both-or-neither — a lone one of the
        pair is rejected (422) even when a url is present.
      dependentRequired:
        externalProvider: [externalId]
        externalId: [externalProvider]
      properties:
        label:
          type: string
          minLength: 1
        externalProvider:
          type: string
          description: DMS connector identity. Always paired with externalId (both-or-neither).
        externalId:
          type: string
          description: Document identifier within the DMS. Always paired with externalProvider (both-or-neither).
        url:
          type: string
          format: uri
          description: Direct URL. Required when externalProvider/externalId are absent.
        contentHash:
          type: string
          description: sha256 hex digest of the referenced bytes.
        externalMetadata:
          type: object
          additionalProperties: true
          description: Arbitrary provider-specific metadata.

    NumberingProfile:
      type: object
      description: >
        Extracted numbering configuration from a DOCX file, and the WRITE
        contract for POST/PATCH /numbering-profiles. Carries tiers (CSI
        hierarchy), numbering (numId→levels map), styleLadder (style→tier
        map), and articleIlvl (the ilvl at which the Article tier sits, always
        >= 1 — ilvl 0 is the PART tier). Open schema — unknown keys are
        preserved for forward-compatibility.


        `tier` on each numbering[].levels[] and styleLadder[] entry is a
        DERIVED annotation, not authoritative input (ADR-067): classification
        is driven by ilvl + articleIlvl alone. Omit `tier` and the server
        fills it from tierForIlvl(ilvl, articleIlvl); declare one that
        disagrees with that derivation and the write is rejected (422,
        entry-naming message). articleIlvl becomes required as soon as
        numbering or styleLadder is non-empty, since the derivation is
        undecidable without it.
      additionalProperties: true
      required: [tiers, numbering, styleLadder]
      properties:
        tiers:
          type: object
          additionalProperties: true
          required: [part]
          description: >
            CSI tier shape. `part` is required and pinned to the CSI integer model
            (integer style, 1 to 5 parts); article/paragraph/subparagraph are
            optional. Unknown keys are preserved (open schema).
          properties:
            part:
              type: object
              additionalProperties: true
              required: [numberStyle, maxCount]
              properties:
                numberStyle:
                  type: string
                  enum: [integer]
                  description: CSI parts are integer-numbered.
                maxCount:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Maximum PART count (CSI bound, at most 5).
            article:
              type: object
              additionalProperties: true
              properties:
                maxCount:
                  type: integer
                  minimum: 1
            paragraph:
              type: object
              additionalProperties: true
              properties:
                maxCount:
                  type: integer
                  minimum: 1
            subparagraph:
              type: object
              additionalProperties: true
              properties:
                maxCount:
                  type: integer
                  minimum: 1
        numbering:
          type: array
          description: Per-numId level definitions.
          items:
            type: object
            additionalProperties: true
            required: [numId, levels]
            properties:
              numId:
                type: integer
              levels:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  required: [ilvl]
                  properties:
                    ilvl:
                      type: integer
                      minimum: 0
                    tier:
                      type: string
                      enum: [part, article, paragraph, subparagraph]
                      description: >
                        Optional — derived from ilvl + articleIlvl when
                        omitted (ADR-067); a declared value that disagrees
                        with the derivation is rejected (422).
                    labelTemplate:
                      type: string
                    numFmt:
                      type: string
        styleLadder:
          type: array
          description: Per-styleId tier assignment derived from the style cascade.
          items:
            type: object
            additionalProperties: true
            required: [styleId, numId, ilvl]
            properties:
              styleId:
                type: string
              numId:
                type: integer
              ilvl:
                type: integer
                minimum: 0
              tier:
                type: string
                enum: [part, article, paragraph, subparagraph]
                description: >
                  Optional — derived from ilvl + articleIlvl when omitted
                  (ADR-067); a declared value that disagrees with the
                  derivation is rejected (422).
        articleIlvl:
          type: integer
          minimum: 1
          description: >
            Ilvl of the Article tier. Always >= 1 — ilvl 0 is reserved for the
            PART tier, so the Article level can never be 0. Required as soon
            as numbering or styleLadder is non-empty — the server needs it to
            derive (and validate) each entry's tier (ADR-067); a body that
            supplies rules without it is rejected (422).

    NumberingProfileRead:
      type: object
      description: >
        Lenient READ contract for a persisted numbering profile (ADR-061, #323).
        Same shape as `NumberingProfile` — required fields, JS types, the closed
        `tier` vocabulary, the `numberStyle: integer` literal, open-schema
        passthrough, AND the structural floor of every numeric field (`ilvl >= 0`,
        counts `>= 1`) are all still enforced — but the numeric POLICY bounds a
        write-side tightening could newly impose are relaxed to that structural
        floor: `part.maxCount` drops the CSI ceiling of 5, and `articleIlvl`
        relaxes from `>= 1` to `>= 0` (the legacy #320 case). It is NOT a rubber
        stamp — a sub-structural value like a negative `articleIlvl` is corruption
        (it would misparse downstream) and still fails. Reads re-validate stored
        JSONB, so a row persisted under an older, looser write contract reads back
        cleanly instead of 500ing once the write schema tightens; writes stay
        strict at ingress against `NumberingProfile`. This is the response shape
        for numbering-profile reads (`NumberingProfileRow.rules`).
      additionalProperties: true
      required: [tiers, numbering, styleLadder]
      properties:
        tiers:
          type: object
          additionalProperties: true
          required: [part]
          description: >
            CSI tier shape. `part` is required and pinned to the CSI integer model
            (integer style); article/paragraph/subparagraph are optional. Numeric
            bounds are relaxed on read (see schema description). Unknown keys are
            preserved (open schema).
          properties:
            part:
              type: object
              additionalProperties: true
              required: [numberStyle, maxCount]
              properties:
                numberStyle:
                  type: string
                  enum: [integer]
                  description: CSI parts are integer-numbered.
                maxCount:
                  type: integer
                  minimum: 1
                  description: >
                    Maximum PART count. Read-lenient — the CSI policy ceiling of 5 is
                    write-only, but the structural floor (>= 1) is still enforced.
            article:
              type: object
              additionalProperties: true
              properties:
                maxCount:
                  type: integer
                  minimum: 1
            paragraph:
              type: object
              additionalProperties: true
              properties:
                maxCount:
                  type: integer
                  minimum: 1
            subparagraph:
              type: object
              additionalProperties: true
              properties:
                maxCount:
                  type: integer
                  minimum: 1
        numbering:
          type: array
          description: Per-numId level definitions.
          items:
            type: object
            additionalProperties: true
            required: [numId, levels]
            properties:
              numId:
                type: integer
              levels:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  required: [ilvl, tier]
                  properties:
                    ilvl:
                      type: integer
                      minimum: 0
                    tier:
                      type: string
                      enum: [part, article, paragraph, subparagraph]
                    labelTemplate:
                      type: string
                    numFmt:
                      type: string
        styleLadder:
          type: array
          description: Per-styleId tier assignment derived from the style cascade.
          items:
            type: object
            additionalProperties: true
            required: [styleId, numId, ilvl, tier]
            properties:
              styleId:
                type: string
              numId:
                type: integer
              ilvl:
                type: integer
                minimum: 0
              tier:
                type: string
                enum: [part, article, paragraph, subparagraph]
        articleIlvl:
          type: integer
          minimum: 0
          description: >
            Ilvl of the Article tier. Read-lenient — the write-side policy bound is
            relaxed from `>= 1` to its structural floor `>= 0`, so a legacy
            `articleIlvl: 0` row reads back cleanly while a negative (corrupt) value
            still fails.

    NumberingProfileRow:
      type: object
      description: A persisted numbering profile row from the database.
      required: [id, libraryId, name, rules, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: [string, 'null']
          format: uuid
          description: Owning library UUID, or null for the built-in CSI Default.
        name:
          type: string
        rules:
          # Read-lenient (ADR-061, #323): reads re-validate stored JSONB, so this
          # response can carry a legacy row whose values fall outside the strict
          # write bounds. Write request bodies still ref the strict NumberingProfile.
          $ref: '#/components/schemas/NumberingProfileRead'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    # ─── Standards registry (#446, ADR-064) ─────────────────────────────────────
    StandardStatus:
      type: string
