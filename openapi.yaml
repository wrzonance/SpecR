                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RevisionWithTrees'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /revisions/{id}/generate:
    post:
      operationId: generateRevisionManual
      summary: Render an issued manual DOCX from frozen package revision snapshots
      description: >
        Renders the target package revision from `package_revision_specs.tree`, not
        live paragraph rows, so old issuances remain reproducible after database
        edits. Addendum mode uses the request `baseRevisionId` when supplied,
        otherwise the target revision's stored `baseRevisionId`; when neither
        is present the full issued manual is rendered. Addendum mode compares
        the target and base revision snapshots by section-level AST equality and
        emits only sections whose frozen trees differ, under an addendum cover
        listing the affected sections. Header/footer content is resolved and
        rendered per #481: the client → project → package → revision
        `header_footer_configs` chain is resolved for the target revision being
        rendered (never `baseRevisionId`, even in addendum mode) and rendered
        into every emitted spec section's own OOXML section. The addendum /
        front-matter cover section itself stays headerless (no header/footer
        reference in its `sectPr`), exactly as the project manual's cover does —
        only the emitted spec sections receive the resolved header/footer. A
        revision with zero configured layers anywhere in its chain falls back to
        the pre-#481 output — no header or footer, cover/front-matter revision
        identity unchanged.
      tags: [packages]
      parameters:
        - name: id
          in: path
          required: true
          description: Target revision UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  format: uuid
                  description: >
                    Style template applied to every rendered section. Omitted →
                    the seeded UFGS-Default template; absent default → unstyled
                    200. Unknown id → 404.
                sectionNumberFormat:
                  type: string
                  enum: [canonical, dots, compact, spaced-compact]
                  default: canonical
                  description: >
                    Presentation format for generated section numbers in each
                    section title and confidently identified Section references.
                baseRevisionId:
                  type: string
                  format: uuid
                  description: >
                    Explicit base revision for addendum mode. Must belong to the
                    same package as the target revision. Overrides the target's
                    stored baseRevisionId; when both are omitted, renders the
                    full issued manual.
                mode:
                  $ref: '#/components/schemas/IssuanceMode'
                overrideReadinessGate:
                  type: boolean
                  description: >
                    Unaudited escape hatch (ADR-079 decision 8, #406) — renders
                    despite outstanding findings. Ignored unless mode is final.
      responses:
        '200':
          description: DOCX manual file stream
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >
            Invalid addendum comparison, no changed sections to render, or
            `mode: 'final'` is blocked by the ADR-079 (#406) issuance-readiness
            gate. In addendum mode the gate covers only the sections that
            actually changed against the base revision (#406 decision 15) — a
            carried-over section already evaluated at a prior issuance is
            never re-gated here. This route gates an immutable revision
            snapshot, which has no readiness-report endpoint of its own, so
            the blocking findings are returned inline as `findings` rather
            than only a count — a live spec/package readiness report can
            since have diverged from what this frozen revision actually
            contains. Pass `overrideReadinessGate: true` to generate anyway.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      findings:
                        type: array
                        items: { $ref: '#/components/schemas/ReadinessFinding' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates:
