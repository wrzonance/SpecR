    patch:
      operationId: patchProject
      summary: Update project settings
      description: >
        Updates a project's mutable settings. At least one of `name`,
        `sectionNumberFormat`, or `clientId` must be provided. The name must be
        non-empty. There is no uniqueness constraint on project names, so there
        is no 409 path.
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [name]
                - required: [sectionNumberFormat]
                - required: [clientId]
              properties:
                name:
                  type: string
                  minLength: 1
                sectionNumberFormat:
                  type: [string, 'null']
                  enum: [canonical, dots, compact, spaced-compact, null]
                  description: >
                    Project override for generated section numbers. Explicit null
                    clears it so the associated client's firm default applies.
                clientId:
                  type: [string, 'null']
                  format: uuid
                  description: >
                    Associate the project with a client (ADR-054). Explicit null
                    disassociates; an unknown client is rejected 422.
      responses:
        '200':
          description: Updated project settings
          content:
            application/json:
