        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: resolveUser
      summary: Resolve or create a user by label
      description: >
        Idempotently resolves a user by exact-match `label` (ADR-052 D6), creating
        one if none exists. Always 200 — a repeat call with the same label returns
        the same `id`. `label` is case-sensitive and not yet authenticated identity
        (spoofable pre-#43); it carries the same trust tier as the ADR-018 lock
        holder today.
      tags: [users]
      requestBody:
        required: true
